# PACK: Package, an AI behaviour an actor runs: general data and schedule, conditions,
# idles, the template it instantiates with its data input values (locations, targets,
# scenes, raw values), the procedure tree of a template, and the begin/end/change idles
# and topics.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15540-L15761 - member order, PKDT, PSDT, PKCU,
#     the package data values, the procedure tree branch (ANAM, NNAM, conditions, PRCB,
#     PNAM, FNAM, PKC2, PFO2), the begin/end/change blocks. Helpers: script data
#     (L3444-L3475, the package variant, common/ScriptAttachment.toml), the base form
#     component block (L5984-L6832, kept raw), the condition count (L2251) and list
#     (L4750-L4840, common/Condition.toml), the idle animations
#     (wbDefinitionsCommon.pas L8900-L8933), the location (L3710-L3743,
#     common/PackageLocation.toml), the target (L3746-L3774), the topic data (L3901-L3913),
#     the data input list (L7988-L7994) and the interrupt flags (L7925-L7942).
#   corpus: the 4,578 PACK records (Starfield.esm 3,548, ShatteredSpace 568, SFBGS00D 246,
#     SFBGS050 173, SFBGS003 43; form versions 581 and 582; none compressed), 2026-10-14:
#     order EDID [VMAD] PKDT PSDT CTDA* [idle animations] [CNAM] [QNAM] [FLAV] PKCU
#     (ANAM [CNAM|PLDT|PTDA CITC CTDA*|STSC])* UNAM* XNAM [procedure tree] (UNAM BNAM PNAM)*
#     POBA INAM PDTO POEA INAM PDTO POCA INAM PDTO; PKDT, PSDT, PKCU and PTDA 12 bytes,
#     PLDT 16, PRCB 8, PFO2 16, PDTO 8, UNAM and XNAM 1, data-input CNAM 1 or 4. Every record
#     decodes with nothing left over and re-encodes identically. No top-level condition
#     list has a CITC; the target and branch lists do.
#
# Data input values are alternatives selected by which subrecord follows the ANAM (the
# first signature decides), so each is an optional member here. The CNAM value itself is
# a union whose layout the ANAM text selects (bool, integer, float, ...): kept raw.
