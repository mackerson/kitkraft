# IDLE: Animation (idle), a node in the idle animation tree: conditions decide whether it
# plays, ANAM links it to its parent and previous sibling (an IDLE or an actor action).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L12667-L12685 - member order, DNAM, ENAM, ANAM
#     (parent and previous, AACT or IDLE), FNAM and its bits, GNAM, FULL. Conditions:
#     L4750-L4840 (common/Condition.toml; IDLE has no CITC count upstream).
#   corpus: the 1,302 IDLE records (Starfield.esm 1,158, ShatteredSpace 94, SFBGS004 30,
#     SFBGS050 15, SFBGS00D 5; form versions 581, 582), 2026-10-14: order [EDID] (CTDA
#     [CIS1])* DNAM [ENAM] ANAM FNAM [GNAM] [FULL]; ANAM 8, FNAM 1, CTDA 32, no CITC and no
#     CIS2. ANAM slots resolve to IDLE (740), AACT (437) or null (1,427). No record is
#     compressed. Every record decodes and re-encodes identically. EDID is absent from 1
#     record.
#
# FNAM bit 0x10 is unnamed upstream (set in 5 records) and stays unnamed.
