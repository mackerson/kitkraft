# GMST: a game setting. EDID (universal, M2.B2), the DATA value (M2.B9) and XALG (lane B
# round 5, M3.B6) are typed.
#
# Sources (ADR 0005):
#   xedit: the GMST definition of wbDefinitionsSF1.pas at the pinned revision
#     (L12355-L12366): member order EDID, XALG, DATA; XALG a 64-bit flag set (its bit names
#     are marked unverified upstream, so it is kept as a plain integer, as in the other
#     records that have XALG); DATA a union chosen by the EditorID's first letter (the
#     decider in wbDefinitionsCommon.pas L5887-L5911: s string, i signed, f float,
#     b boolean, u unsigned). Upstream reads any other letter as a signed integer; this
#     definition keeps such a DATA raw instead (no corpus record has one).
#   corpus: scan of the GMST top groups of the 14 official ESMs (2026-10-14): 2,418 records
#     (Starfield.esm 2,312, SFBGS004.esm 52, ShatteredSpace.esm 28, SFBGS00D.esm 26), form
#     versions 581/582, shapes "EDID DATA" (2,396) and "EDID XALG DATA" (22). Every record
#     has an EDID; its first byte is one of b (7 records), f (1,227), i (94), s (1,054),
#     u (36); every DATA is 4 bytes; every b value is 0 or 1; every XALG is 8 bytes. All 14
#     files are localized. `cargo xtask parity` 2026-10-15 (lane B round 5): all 2,418
#     records decode through this definition with 0 failed occurrences and 0 re-encode
#     differences.
#   uesp-skyrim: the Skyrim GMST page says the DATA type follows the first character of
#     the EditorID (the shared convention, here only a hypothesis for Starfield).
#   uesp-starfield: the Starfield GMST page names the letters: b boolean (0 or 1 in an
#     integer), f float, i signed integer, s string (an lstring ID), u unsigned integer, and
#     DATA as always 4 bytes. Level 4: it agrees with the xEdit decider.
