# GMST: a game setting. EDID (universal, M2.B2) and the DATA value (M2.B9) are typed; XALG
# stays opaque.
#
# Sources (ADR 0005):
#   corpus: scan of the GMST top groups of the 14 official ESMs (2026-10-14): 2,418 records
#     (Starfield.esm 2,312, SFBGS004.esm 52, ShatteredSpace.esm 28, SFBGS00D.esm 26), form
#     versions 581/582, shapes "EDID DATA" (2,396) and "EDID XALG DATA" (22). Every record
#     has an EDID; its first byte is one of b (7 records), f (1,227), i (94), s (1,054),
#     u (36); every DATA is 4 bytes; every b value is 0 or 1. All 14 files are localized.
#   uesp-skyrim: the Skyrim GMST page says the DATA type follows the first character of
#     the EditorID (the shared convention, here only a hypothesis for Starfield).
#   uesp-starfield: the Starfield GMST page names the letters: b boolean (0 or 1 in an
#     integer), f float, i signed integer, s string (an lstring ID), u unsigned integer, and
#     DATA as always 4 bytes; it names no forbidden source. Level 4: it supplies the
#     letter-to-type names; the corpus confirms sizes and letters on every record.
#
# The pinned xEdit definition (level 2) is not cited yet: it has not been read in this
# round. XALG (8 bytes, 22 records) has no sourced field names and stays opaque.
signature = "GMST"
name = "GameSetting"
source = "corpus: GMST records of the 14 official ESMs (4 files have a GMST group), scan 2026-10-14"
confidence = "corpus"

[[member]]
sig = "EDID"
name = "EditorId"
type = "zstring"
note = "observed 4..71 bytes; its first byte selects the DATA layout"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:File_Format_Conventions",
  "corpus: universal subrecord scan 2026-10-14: all 265,346 EDID payloads in the 14 official ESMs end in their only NUL and are printable ASCII",
]

[[member]]
sig = "XALG"
name = "Xalg"
type = "opaque"
card = "optional"
note = "observed 8 bytes, in 22 records"

[[member]]
sig = "DATA"
name = "Value"
type = "union"
decider = "edid-prefix"
note = "4 bytes in every corpus record; a prefix no variant names keeps DATA raw"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format/GMST",
  "uesp-starfield: https://starfieldwiki.net/wiki/Starfield_Mod:Mod_File_Format/GMST",
  "corpus: GMST scan 2026-10-14: EDID prefixes b/f/i/s/u only, every DATA 4 bytes, every b value 0 or 1",
]
variants = [
  { when = "b", name = "Bool", type = "u32", note = "0 or 1 in every corpus record" },
  { when = "f", name = "Float", type = "f32" },
  { when = "i", name = "Int", type = "i32" },
  { when = "s", name = "String", type = "lstring" },
  { when = "u", name = "Unsigned", type = "u32" },
]
