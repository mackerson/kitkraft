# GMST: subrecord inventory. The universal subrecords (EDID, and FULL where present) are
# typed (M2.B2, sources on each member); every other payload is opaque until sourced.
#
# Source (ADR 0005 "inventory" row): corpus scan of the GMST top group in Starfield.esm, ShatteredSpace.esm,
# Constellation.esm, OldMars.esm and SFBGS003/004/006/007/008/00D/047/050.esm (2026-10-14):
# 2418 records, form versions 581/582, shapes "EDID DATA" (2396) and "EDID XALG DATA" (22).
#
# Member names are placeholders derived from the signature; they get real names when a
# layout is decided, which is a breaking change for queries.
signature = "GMST"
name = "GameSetting"
source = "corpus: GMST records of the official ESMs (12 files with a GMST group)"
confidence = "corpus"

[[member]]
sig = "EDID"
name = "EditorId"
type = "zstring"
note = "observed 4..71 bytes"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:File_Format_Conventions",
  "corpus: universal subrecord scan 2026-10-14: all 265,346 EDID payloads in the 14 official ESMs end in their only NUL and are printable ASCII",
]

[[member]]
sig = "XALG"
name = "Xalg"
type = "opaque"
card = "optional"
note = "observed 8 bytes, in 22 records"

[[member]]
sig = "DATA"
name = "Data"
type = "opaque"
note = "observed 4 bytes"
