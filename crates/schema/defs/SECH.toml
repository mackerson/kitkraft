# SECH: Sound Echo Marker, a placeable object that marks where a sound plays and how its
# echo behaves (echoes of distant sounds in the open world).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17467-L17523 - member order, the record flags,
#     the description string, the looping sound, and the list of echoes (each echo a
#     start marker, an event, a sound, a voice count, a duration, an action at limit, a
#     use, a trigger release, a description, conditions and an end marker). Helpers:
#     EDID (L3182), script data (L3407-L3411, kept opaque), object bounds
#     (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962),
#     PTT2 (L3965-L3978), SNTP/SNBH (L3919-L3920), DEFL (L3963), XALG (L3230), the base
#     form component block (L5984-L6832), the sound reference (L2197-L2227,
#     common/SoundReference.toml), the boolean enumeration (wbDefinitionsCommon.pas
#     L7514-L7521, common/Bool8.toml), conditions (CITC L2251, L4750-L4840,
#     common/Condition.toml).
#   corpus: kitkraft-esm tests/sech_types.rs (sech_types_full), 2026-11-03 - the 32 SECH
#     records of the 14 official ESMs: 15 signatures, 100 echoes; ANAM, BNAM, CNAM, DNAM,
#     ENAM and ECHE 100 times (one per echo), ECHO 68, ECHD 32, ECTE 67 (16 bytes), ECSH
#     67 (40 bytes), NNAM 2 (37 to 128 bytes, both the record's description before the
#     first echo; none inside the echoes), XALG 1 (8 bytes). No VMAD, OPDS, PTT2,
#     SNTP, SNBH, DEFL, ECHL, BFCB, CITC or CTDA occurs. Every record decodes and
#     re-encodes identically.
