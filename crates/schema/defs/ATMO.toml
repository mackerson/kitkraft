#     reflection payload holding the differences from that parent (L9873).
#     Upstream also lists the base form component block (L9870); no official
#     record has it, so it is left out (a plugin that has one keeps it raw).
#   corpus: the atmo_types scan in crates/esm/tests/atmo_types.rs checks this
#     definition against every official ATMO record (599 in the 14 ESMs): every
#     subrecord is placed, every placed subrecord decodes, and the re-encoding
#     reproduces every record.
#
# The reflection payloads (REFL and RDIF) are kept raw: the chunk format
# crates/doc/src/refl.rs decodes describes its classes and fields in the payload
# itself, and the schema has no type for it.
#
# Order: REFL never occurs with RFDP or RDIF in an official ATMO record, so its
# position follows the pinned xEdit file.
