# TERM: Terminal, a piece of furniture-like hardware that opens a terminal menu (TMLM)
# when used. Terminals use furniture markers and a furniture template.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L18155-L18249 - member order, the record flags, the
#     script data with PERK-style fragments, DNAM (TMLM), NAM1 (art theme, L8342-L8360),
#     PNAM, FNAM and its bits, JNAM, RADR, the condition block, MNAM, GNAM, WBDT, FTMP, FNPR,
#     XMRK, SNAM, STRV, the object template, STOP. Helpers: object bounds
#     (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), PTT2
#     (L3965-L3978), SNTP/SNBH (L3919-L3920), DEFL (L3963), XALG (L3230), the base form
#     component block (L5984-L6832, kept raw), FULL (L3184), the generic model
#     (L7008-L7029), destruction data (L3829-L3890), keywords (wbDefinitionsCommon.pas
#     L8935-L8951), PRPS (L5679-L5686), FTYP (L5699), NTRM (L5676), the byte colour
#     (wbDefinitionsCommon.pas L6954-L6968), ALSH/ACSH (L2331-L2332), ATTX (L5700), CITC
#     (L2251), conditions (L4750-L4840), MNAM (L6834-L6866), the marker parameters
#     (L6881-L6892), the object template (L6961-L6974).
#   corpus: the 501 TERM records (Starfield.esm 368, ShatteredSpace 76, SFBGS050 31,
#     SFBGS00D 24, SFBGS003 2; form versions 581, 582), 2026-10-14: order EDID VMAD OBND
#     ODTY [PTT2] [SNTP] [component blocks] [DNAM] NAM1 [FULL] MODL MOLM* FLLD [XFLG] KSIZ
#     KWDA [PRPS] [FTYP] PNAM FNAM JNAM MNAM GNAM WBDT [FTMP] [FNPR] [XMRK] [SNAM] STOP;
#     DNAM 4 (TMLM), NAM1 1, PNAM 4, FNAM/JNAM/GNAM 2, MNAM 4, WBDT 1 (0 in every record),
#     FTMP 4 (FURN), SNAM 28. Every record has VMAD (482 of them only attach
#     TerminalScript). No record is compressed. Every record decodes and re-encodes
#     identically.
#
# What stays opaque, and why: VMAD (fragments and property values are unions); WBDT, which
# upstream declares as an unused zero-length payload while every official one is a single
# zero byte. FNAM bit 0x4 and MNAM bit 0x20000000 are unnamed upstream and stay unnamed.
