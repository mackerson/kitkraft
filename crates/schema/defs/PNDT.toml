# PNDT: Planet, one body of a star system (planet, moon, asteroid belt, station): the
# worldspaces it hosts, the biomes it is made of (with chance, fauna, flora and resources),
# its surface tree, and the body block (BDST..BDED) with the orbital, physical, catalogue,
# atmosphere and biome-noise data, followed by temperature, density and the resource seed.
# Every official PNDT record is compressed.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L16048-L16225 - member order and every layout:
#     CNAM master worldspaces, EOVR edited worldspaces, PPBD biomes, FNAM surface tree, GNAM
#     scan multiplier, the body group (BDST, ANAM, XEMP, CNAM body type, DNAM space cell,
#     ENAM orbital data, FNAM orbited data, GNAM galaxy data, HNAM catalogue data, INAM
#     atmosphere, KNAM biome noise, NNAM player knowledge, BDED), TEMP, DENS, PHLA, RSCS.
#     Helpers: latitude and longitude (L5971-L5981, 64-bit floats), the base form component
#     block (L5984-L6832, kept raw), the boolean enumeration (wbDefinitionsCommon.pas
#     L7514-L7521).
#   corpus: the 1,786 PNDT records (Starfield.esm 1,765, ShatteredSpace 11, SFBGS050 5,
#     SFBGS00D 4, SFBGS003 1; form versions 581, 582; all compressed), 2026-10-14: every
#     record fits the order below (41 distinct sequences); master worldspace entries 20
#     bytes, edited ones 21, PPBD 36 bytes and up (up to 8 per record), ENAM 72, body FNAM
#     24, body GNAM 12, INAM 16. The fauna, keyword and trailing element counts inside PPBD
#     are 32-bit in every record (a 36-byte PPBD is nine 4-byte fields). The length-prefixed strings in DNAM, HNAM and KNAM carry a
#     32-bit byte count that includes the terminating NUL (an empty string is a count of 0
#     and no bytes). Every record decodes and re-encodes identically.
#
# CNAM, FNAM and GNAM each occur twice with different layouts: once at the top level and
# once inside the body group. The schema keeps them apart by position (different member
# names); tools that look a layout up by signature alone cannot (plan/STATUS.md Requests).
#
# The format has no 32-bit length-prefixed string, so each such string is an explicit
# `...Length` field followed by that many bytes (`count_from`); keep the two in sync when
# editing.
signature = "PNDT"
name = "Planet"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L16048-L16225"
evidence = [
  "corpus: the 1,786 PNDT records of the 14 official ESMs (all compressed, decompressed first), 2026-10-14 scan; every record decodes and re-encodes identically",
]
confidence = "corpus"
flags = [["Compressed", 0x40000]]

