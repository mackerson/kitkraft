# EXPL: Explosion. An explosion in Starfield is a base object (its Placed Object) that a
# projectile, a script or a reference can make detonate. The data block carries the light,
# the two sounds, the impact data set, the placed object and the projectile it spawns, the
# condition that gates it, the force and the damage and image-space radii, the stagger, the
# spawn point and the duration; the record also carries the image space modifier and the
# damage types it applies.
#
# Source (ADR 0004): the record definition at L11781-L11839 of wbDefinitionsSF1.pas at the
# pin, in member order, and the helpers it names: the editor ID (L3182), the object bounds
# (wbDefinitionsCommon.pas L9348-L9365), the dirtiness scale (L3921-L3923), the object
# palette defaults (L3925-L3962), the default layer (L3963), the XALG flags (L3230; the bit
# list at L3195-L3228 is marked by upstream as copied from FO76 and probably wrong), the
# base form components (L5984-L6832, the shared BfcbBlock), the name (L3184), the generic
# model (L7008-L7029, the shared Model), the enchantment (wbDefinitionsCommon.pas
# L8760-L8774), the image space modifier (L11792), the data block (L11793-L11837, with the
# sound reference L2197-L2211, the base object signatures L43-L54, the sound level
# L2574-L2581 and the stagger L11822-L11828), and the damage type array
# (wbDefinitionsCommon.pas L8728-L8738).
#
# The 14 official ESMs hold 359 EXPL records; the expl_types scan in
# crates/esm/tests/expl_types.rs checks this definition against them: every subrecord is
# placed, every placed subrecord decodes, and the re-encoding reproduces every record.
