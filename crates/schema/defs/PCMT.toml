# PCMT: Planet Content Manager Tree, the root of a procedural placement tree. Its child
# branch nodes (PCBN) name it as their parent (PRTN); the tree itself lists no children in
# any official file (its PCCB list is empty everywhere).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15799-L15826 - member order, the record flags,
#     NAM1/NAM2/NAM5 widths and values, the PCCB node list, conditions and keywords.
#     Helpers: the condition count (L2251) and list (L4750-L4840, common/Condition.toml),
#     the base form component block (L5984-L6832, common/BfcbBlock.toml, kept raw), the
#     keyword list without a count (wbDefinitionsCommon.pas L8935-L8951) and the boolean
#     enumeration (wbDefinitionsCommon.pas L7514-L7521).
#   corpus: the 5 PCMT records (all in Starfield.esm, form version 581), 2026-10-14: every
#     record is EDID NAM1 NAM2 NAM5 CITC [CTDA...]; NAM1/NAM2 are 4 bytes, NAM5 1 byte,
#     CITC 4 bytes, CTDA 32 bytes; no BFCB block, PCCB or KWDA occurs. All 5 decode and
#     re-encode identically.
#
# Members the corpus never shows keep `confidence = "reference"`.
