# MOVT: MovementTypeForm, the movement-type form of the creature movement system: it
# names the type, carries the full movement data (maximum speed, acceleration and
# rotation speed for each of the six directions plus the forward axis), the flight
# angle gain, the fast-walk multiplier, a clamp flag and the character-only display
# marker.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14608-L14619 - member order, EDID (L14609),
#     MNAM (L14610), SPED (L14611, its layout L7771-L7789, the movement-speed group
#     L7757-L7769 and the rotation-speed group L7743-L7755), LNAM (L14612), KNAM
#     (L14613), INTV (L14614-L14617, its first field the shared Bool8 enumeration,
#     wbDefinitionsCommon.pas L7514-L7521) and BOLV (L14618).
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# The 14 official ESMs hold 43 MOVT records; the movt_types scan in
# crates/esm/tests/movt_types.rs checks this definition against them: every
# subrecord is placed, every placed subrecord decodes, and the re-encoding
# reproduces every record.
