# FURN: Furniture, an object an actor uses through markers (chairs, beds, workbenches,
# crafting stations, outpost fabricators and research stations). WBDT says which workbench
# menu, if any, the furniture opens.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L12126-L12218 - member order, the record flags,
#     PNAM, WTFM, FNAM and its bits, JNAM, INAM, GNAM, WBDT and the bench type values, NAM1,
#     FTMP, FNPR, XMRK, NNAM (a list of name and model-path string pairs), STOP. Helpers:
#     script data (L3407-L3411, kept opaque), object bounds (wbDefinitionsCommon.pas
#     L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), PTT2 (L3965-L3978), SNTP/SNBH
#     (L3919-L3920), XALG (L3230), the base form component block (L5984-L6832, kept raw),
#     FULL (L3184), the generic model (L7008-L7029), destruction data (L3829-L3890),
#     keywords (wbDefinitionsCommon.pas L8935-L8951), PRPS (L5679-L5686), FTYP (L5699), NTRM
#     (L5676), the byte colour (wbDefinitionsCommon.pas L6954-L6968), ALSH (L2331), ATTX
#     (L5700), container items (L2293-L2327), MNAM (L6834-L6866), the FNPR marker
#     (common/FurnitureEntryPoint.toml), the marker parameters (L6881-L6892).
#   corpus: the 1,045 FURN records (Starfield.esm 899, ShatteredSpace 83, SFBGS050 39,
#     SFBGS00D 11, SFBGS006 7, SFBGS003 4, SFBGS004 1, SFBGS047 1; form versions 581, 582),
#     2026-10-14: order EDID [VMAD] OBND ODTY [OPDS] [PTT2] [SNTP] [SNBH] [XALG] [component
#     blocks] [FULL] MODL MOLM* FLLD [XFLG] [DEST block] [KSIZ KWDA] [PRPS] [FTYP] PNAM [ALSH]
#     [ATTX] FNAM JNAM [INAM] MNAM GNAM WBDT [FTMP] FNPR* [XMRK] [SNAM] [NNAM] STOP; PNAM 4,
#     FNAM/JNAM/GNAM 2, MNAM 4, WBDT 1, FTMP 4 (FURN), FNPR 4, SNAM 28n. No NTRM, WTFM,
#     COCT or NAM1 occurs at the top level. No record is compressed. Every record decodes
#     and re-encodes identically.
#
# What stays opaque, and why: NNAM, a list of string pairs (each element is two
# NUL-terminated strings, which the format cannot hold as an array element). FNAM bit 0x1
# and record flag 0x8000 are unnamed upstream and stay unnamed. WBDT bench types 3, 4 and 6
# are marked unused upstream.
