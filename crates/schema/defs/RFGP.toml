# RFGP: ReferenceGroup, the group a placed reference (a REFR's XRFG, or its XPCK)
# points at: the group's references (RNAM and a second, unnamed reference), the
# pack-in (PNAM, a PKIN) that spawns the group, the group's name, its scripts and
# its components.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: the RFGP definition of wbDefinitionsSF1.pas at the pin (L16894-L16903):
#     member order, EDID (L16895, helper L3182), the script data (L16896, helper
#     L3407-L3411), the base form components (L16897, block L5984-L6832), the name
#     (L16898), the references (L16899 and L16901, allowed targets L37-L40), the
#     pack-in (L16900) and the unknown array (L16902).
#
# Members xEdit lists that no official record has (EDID, NNAM) are kept so a plugin
# that has one decodes it; they stay reference-level. Inside component blocks:
# FLCS is typed by the shared BfcbBlock; KSIZ and KWDA stay raw in its component data.
