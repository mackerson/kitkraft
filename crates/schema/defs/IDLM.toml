#     which order and how often. Every member is listed because the corpus has it, and every
#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the IDLM definition of wbDefinitionsSF1.pas at the pinned revision (L12688-L12703),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared Keywords
#     group keeps its own provenance.
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# An inventory: EDID and the keyword list are typed; every other payload is opaque (named
# after its signature, a placeholder) until a family lane transcribes the record from the
# pinned xEdit file (docs/gaps.md). Members xEdit lists that no official record has are left
# out; a plugin that has one keeps it raw.
