# TMLM: Terminal Menu, the page a terminal (TERM) or a native terminal (NTRM on a
# container, activator or furniture) shows: body texts with conditions, then menu items
# that display text, open a submenu (another TMLM) or open a data slate (BOOK).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L18257-L18342 - member order, the record flags,
#     the script data with terminal-menu fragments (L3584-L3590, kept opaque), TMVT, DNAM,
#     SNAM and their values, INAM, the body text block (BSIZ, then BTXT, conditions and
#     TPLT per item), the menu item block (ISIZ, then ITXT, ISTX, ISET, ITID, XLOC, one of
#     UNAM/TNAM/BNAM, conditions per item). Helpers: FULL (L3184), the lock data XLOC
#     (L3776-L3795), conditions (L4750-L4840, common/Condition.toml), the boolean values
#     (wbDefinitionsCommon.pas L7514-L7521).
#   corpus: the 974 TMLM records (Starfield.esm 700, ShatteredSpace 122, SFBGS00D 86,
#     SFBGS050 56, SFBGS003 10; form versions 581, 582), 2026-10-14: order EDID [VMAD]
#     [FULL] TMVT DNAM SNAM INAM BSIZ (BTXT CTDA* [TPLT])* ISIZ (ITXT ISTX ISET ITID [XLOC]
#     [UNAM|TNAM|BNAM] CTDA*)*; TMVT/SNAM/INAM/BSIZ/ISIZ 4, DNAM 1, ISET 8, ITID 2, XLOC 16,
#     TPLT 1, CTDA 32 with CIS1/CIS2 after some; UNAM, BTXT, ITXT, ISTX, INAM, FULL are
#     localized string IDs; TNAM resolves to TMLM (712), BNAM to BOOK (1), the XLOC key to
#     KEYM or null. No record is compressed. Every record decodes and re-encodes
#     identically.
#
# The upstream choice between UNAM, TNAM and BNAM follows the menu item type in ISET; the
# three have different signatures, so they are three optional members here and need no
# decider. The padding bytes of ISET and XLOC hold non-zero filler in official records
# (AB AB, AD DE) and are kept raw. INAM is unnamed upstream and keeps its signature as its
# name. BSIZ and ISIZ are stored counts, not derived.
