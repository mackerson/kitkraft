# PERK: Perk, a skill, trait, background or crew ability. Each rank holds perk effects
# (a quest stage, an ability spell, or an entry point that modifies a game value), rank
# conditions, an optional activity tracker (the challenge that unlocks the next rank), a
# description and its upgrade cost. NPC_ lists perks in PRKZ/PRKR.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15872-L15921 - member order, the record flag,
#     DATA, TNAM/UNAM/GNAM, the rank group and the bonus perks. Helpers: EDID (L3182),
#     the fragmented script data (L3476-L3482, kept opaque), FULL (L3184), DESC
#     (L3186-L3193), the category and skill group enums (L2897-L2914), the perk effect
#     (L7207-L7316) with its type (wbDefinitionsCommon.pas L8554-L8562) and perk
#     conditions (L7201-L7205), the conditions (L4750-L4840, common/Condition.toml), CITC
#     (L2251), the activity tracker (L5645-L5672).
#   corpus: the 608 PERK records (Starfield.esm 502, SFBGS00D 74, ShatteredSpace 15,
#     SFBGS050 7, SFBGS007 6, SFBGS003 2, SFBGS004 1, SFBGS047 1; form versions 581, 582),
#     2026-10-14: every record fits the order below. The top-level DATA is 4 bytes in all
#     608 records; PRKE 3; effect DATA 3 (2,097 entry points), 4 (118 abilities) or 6 (45
#     quest stages); EPFT 1, EPFB 2, EPFD 4 or 8, EPF2 4 (localized), EPF3 2; PRKC 1;
#     CTDA 32; PRUC 4; ATCP 4; ANAM 31. Every record decodes and re-encodes identically.
#
# What stays opaque, and why: VMAD (script fragments; property values are unions), the
# effect DATA (a union selected by the effect type in PRKE), EPFD (a union selected by
# EPFT), ATAV (activity configuration text without a terminator that may embed FormIDs).
# The top-level DATA's crew requirement exists only in 4-byte payloads upstream; every
# official payload has it, so it is typed here (a 3-byte DATA would stay raw).
