# SCOL: StaticCollection, a set of placed statics merged into one base object: each part
# names a static (or another placeable form) and lists where its copies sit.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17403-L17431 - member order, the record flags
#     (L17404-L17415, eleven bits by bit number), EDID (L17421), script data (L17422, kept
#     opaque), object bounds (L17423; wbDefinitionsCommon.pas L9348-L9365), the required
#     ODTY (L17424; L3921-L3923), SNTP (L17425; L3919), the base form components (L17426,
#     the shared BfcbBlock), the required generic model (L17427; L7008-L7029), FULL
#     (L17428; L3184), FLTR (L17429; L5697) and the required parts list (L17430), each part
#     (L8330-L8338) an ONAM (the part's form and four bytes upstream leaves unnamed) and the
#     required placements (wbDefinitionsCommon.pas L9497-L9510: position and rotation, the
#     vector helpers at L6760-L6790, and a scale).
#
# Before KK-256 this was an inventory definition (KK-109): corpus order and cardinality,
# every payload but EDID and the component frame opaque. The order here is xEdit's; the
# official records follow it (none has both SNTP and a component block, so the corpus alone
# could not order those two).
