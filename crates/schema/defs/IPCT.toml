# IPCT: Impact — what happens when a projectile or object strikes a surface: the effect
# parameters, the decals projected onto the surface and their bounds, and the sounds
# played on impact and on footstep.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L13147-L13183:
#     the member order — EDID (L13148), the base form component block (L13149, the
#     shared BfcbBlock), the generic model (L13150, the shared Model block), the effect
#     data (L13151-L13172, a 24-byte struct; its sound-level values are the sound-level
#     enum at L2574-L2581), the two projected decal lists (L13173-L13174), the decal
#     data (L13175, the helper at L2551-L2559), the three impact sounds (L13176-L13178,
#     the shared SoundReference block), the footstep explosion and the hazard
#     (L13179-L13180), and the footstep particle distance and the decal lifetime
#     (L13181-L13182).
#   corpus: 1459 official IPCT records in the 14 official ESMs (inventory scan of
#     2026-10-29, crates/esm/tests/inventory_types.rs); ipct_types_full (crates/esm/tests/ipct_types.rs),
#     2026-11-03, checks this definition against them: every subrecord is placed in a
#     member, every placed subrecord decodes, and the re-encoding reproduces every
#     record (1459 records, 1459 identical).
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared
#     BfcbBlock, Model and SoundReference blocks keep their own provenance.
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# Inside component blocks (kept raw by BfcbBlock): PTCL REFL.
