# IPCT: Impact, inventory definition (M4.BX2, KK-022).
#
# Sources (ADR 0004, ADR 0005):
#   corpus: the inventory scan of every official IPCT record (1459 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full, run 2026-10-27): which
#     subrecords occur, in which order and how often. Every member is listed because the
#     corpus has it, and every official record decodes with nothing left unplaced and
#     re-encodes byte for byte.
#
# An inventory: EDID is typed, the base form component frame is the shared BfcbBlock, and
# every other payload is opaque (named after its signature, a placeholder) until a family
# lane transcribes the record from the pinned xEdit file (docs/gaps.md). Two official
# records have no EDID, and the component blocks sit between the EDID and the rest of the
# record (or lead the record when there is no EDID).
signature = "IPCT"
name = "Impact"
source = "corpus: inventory_types_full (crates/esm/tests/inventory_types.rs), 2026-10-27: every official IPCT record (1459) decodes with every subrecord placed and re-encodes identically"
confidence = "corpus"
note = "inventory definition (M4.BX2): corpus order and cardinality; EDID typed, the component block frame shared, every other payload opaque"

