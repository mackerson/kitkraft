# ACTI: Activator, a placeable object the player can activate (switches, consoles, scanners,
# outpost machines that are not furniture or containers). Scripts (VMAD) carry most of
# their behaviour.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L9199-L9274 - member order, the record flags, PNAM
#     (marker colour), WMAT, WTFM, FNAM and its bits, JNAM, INAM, RADR, the condition block
#     (CITC plus conditions), NVNM. Helpers: script data (L3407-L3411, kept opaque), object
#     bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962),
#     PTT2 (L3965-L3978), SNTP/SNBH (L3919-L3920), DEFL (L3963), XALG (L3230), the base form
#     component block (L5984-L6832, kept raw), FULL (L3184), the generic model (L7008-L7029),
#     destruction data (L3829-L3890), keywords (wbDefinitionsCommon.pas L8935-L8951), PRPS
#     (L5679-L5686), FTYP (L5699), NTRM (L5676), the byte colour (wbDefinitionsCommon.pas
#     L6954-L6968), ALSH/ACSH (L2331-L2332), ATTX (L5700), CITC (L2251), conditions
#     (L4750-L4840, common/Condition.toml), navmesh geometry (L3995-L4128, kept opaque).
#   corpus: the 1,940 ACTI records (Starfield.esm 1,463, ShatteredSpace 316, SFBGS050 95,
#     SFBGS00D 54, SFBGS003 12; form versions 581, 582), 2026-10-14: order EDID [VMAD] OBND
#     ODTY [OPDS] [PTT2] [SNTP] [SNBH] [XALG] [component blocks] [FULL] [MODL] MOLM* FLLD
#     [XFLG] [DEST block] [KSIZ KWDA] [PRPS] [FTYP] [NTRM] PNAM [ALSH] [ACSH] [WMAT] [WTFM]
#     [ATTX] FNAM JNAM [INAM] [CITC CTDA+] [NVNM]; PNAM 4, FNAM 2, JNAM 2, INAM 0, ATTX 4
#     (localized), sounds 40, WTFM 4 (WATR), CTDA 32, NVNM variable. No DEFL, RADR, CIS1 or
#     CIS2 occurs. No record is compressed. Every record decodes and re-encodes
#     identically. EDID is absent from 3 records and MODL from 489 (FLLD is always present).
#
# PNAM is the marker colour (red, green, blue, unused byte).
