# ARMO: Armor, wearable gear (spacesuits, helmets, boost packs, clothing). The worn look
# comes from armor addons (ARMA) listed by index; the male and female world models are the
# dropped-item models.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L9707-L9775 - member order, the record flags, the
#     two world models, BO64 (L2543-L2549, a u64 of biped slots; the bit names,
#     transcribed from L2474-L2541, live in the shared BipedSlots definition), ETYP
#     (L4252), BIDS, BAMT, RNAM, DESC (L3186-L3189), INRD (L5677), the addon list
#     (INDX, MODL), DATA, FNAM with the stagger values (L4647-L4653), APPR (L5698), the
#     object template (L6961-L6974), STOP, AVSG, AFSG. Helpers: script data
#     (L3407-L3411, kept opaque), object bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY
#     (L3921-L3923), PTT2 (L3965-L3978), the base form component block (L5984-L6832, kept
#     raw), FULL (L3184), the enchantment (wbDefinitionsCommon.pas L8760-L8774), the textured
#     model (wbDefinitionsCommon.pas L9512-L9544) with MOLM-style swaps (L7000-L7006) and the
#     colour index and model flags (L3798-L3809), destruction data (L3829-L3890), PUSH/PDSH
#     (L2334-L2335), keywords (wbDefinitionsCommon.pas L8935-L8951), the resistance list
#     (wbDefinitionsCommon.pas L8728-L8738).
#   corpus: the 1,168 ARMO records (Starfield.esm 1,017, ShatteredSpace 87, SFBGS050 43,
#     SFBGS003 11, SFBGS00D 10; form versions 581, 582), 2026-10-14: order EDID [VMAD] OBND
#     ODTY [PTT2] [component blocks] [FULL] [EITM] [MOD2] [MLM2] FLLD [XFLG] [MO2F] [MOD4]
#     FLLD [XFLG] [MO4F] BO64 [PUSH] [PDSH] [BAMT] RNAM [KSIZ KWDA] DESC [INRD] (INDX
#     MODL)+ DATA FNAM [DAMA] [APPR] [OBTE ([OBTF] [FULL] OBTS)+] STOP [AVSG] [AFSG]. Every
#     record has exactly two FLLD, one per world model, also when it has no MOD2/MOD4.
#     BO64 8, DATA 12, FNAM 8, DAMA 12n, AVSG/AFSG 32, MODL 4 (ARMA). No record is
#     compressed. Every record decodes and re-encodes identically. The 2026-10-25
#     apparel_types scan (crates/esm/tests/apparel_types.rs) counts 756 of them as
#     setting the `Body` biped slot (bit 3) in BO64.
#
# FLLD and XFLG in the world models: upstream's textured model has neither and upstream
# ignores both signatures in ARMO; the corpus places one FLLD (and sometimes an XFLG) in
# each world model, so they are members here, laid out as the generic model's FLLD and XFLG
# (L3818-L3823, L3801-L3804), confirmed by the corpus only. AVSG and AFSG hold two Wwise
# GUIDs each (16 bytes per GUID from the 32-byte payload), kept raw. BO64 is the 64
# first-person biped slot bits, typed by the shared BipedSlots definition. Record flags
# 0x400 and 0x8000 are unnamed upstream.
