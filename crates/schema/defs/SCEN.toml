# SCEN: Scene, a scripted sequence of a quest: flags, phases (with start and completion
# conditions), the actors (alias IDs with flags), the actions (dialogue, packages, timers,
# player dialogue, nested scenes, radio, moves, cameras, effects, animations, timelines),
# the parent quest, conditions, and speech challenge data. Scenes are stored in the
# children group of their quest (group type 10).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L16981-L17401 - member order, the scene, phase,
#     actor and action flags, the phase and action layouts, the scene-level members and
#     the speech challenge block. Helpers: script data (L3533-L3583, the scene variant,
#     common/ScriptAttachment.toml), the condition list (L4750-L4840,
#     common/Condition.toml).
#   corpus: the 9,673 SCEN records (Starfield.esm 7,613, ShatteredSpace 1,023, SFBGS00D
#     535, SFBGS050 364, SFBGS003 137, SFBGS004 1; form versions 581 and 582; none
#     compressed; every one in a group of type 10), 2026-10-14: order EDID [VMAD] FNAM
#     phases (HNAM NAM0 CTDA* NEXT CTDA* NEXT WNAM [FNAM] [SCQS] [SPMV] HNAM)* actors
#     (ALID LNAM DNAM)* actions (ANAM NAM0 [SNOT] ALID INAM FNAM SNAM ENAM ... ANAM)* PNAM
#     INAM VNAM CTDA* [SCQS] [NNAM] [TNAM] [BOLV] XNAM [SCPI] [JNAM] [SCPP] [speech
#     challenge] [DEVT]; an action's ANAM is 2 bytes at its start and empty at its end;
#     the scene VNAM is 20 bytes; no CITC precedes the phase or scene conditions. Every
#     record decodes with nothing left over and re-encodes identically.
#
# What stays opaque, and why: after its common header (type, name, notes, actor, index,
# flags, start and end phase) an action holds type-specific subrecords whose layout the
# action type selects (upstream a union decided by the ANAM value; the same signature means
# different things in different action types: HNAM is a marker, a float or an alias,
# SNAM a phase or a time, DATA a topic). They are kept as raw subrecords up to the
# action's end marker (lossless); FormIDs among them (topics, packages, scenes, references,
# keywords) are not visited. The scene VNAM is unnamed upstream and kept raw.
