#     which order and how often. Every member is listed because the corpus has it, and every
#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the PDCL definition of wbDefinitionsSF1.pas at the pinned revision (L15829-L15869),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared
#     BfcbBlock group keeps its own provenance.
#
# An inventory: EDID and the component block frame are typed; every other payload is opaque
# (named after its signature, a placeholder) until a family lane transcribes the record from
# the pinned xEdit file (docs/gaps.md). Members xEdit lists that no official record has are
# left out; a plugin that has one keeps it raw.
# Inside component blocks (kept raw by BfcbBlock): KSIZ KWDA REFL.
