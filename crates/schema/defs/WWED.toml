# WWED: WwiseEventData, Wwise event data: the Wwise event GUIDs of a sound
# reference's start and end events, and a condition form.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L19037-L19044 - member order, EDID (L19038),
#     the Wwise event GUID named 'Start' (L19041), the FormID of a CNDF named
#     'Condition' (L19042) and the Wwise event GUID named 'End' (L19043). Upstream
#     also lists the script data (L19039) and the base form component block (L19040);
#     no official record has either, so they are left out (a plugin that has one
#     keeps it raw).
#   corpus: the wwed_types scan in crates/esm/tests/wwed_types.rs checks this
#     definition against every official WWED record (681 in the 14 ESMs): every
#     subrecord is placed, every placed subrecord decodes, and the re-encoding
#     reproduces every record.
#
# The Wwise GUIDs (WSED and WTED) are kept raw: the pinned files declare a Wwise GUID
# type but give it no field layout (the type lives in an xEdit unit we do not read),
# and every Wwise GUID in this repo stays raw (common/SoundReference.toml
# StartEvent/StopEvent, SECH.toml ECTE, ARMO.toml AVSG).
#
# Order: CNAM and WTED never occur together in one official WWED record; their order
# follows the pinned xEdit file.
