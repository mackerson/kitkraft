# CELL: cell. Interior cells sit in interior block/subblock groups (types 2 and 3) under
# the top CELL group; exterior cells in exterior block/subblock groups (types 4 and 5)
# under a worldspace's children group, and a worldspace's persistent cell directly in its
# children group. Each cell's references follow it in a cell children group (type 6)
# labelled with its FormID, split into persistent (type 8) and temporary (type 9) groups.
#
# Sources (ADR 0004, ADR 0005; every member cites its own lines):
#   xedit: the CELL definition of wbDefinitionsSF1.pas at the pinned revision (L10589-L10744)
#     and the helpers it uses there and in wbDefinitionsCommon.pas: field layouts, FormID
#     target types, flag values.
#   corpus: tests/world_family.rs over every CELL record of the 14 official ESMs (see the
#     record evidence; most CELLs are compressed).
#
# Member order: xEdit marks CELL members as unordered. The order below is the linear order
# that agrees with the most official records (computed from every corpus record). The
# record is `unordered` (M4.BX1): the decoder matches a subrecord from its current member on
# and, when none accepts it there, from the first member again, and writes the values back
# in their on-disk order, so every member is typed wherever it stands. docs/schema/world-family.md has the counts.
#
# Names are ours; no xEdit code, comments or labels are copied. FormIDs are raw stored values
# (0 means none). Members no official CELL has stay at `reference`.
