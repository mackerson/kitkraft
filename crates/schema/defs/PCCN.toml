# PCCN: Planet Content Manager Content Node, a leaf of a procedural placement tree. It
# names the content to place (PCCC: a worldspace, a leveled pack-in or a pack-in) and
# links up to its parent branch (PRTN) and back to its previous sibling (PRVN).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15788-L15796 - member order, PCCC targets, the
#     IOVR marker, keywords, PRTN/PRVN targets. Helpers: the base form component block
#     (L5984-L6832, common/BfcbBlock.toml, kept raw) and the keyword list without a count
#     (wbDefinitionsCommon.pas L8935-L8951).
#   corpus: the 2,148 PCCN records (Starfield.esm 1,805, SFBGS00D 199, SFBGS050 56,
#     ShatteredSpace 88; form versions 581 and 582), 2026-10-14: order EDID [BFCB block]
#     [PCCC] [IOVR] [KWDA] PRTN [PRVN]; PCCC, PRTN, PRVN 4 bytes, IOVR 0 bytes, KWDA 4
#     bytes. 4 records carry no PCCC (EDID KWDA PRTN [PRVN]). Every record decodes and
#     re-encodes identically.
#
# IOVR occurs only together with a BFCB block (BGSPlanetContentManagerContentProperties_
# Component): the marker says the node's own placement properties and conditions replace
# those of the content it places.
signature = "PCCN"
