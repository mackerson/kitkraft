# CSTY (CombatStyleForm): the combat-style multipliers an AI actor follows in combat: the
# general multipliers (CSGD), the melee, ranged, close-range and long-range tactics
# (CSME, CSRA, CSCR, CSLR), the cover-search, flight and tunnel tactics (CSCV, CSFL,
# CSTN), the space-combat data (CSSG, CSSM, CSSR, CSSA, CSSD), the style flags (DATA)
# and the links to the template combat styles (TNAM, UNAM).
#
# Transcribed from the CSTY definition of wbDefinitionsSF1.pas at the pinned revision
# (L11052-L11233) and the helpers it names (the power-weighting struct L7155-L7169 and
# the manoeuvre-timing struct L7173-L7184); each member cites the lines that give its
# layout. The 177 official records carry every member in that order; the corpus lines
# below record what the scan of them observed.
#
# FNAM is unknown upstream and stays opaque, kept raw.
#
# No subrecord of this type is an lstring (lane E's corpus lstring table, M3.B8), and
# the official CSTY records carry none.
