# PCBN: Planet Content Manager Branch Node, an inner node of a procedural placement tree.
# It points up to its parent (PRTN: a PCMT or another PCBN) and back to its previous
# sibling (PRVN); the tree is linked bottom-up, the PCCB child list is never written.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15764-L15785 - member order, NAM1..NAM5 widths
#     and values, the PCCB node list, conditions, keywords, PRTN/PRVN targets. Helpers: the
#     condition count (L2251) and list (L4750-L4840, common/Condition.toml), the base form
#     component block (L5984-L6832, common/BfcbBlock.toml, kept raw), the keyword list
#     without a count (wbDefinitionsCommon.pas L8935-L8951), the boolean enumeration
#     (wbDefinitionsCommon.pas L7514-L7521).
#   corpus: the 379 PCBN records (Starfield.esm 336, SFBGS00D 15, SFBGS050 9,
#     ShatteredSpace 19; form versions 581 and 582), 2026-10-14: order EDID [BFCB block]
#     NAM1 NAM2 [NAM3] [NAM4] NAM5 CITC CTDA* [KWDA] PRTN [PRVN]; NAM1..NAM4 4 bytes, NAM5
#     1 byte, KWDA a multiple of 4 (4 or 8), no PCCB. Every record decodes and re-encodes
#     identically.
#
# The BFCB block is always BGSPlanetContentManagerContentProperties_Component here (the
# placement properties shared with PCCN, LVLP and PKIN); its payload stays raw.
