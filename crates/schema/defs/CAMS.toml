# CAMS: Camera Shot — a shot definition for the game's cinematic camera: which action
# to play (shoot, fly, hit or zoom), which actor the camera is attached to, how it
# follows its target, and how quickly it settles.
#
# The record carries the generic model block, the base form components, keywords and
# conditions, then a Data block with the shot parameters, an optional image space
# modifier and an animation string.
