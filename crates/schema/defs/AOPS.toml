# AOPS: AimOpticalSightMarker, an optical sight marker: the attach node, laser and
# timing of a weapon sight.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L9567-L9602 - member order, EDID (L9584) and
#     the ANAM struct named 'Data' (L9586-L9601): the one-byte boolean 'Activate Sight
#     on Sighted Mode' (L9587), the length-prefixed string of the sight attach node
#     (L9588), the floats 'Delay Before Sight Activation' and 'Delay Before Sight
#     Deactivation' (L9589-L9590), the FormID of a LIGH (L9591), the floats 'Focal
#     Point Distance', 'Focal Point Distance During Aiming' and 'Delay Between Shots'
#     (L9592-L9594), the two FormIDs of ARTO objects for the laser and the laser dot
#     (L9595-L9596), the float 'Max Laser Pointer Distance' (L9597) and the three
#     one-byte booleans for the sight controls firing direction and the activate-on
#     non-sighted and scoped modes (L9598-L9600). Upstream also lists the base form
#     component block (L9585); no official record has it, so it is left out (a plugin
#     that has one keeps it raw).
#   corpus: the aops_types scan in crates/esm/tests/aops_types.rs checks this
#     definition against every official AOPS record (21 in the 14 ESMs): every
#     subrecord is placed, every placed subrecord decodes, and the re-encoding
#     reproduces every record.
#   uesp-skyrim: the EDID string convention (M2.B2).
#
# The sight attach node is the one length-prefixed string of the record: this format
# has no such type, so it is a u32 length field plus a byte array counted by it, as
# PROJ writes its particle define strings (the count includes the terminating NUL;
# the payload is 44 fixed bytes plus the node bytes).
