# PMFT: PhotoModeFeature, a photo mode feature: a texture, frame or filter, with its name,
# its placement and size data, and either a texture path or an image space.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15935-L15972 - member order, the record flags
#     (L15936-L15946, ten flag bits), EDID (L15952), the name (L15954), the FNAM struct
#     (L15956-L15969: the feature type, an 8-bit enum whose values are at L2971-L2975, two
#     float offsets, four 32-bit sizes and 32-bit flags with three bits at L15964-L15968),
#     the HNAM texture path (L15970) and the INAM image space (L15971). Upstream also lists
#     the base form component block (L15953) and conditions (L15955); no official record
#     has either, so both are left out (a plugin that has one keeps it raw; conditions are
#     another lane's work).
#   corpus: the pmft_types scan in crates/esm/tests/pmft_types.rs checks this definition
#     against every official PMFT record (75 in the 14 ESMs): every subrecord is placed,
#     every placed subrecord decodes, and the re-encoding reproduces every record.
#   corpus: lane E's corpus lstring table (crates/engine/src/edit/lstrings.rs, checked by
#     lstring_table_matches_the_corpus): FULL is an lstring in every official PMFT record.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#
# Formerly an lstring-only definition (M3.B8); now a full definition in xEdit member order
# (KK-339), as AVIF (KK-225) is. Names are ours.
