# INFO: Dialog response, one entry under a dialogue topic: its flags, shared or grouped
# responses, the response lines (text, emotion, voice file, animation, head tracking),
# the conditions that pick it, the prompt, speaker, scene to start, quest stages to set,
# and subtitle priority. INFO records live in their topic's children group (group type 7);
# the topic (DIAL) lists them in TIFL.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L12756-L12884 - member order, ENAM, TRDA, TROT,
#     the response text members (NAM1..NAM4, NAM9), TIQS, INAM, FormID targets. Helpers:
#     script data (L3413-L3442, the response variant, common/ScriptAttachment.toml), the
#     base form component block (L5984-L6832, kept raw), the animation block (L5702-L5722),
#     the sound reference (L2213-L2227, common/SoundReference.toml), the condition list
#     (L4750-L4840, common/Condition.toml).
#   corpus: the 162,028 INFO records (Starfield.esm 126,347, ShatteredSpace 17,938,
#     SFBGS00D 7,097, SFBGS050 6,979, SFBGS003 3,051, SFBGS004 616; form versions 581 and
#     582; none compressed; every one in a group of type 7), 2026-10-14: order [EDID] [VMAD]
#     [BFCB block] ENAM [DNAM] [GNAM] responses CTDA* [RNAM] [ANAM] [TSCE] [INTV] [WED0]
#     [TIQS] NAM0 [MODQ] INAM [COCT] [NAM8] [SCSP] [PERK]; each response TRDA TROT* NAM1
#     NAM2 NAM3 NAM4 [NAM9] [animation] [head tracking] [RVSH]. Unlike REFR, the order holds
#     in every record: all 162,028 decode with nothing left over and re-encode identically.
#     ENAM, DNAM, GNAM, TROT entries 4 and 8 bytes as below; TRDA 12; NAM9 8; WED0 and RVSH
#     40; TIQS 4. No TPIC, TROI, CIS1, SOFT, SPOR, SHRT, DTGT or ACEP occurs; no condition
#     occurs inside an animation block.
