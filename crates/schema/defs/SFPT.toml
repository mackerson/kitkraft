# SFPT: Surface Pattern, a 16 x 16 grid of surface blocks (SFBK) with a rotation per cell,
# laid over a planet's terrain; a pattern style (CNAM: PTST) groups patterns, and DNAM
# limits it to worldspaces.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17607-L17654 - member order, the CNAM target, the
#     five 16 x 16 grids (BNAM, FNAM and EFRM of SFBK FormIDs, GNAM and EORI of signed
#     bytes), the DNAM worldspace list. Helper: the base form component block (L5984-L6832,
#     kept raw).
#   corpus: the 264 SFPT records (Starfield.esm 258, ShatteredSpace 6; form versions 581,
#     582), 2026-10-14: order EDID [BFCB blocks] CNAM FNAM GNAM [DNAM]; FNAM 1,024 bytes,
#     GNAM 256 bytes, DNAM a multiple of 4; BNAM, EFRM and EORI never occur. Every record
#     decodes and re-encodes identically.
#
# Each grid is stored as one row-major array of 256 cells (row 0 columns 0..15, then row 1,
# ...). The format has no array of arrays; flattening keeps every byte.
