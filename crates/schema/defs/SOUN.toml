# SOUN: SoundMarker, a sound marker: object bounds, a dirtiness scale, an optional
# flag set, keywords, an optional sound reference and the sound-detection data (a
# level and a radius).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17732-L17745 - member order, EDID (L17733),
#     object bounds (L17735, wbObjectBounds: wbDefinitionsCommon.pas L9348-L9365), ODTY
#     (L17736, wbODTYReq: L3921-L3923), XALG (L17737, L3195-L3230), the shared Keywords
#     block (L17739), the sound reference (L17740, wbSoundReference: L2213-L2227,
#     common/SoundReference.toml) and the sound-detection struct (L17741-L17744, the
#     level enum L2574-L2581). Upstream also lists the script data (L17734) and the
#     base form component block (L17738); no official record has either, so they are
#     left out (a plugin that has one keeps it raw).
#   corpus: the M4.BX2 scan of every official SOUN record (1133 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full): which subrecords
#     occur, in which order and how often, and their sizes. The soun_wkmf_types scan
#     (crates/esm/tests/soun_wkmf_types.rs) checks this definition against the same
#     records: every subrecord is placed, every placed subrecord decodes, and the
#     re-encoding reproduces every record.
#
# Order: XALG precedes KSIZ in the one official SOUN record that has both.
