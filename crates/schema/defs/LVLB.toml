# LVLB: Leveled Base Form, a leveled list whose entries are base forms (GBFM) or other
# leveled base form lists (LVLB). Base-form spawn points and the object palette pick an
# entry by the player's level, the chance values and the entry conditions.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L13952-L14010 - member order, the record flags,
#     LVLD/LVLM/LVLF/LVLG/LLCT, the entry group (LVLO, COED, conditions), LLKC and the
#     model block. Helpers: EDID (L3182), script data (L3393-L3411, kept opaque), object
#     bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962),
#     PTT2 (L3965-L3974), SNTP (L3919), SNBH (L3920), DEFL (L3963), XALG (L3230), the base
#     form component block (L5984-L6832), LLCT (L2250), LVLD (L2252), the conditions
#     (L4750-L4840, common/Condition.toml), the leveled entry (wbDefinitionsCommon.pas
#     L9062-L9084), COED (L2294-L2302), LLKC (L7791-L7803), the generic model (L7008-L7029).
#   corpus: the 373 LVLB records of the 14 official ESMs, 2026-10-28 inventory scan: EDID,
#     OBND, ODTY, LVLD, LVLM, LVLF and FLLD in all 373; LLCT and the LeveledListEntry group
#     (LVLO 12 bytes, up to 17 per record) in 350; CTDA (32 bytes) in 7, up to 12 per
#     record: 37 after the entries of their records, 2 list-level, before the first
#     LVLO (lvlb_types_full, 2026-11-03); VMAD in 1; MODL in 1.
#
# The entry count LLCT is a separate subrecord, stored, not derived: an edit that adds or
# removes an Entry must update EntryCount too. The unused byte runs of LVLO stay raw.
# Members no official LVLB has stay at `reference` until the typed check prints them.
