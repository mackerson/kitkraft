#   corpus: the 953 FACT records (Starfield.esm 812, ShatteredSpace 68, SFBGS00D 39,
#     SFBGS050 26, SFBGS003 8; form versions 581 and 582; none compressed), 2026-10-14:
#     order EDID [BFCB block] [FULL] XNAM* [DNAM] DATA [CRGR] CRVA [PRIS] [VEND] [VENC]
