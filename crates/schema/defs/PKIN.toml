# PKIN: Pack-In, a reusable bundle of placed objects stored in its own cell (CNAM). Placing
# a pack-in (from the editor, a planet content node or a leveled pack-in) instantiates the
# references of that cell as a group.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L15981-L16045 - member order (including the two
#     OPDS positions), the record flags, CNAM/VNAM/FNAM, FTYP, PRPS, NTRM, MOLM and FULL.
#     Helpers: script data (L3393-L3411, kept opaque), object bounds (wbDefinitionsCommon.pas
#     L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), PTT2 (L3965-L3978), SNTP/SNBH
#     (L3919-L3920), XALG (L3230), the base form component block (L5984-L6832, kept raw),
#     FLTR (L5697), keywords (wbDefinitionsCommon.pas L8935-L8951, common/Keywords.toml),
#     FTYP (L5699), PRPS and its property element (L5679-L5686, with the actor value at
#     L2271-L2274), NTRM (L5676), MOLM (L7000-L7006), FULL (L3184).
#   corpus: the 15,128 PKIN records (Starfield.esm 11,281, ShatteredSpace 1,971, SFBGS00D
#     760, SFBGS050 733, SFBGS006 356, SFBGS003 25, SFBGS004 1, SFBGS047 1; form versions
#     581, 582), 2026-10-14: every record fits the order below; OBND 24, ODTY 4, OPDS 80
#     (at most two per record, before and after the component blocks), PTT2 32, SNTP/SNBH/
#     NTRM/CNAM/VNAM/FNAM 4, XALG 8, PRPS a multiple of 12, MOLM 2 + 4n, FULL 4 (localized).
#     Every record decodes and re-encodes identically. VNAM is 0 in every record.
#
# EDID is absent from 3 records and CNAM/VNAM/FNAM from 2, so they are optional.
