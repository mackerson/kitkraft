# SFBK: Surface Block, one tile of procedurally generated planet terrain: its height data
# file, footprint, height range, edge connections, rarity, alignment settings and source.
# Surface patterns (SFPT) arrange blocks in 16 x 16 grids.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17525-L17591 - member order and every layout:
#     ANAM data file, DNAM size, ENAM height, FNAM connections (signed 16-bit list), GNAM
#     rarity, the placement group (HNAM, INAM, JNAM, KNAM) with its enumerations, WHGT,
#     NAM0..NAM5. Helper: the base form component block (L5984-L6832, kept raw).
#   corpus: the 1,877 SFBK records (Starfield.esm 1,753, SFBGS00D 56, ShatteredSpace 47,
#     SFBGS050 21; form versions 581, 582), 2026-10-14: order [EDID] [BFCB block] [ANAM]
#     DNAM ENAM [FNAM] GNAM HNAM INAM JNAM KNAM WHGT [NAM0] [NAM1] NAM2 NAM3 NAM4 NAM5; DNAM,
#     ENAM, NAM2..NAM4 8 bytes, FNAM an even size (18 to 1,352), GNAM/INAM/JNAM/KNAM 1 byte,
#     HNAM 2, WHGT and NAM5 4. Every record decodes and re-encodes identically. GNAM is 0
#     (common) in every record.
