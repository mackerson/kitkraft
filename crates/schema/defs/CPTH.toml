# CPTH: Camera Path, a node in the tree of scripted camera paths: conditions, links to its
# parent and previous sibling, flags, and the camera shots (CAMS) it may use.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L11031-L11049 - member order, ANAM (parent and
#     previous CPTH), DATA and its bits, the SNAM list of CAMS. Conditions: L4750-L4840
#     (common/Condition.toml; no CITC count upstream).
#   corpus: the 152 CPTH records (Starfield.esm 148, ShatteredSpace 3, SFBGS050 1; form
#     versions 581, 582), 2026-10-14: order EDID CTDA* ANAM DATA SNAM*; ANAM 8, DATA 1, SNAM
#     4 (CAMS), CTDA 32, no CITC, CIS1 or CIS2. No record is compressed. Every record
#     decodes and re-encodes identically.
#
# DATA bits 0x8, 0x10 and 0x20 are unnamed upstream (0x8 set in 2 records) and stay
# unnamed.
signature = "CPTH"
name = "CameraPath"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L11031-L11049"
evidence = [
  "corpus: the 152 CPTH records of the 14 official ESMs, 2026-10-14 scan (ITEMS/WORKSHOP family); every record decodes and re-encodes identically",
]
confidence = "corpus"

[[member]]
sig = "EDID"
name = "EditorId"
type = "zstring"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:File_Format_Conventions",
  "corpus: universal subrecord scan 2026-10-14: all 265,346 EDID payloads in the 14 official ESMs end in their only NUL and are printable ASCII",
]

[[member]]
group_ref = "Condition"
name = "Conditions"
card = "repeated"
