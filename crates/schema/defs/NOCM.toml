#     which order and how often. Every member is listed because the corpus has it, and the
#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the NOCM definition of wbDefinitionsSF1.pas at the pinned revision (L14920-L14935),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#
# An inventory: EDID is typed; every other payload is opaque (named after its signature, a
# placeholder) until a family lane transcribes the record from the pinned xEdit file
# (docs/gaps.md). Members xEdit lists that no official record has are left out; a plugin
# that has one keeps it raw.
#
# The corpus order interleaves obstacle entries and model names: runs of entries (INDX, 0
# or more DATA, INTV) each followed by one model name (NAM1), so the members are grouped
# as xEdit nests them (the inner array of entries, the outer array that ends in the model
# string); the groups are named placeholders.
