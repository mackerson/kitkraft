# REGN: Region, a world-map region with its map colour, the boundary points of its
# areas, and data entries keyed by type (objects, weather, map, land, grass or sound).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L16815-L16847 - the record flag (bit 6,
#     "Border Region"), EDID (L16819), the map colour RCLR (wbByteColors,
#     wbDefinitionsCommon.pas L6954-L6968, L16820), the region areas (wbRegionAreas,
#     wbDefinitionsCommon.pas L9425-L9440, L16821) and the region data entries
#     (L16822-L16846: the RDAT data header L16824-L16838, required, and the RDWT
#     weather types L16841-L16845). The record is unordered (L16847).
#   corpus: the 4 official REGN records (crates/esm/tests/regn_gras_types.rs,
#     regn_gras_types_full): order EDID RCLR [RPLI RPLD] [RDAT RDWT]; one record lacks
#     the EDID.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# Upstream marks the record unordered, so the members are listed in the corpus order
# rather than the upstream order.
