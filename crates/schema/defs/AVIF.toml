# AVIF: ActorValueInformation: the definition of an actor value (attribute, skill,
# resistance and the like) that actor records refer to by name: its name and
# abbreviation, its default, its minimum and maximum, its type and its flags.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the AVIF definition of wbDefinitionsSF1.pas at the pinned revision (L9877-L9953)
#     and the helpers it uses: EDID (L3182), script data (L3407-L3411, kept opaque),
#     FULL (L3184), NLDT (L3183); the record-header flag bits (L9878-L9888) name the
#     navmesh bits the same way HAZD and TRAV do.
#   corpus: the 1,267 AVIF records of the 14 official ESMs (crates/esm/tests/avif_types.rs,
#     avif_types_full, 2026-11-03): every subrecord is placed in a member in the
#     definition's order, every placed subrecord decodes with the declared layout and
#     every record re-encodes identically. VMAD is absent from all 1,267; NLDT is in 387,
#     FULL in 181, ANAM in 61, NAM1 in 1,185 and NAM2 and NAM3 in 35; EDID, NAM0 and AVFL
#     are in all 1,267.
#   corpus: lane E's corpus lstring table (crates/engine/src/edit/lstrings.rs): in the
#     official AVIF records every FULL and ANAM is 4 bytes and more than 95% of their
#     distinct values are IDs in the plugin's own English string tables.
#
# Every member xEdit gives a layout is typed here; the script data (VMAD) stays raw.
# EDID, ANAM and FULL keep the lstring evidence they carried when the type was
# lstring-only. The base form component block, which xEdit also lists, is not in any
# official AVIF record, so no member takes it; a plugin that has one keeps it raw.
# Names are ours (UpperCamelCase, CK wording where it exists).
