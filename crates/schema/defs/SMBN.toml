# SMBN: Story Manager Branch Node, an inner node of the story manager tree: under an
# event node (SMEN) or another branch, it selects which child nodes (branches or quest
# nodes) run. Nodes link upwards: PNAM names the parent, SNAM the previous sibling.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17674-L17687 - member order, the DNAM flag bits,
#     XNAM, PNAM/SNAM targets. Helpers: the condition count (L2251) and list (L4750-L4840,
#     common/Condition.toml).
#   corpus: the 173 SMBN records (Starfield.esm 140, ShatteredSpace 16, SFBGS003 9, SFBGS00D
#     5, SFBGS050 3; form versions 581 and 582; none compressed), 2026-10-14: order [EDID]
#     PNAM SNAM CITC CTDA* DNAM XNAM; PNAM, SNAM, CITC, DNAM, XNAM 4 bytes. Every record
#     decodes with nothing left over and re-encodes identically.
signature = "SMBN"
name = "StoryManagerBranchNode"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L17674-L17687"
evidence = [
  "corpus: the 173 SMBN records of the 14 official ESMs, 2026-10-14 scan; every record decodes with an empty extra and re-encodes identically",
]
confidence = "corpus"

[[member]]
sig = "EDID"
name = "EditorId"
type = "zstring"
card = "optional"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:File_Format_Conventions",
  "corpus: universal subrecord scan 2026-10-14: all 265,346 EDID payloads in the 14 official ESMs end in their only NUL and are printable ASCII",
]
note = "one official node has none"

[[member]]
sig = "PNAM"
name = "ParentNode"
type = "formid"
targets = ["SMQN", "SMBN", "SMEN"]
note = "a null FormID is allowed"

[[member]]
sig = "SNAM"
name = "PreviousNode"
type = "formid"
targets = ["SMQN", "SMBN", "SMEN"]
note = "previous sibling; a null FormID is allowed"

[[member]]
sig = "CITC"
name = "ConditionCount"
type = "u32"
evidence = ["xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L2251-L2251"]
