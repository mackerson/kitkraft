# CONT: Container, a placeable object with an inventory (chests, lockers, outpost storage
# boxes). Outpost storage containers carry a native terminal (NTRM), attach-parent slots
# (APPR) and snap data like other buildable objects.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L10982-L11028 - member order, the record flags, the
#     standalone XFLG after the model, DATA and its bits, STOP, WED0/WED1, ONAM. Helpers:
#     script data (L3407-L3411, kept opaque), object bounds (wbDefinitionsCommon.pas
#     L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), XALG (L3230), PTT2
#     (L3965-L3978), SNTP/SNBH (L3919-L3920), the base form component block (L5984-L6832,
#     kept raw), FULL (L3184), the generic model (L7008-L7029, common/Model.toml), container
#     items (L2293-L2327, common/ContainerItems.toml), destruction data (L3829-L3890),
#     keywords (wbDefinitionsCommon.pas L8935-L8951), FTYP (L5699), NTRM (L5676), PRPS
#     (L5679-L5686), APPR (L5698), the object template (L6961-L6974), the sound reference
#     (L2213-L2227).
#   corpus: the 866 CONT records (Starfield.esm 707, ShatteredSpace 69, SFBGS00D 49,
#     SFBGS050 37, SFBGS003 4; form versions 581, 582), 2026-10-14: order EDID [VMAD] OBND
#     ODTY [OPDS] [XALG] [PTT2] [SNTP] [SNBH] [component blocks] [FULL] MODL MOLM* FLLD
#     [XFLG] [COCT CNTO+] [DEST block] DATA [KSIZ KWDA] [FTYP] [NTRM] [PRPS] [APPR] STOP
#     [WED0 WED1] [ONAM]; DATA 1, CNTO 8, NTRM 4 (TMLM), ONAM 4 (FLST), WED0/WED1 40, APPR 4
#     (KYWD). No record has an object template, COED or a standalone XFLG (the model's XFLG
#     takes the only one). No record is compressed. Every record decodes and re-encodes
#     identically. EDID is absent from 1 record.
#
# The standalone XFLG upstream lists after the model is left out: in every official record
# the XFLG there is the model block's own (it directly follows FLLD), and a second one, if a
# plugin had it, is kept raw in `extra` (lossless). DATA bit 0x8 is unnamed upstream (set in
# 205 records) and stays unnamed.
