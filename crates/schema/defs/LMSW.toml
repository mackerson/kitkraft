# LMSW: LayeredMaterialSwap, inventory definition (KK-008).
#
# Sources (ADR 0004, ADR 0005):
#   corpus: the inventory scan of every official LMSW record (17410 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full, 2026-10-27): which
#     subrecords occur, in which order and how often. Every member is listed because the
#     corpus has it, and every official record decodes with nothing left unplaced and
#     re-encodes byte for byte.
#   uesp-skyrim: the EDID string convention (M2.B2); the shared BfcbBlock group keeps its
#     own provenance.
#
# An inventory: EDID and the component block frame are typed; every other payload is
# opaque (named after its signature, a placeholder) until a family lane decodes the
# record (docs/gaps.md). The REFL payload is Bethesda's reflection data — the material
# swap entries themselves — and stays opaque here; a separate ticket decodes it.
# Inside component blocks (kept raw by BfcbBlock): FLCS FLTR INTV KSIZ KWDA.
signature = "LMSW"
name = "LayeredMaterialSwap"
source = "corpus: inventory_types_full (crates/esm/tests/inventory_types.rs), 2026-10-27: every official LMSW record (17410) decodes with every subrecord placed and re-encodes identically"
confidence = "corpus"
note = "inventory definition (KK-008): corpus order and cardinality; EDID and component frames typed, every other payload opaque"

