#     opaque), the base form components (L14180, the shared BfcbBlock), the required LVLD
#     (L14181; L2252), the required LVLM (L14182), the required LVLF flags (L14183-L14193,
#     only bit 8 named), the list conditions (L14194; L4750-L4840, the shared Condition
