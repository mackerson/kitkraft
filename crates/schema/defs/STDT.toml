# STDT: Star, one star system's sun: its name, galactic position in parsecs, system ID,
# colour, an optional binary companion and the sun preset (SUNP) that draws it. Planets
# (PNDT) name the star they orbit through their own data.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17915-L17934 - member order, the record flags,
#     ANAM, BNAM, ONAM, DNAM, ENAM, SNAM, PNAM, HNAM and WED0. Helpers: the base form
#     component block (L5984-L6832, kept raw), keywords (wbDefinitionsCommon.pas
#     L8935-L8951, common/Keywords.toml), the position vector (wbDefinitionsCommon.pas
#     L6767-L6773 over L6742-L6758), the byte colour (wbDefinitionsCommon.pas L6954-L6968),
#     the sound reference (L2213 onwards, kept opaque).
#   corpus: the 124 STDT records (Starfield.esm 123, ShatteredSpace 1; form versions 581,
#     582), 2026-10-14: order EDID [BFCB blocks] KSIZ KWDA ANAM BNAM DNAM ENAM PNAM (one
#     ShatteredSpace override is EDID DNAM ENAM); BNAM 12 bytes, ENAM 4, the rest 4; ONAM,
#     SNAM, HNAM and WED0 never occur. Every record decodes and re-encodes identically.
#
# The planet and star data live in the component blocks (BGSOrbitedDataComponent_Component,
# BGSStarDataComponent_Component, TESPlanetModel_Component, TESFullName_Component, ...),
# which stay raw; the displayed name is the TESFullName component's FULL.
