# OMOD: object modification (weapon and armor mods and their property changes).
#
# Sources (ADR 0004, ADR 0005; every member cites its own lines):
#   xedit: the OMOD definition of wbDefinitionsSF1.pas at the pinned revision (L15429-L15476),
#     its property list (L6894-L6938, common/ObjectModProperty.toml) and the other helpers
#     it uses: member order, cardinality, field layouts, FormID target types, flag values.
#   corpus: the round 3 typed check of all 3,330 official OMOD records (14 files, form
#     versions 552, 581 and 582): every member marked `corpus` occurs with the declared size
#     and order in every record, nothing is left in `extra`, and every record re-encodes
#     identically (DATA payloads from 34 to 511 bytes, so the counts and prefixes hold).
#   uesp-skyrim / universal scan: the EDID, FULL and DESC string conventions (M2.B2).
#
# Names are ours (PascalCase, CK wording where it exists); no xEdit code, comments or labels
# are copied. FormID fields keep the raw stored value (0 means none); targets name the record
# types xEdit allows. One-byte booleans use the shared Bool8 enum. Inside each property, the
# function type and the two values are struct-field unions decided by the value type (lane B
# round 4; Value1's FormID variant is visited by form_ids()), and the property name is a
# plain u32 (see common/ObjectModProperty.toml). VMAD, the BFCB
# component data and the unknown XFLG stay opaque; members no official OMOD has stay at
# `reference`.
