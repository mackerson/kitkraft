# OMOD: subrecord inventory. The universal subrecords (EDID, FULL, DESC) are typed (M2.B2,
# sources on each member); every other payload is opaque until the record layout is
# transcribed (lane B round 3, xEdit at the pin; OMOD is in scope since the owner approval
# of 2026-10-14).
#
# Source (ADR 0005 "inventory" row): corpus scan of the OMOD top groups of the 14 official
# ESMs (2026-10-14): 3,330 records, form versions 552/581/582, 23 distinct subrecord
# sequences, all consistent with the order below. FNAM, NAM1 and LNAM never occur together,
# so their relative order is unknown. A KSIZ/KWDA pair occurs only inside BFCB blocks (3
# records), where it stays raw. DATA varies in size (125 distinct sizes).
#
# Opaque member names are placeholders derived from the signature.
