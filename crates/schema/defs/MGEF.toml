# MGEF: Magic Effect, the base effect a spell's effect entry points at (EFID): its
# archetype, the actor value it changes, art, shaders, sounds, flags and casting data.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14360-L14554 - member order, MDOB, DATA (136
#     bytes: field order, widths, archetype enum, flag bits), the counter effects, the
#     sound list, DNAM and the conditions. Helpers: EDID (L3182), script data
#     (L3393-L3411, kept opaque), the base form component block (L5984-L6832, kept raw),
#     FULL (L3184), keywords (wbDefinitionsCommon.pas L8935-L8951), the actor value
#     (L2271-L2274), the sound level enum (L2574-L2581), the cast and target enums
#     (L4141-L4152), the sound reference (L2197-L2211, common/SoundReference.toml), the
#     conditions (L4750-L4840, common/Condition.toml).
#   corpus: the 989 MGEF records (Starfield.esm 853, SFBGS00D 75, ShatteredSpace 44,
#     SFBGS050 10, SFBGS007 6, SFBGS003 1; form versions 581, 582), 2026-10-14: order EDID
#     [VMAD] [BFCB block] [FULL] [KSIZ KWDA] DATA ESSH* DNAM CTDA*; DATA 136 bytes, ESSH 41,
#     DNAM 4 (localized), CTDA 32. Every record decodes and re-encodes identically.
#
# What stays opaque, and why: VMAD, the component block, and three DATA slots that are
# unions selected by the archetype (the associated item at offset 0, and the two
# associated actor values at offsets 56 and 68); each is kept as its 4 raw bytes. Their
# FormIDs (a light, weapon, NPC_, hazard, spell, damage type, enchantment, keyword or
# actor value, depending on the archetype) stay raw.
