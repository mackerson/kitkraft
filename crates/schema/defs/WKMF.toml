# WKMF: WwiseKeywordMapping, a Wwise keyword mapping: a mapping template, a keyword
# list, a count and the sound mappings (one sound ID and one sound block each).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L19046-L19107 - member order, EDID (L19047), the
#     mapping template (L19048-L19055), the keyword list (L19057-L19060), the count
#     (L19061-L19062) and the repeated sound-mapping group (L19063-L19106: the sound ID
#     L19064-L19091, the sound block L19092-L19105; the group's count is the WMSS count,
#     L19106). The upstream sound ID is a union whose arms depend on the record's
#     mapping template (wbWwiseKeywordMappingSoundDecider: wbDefinitionsCommon.pas
#     L6161-L6167); a definition here cannot name a sibling subrecord as a decider, so
#     the sound ID is kept a plain 16-bit value with a note.
#   corpus: the M4.BX2 scan of every official WKMF record (81 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full): which subrecords occur,
#     in which order and how often, and their sizes. The soun_wkmf_types scan
#     (crates/esm/tests/soun_wkmf_types.rs) checks this definition against the same
#     records: every subrecord is placed, every placed subrecord decodes, and the
#     re-encoding reproduces every record.
#
# The sound block carries a count its upstream layout lacks: upstream reads its switch
# data to the end of the payload, but every official WMSD is a sound reference plus 4
# bytes plus 32 bytes per entry, and the 4 bytes after the reference are that count,
# which also equals the record's sound mappings (WMSS).
