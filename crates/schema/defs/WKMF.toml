#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the WKMF definition of wbDefinitionsSF1.pas at the pinned revision (L19046-L19107),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared Keywords
#     and BfcbBlock groups keep their own provenance.
#   lane E's corpus lstring table: which subrecords are lstrings (M3.B8).
