#     target types, flag values.
#   corpus: tests/world_family.rs over every REFR record of the 14 official ESMs (see the
#     record evidence).
#
# Record header flags: xEdit names them per base object type (a formatting union decided by
# NAME's record type), so no bit names are listed here; the flags are kept as stored.
#
# Member order: xEdit marks the members of placed references as unordered, and the official
# files do not follow one order. The order below is the linear order that agrees with the
# most official records (computed from every corpus record); a subrecord outside it is
