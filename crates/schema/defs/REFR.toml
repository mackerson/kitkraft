# docs/schema/world-family.md has the counts per signature.
#
# Names are ours; no xEdit code, comments or labels are copied. FormIDs are raw stored values
# (0 means none). Fields xEdit leaves unnamed are named by their byte offset (`Float12`,
# `Bytes8`). Members no official record of this type has stay at `reference`.
