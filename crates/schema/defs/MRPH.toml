# MRPH: MorphableObject, a morphable object: the morph files of a body or head part (the
# target morph and the character-generation morph paths) and its base vertex colour.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14622-L14649 - member order, the record flags
#     (L14623-L14633, ten flag bits), EDID (L14639), the two morph path strings TMPP
#     (L14642) and TCMP (L14643), and the MOBC base vertex colour struct (L14645-L14648: one
#     8-bit value and three unused bytes). Upstream also lists the script data (L14640),
#     the base form component block (L14641) and a bone morph definition path, BMPP
#     (L14644); no official record has any of the three, so they are left out (a plugin
#     that has one keeps it raw).
#   corpus: the mrph_types scan in crates/esm/tests/mrph_types.rs checks this definition
#     against every official MRPH record (1145 in the 14 ESMs): every subrecord is placed,
#     every placed subrecord decodes, and the re-encoding reproduces every record.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
