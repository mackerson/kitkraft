# STAT: Static, a placeable object with a model and no behaviour of its own (walls, rocks,
# outpost structure pieces). Most outpost building parts are STAT or MSTT records that a
# constructible object recipe (COBJ) names; their keywords live in a keyword component
# block (BGSKeywordForm_Component), not in a top-level KSIZ/KWDA.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17847-L17894 - member order, the record flags, the
#     direction material DNAM (two floats, two more optional), STLS. Helpers: script data
#     (L3407-L3411, kept opaque), object bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY
#     (L3921-L3923), OPDS (L3925-L3962), PTT2 (L3965-L3978), SNTP/SNBH (L3919-L3920), DEFL
#     (L3963), XALG (L3230), the base form component block (L5984-L6832, kept raw), FTYP
#     (L5699), the generic model (L7008-L7029, common/Model.toml), PRPS (L5679-L5686,
#     common/PropertyValue.toml), FULL (L3184), the sound reference (L2213-L2227,
#     common/SoundReference.toml), navmesh geometry (L3995-L4128, kept opaque).
#   corpus: the 22,296 STAT records (Starfield.esm 20,607, ShatteredSpace 1,291, SFBGS050
#     255, SFBGS00D 134, SFBGS003 6, SFBGS008 3; form versions 576, 581, 582), 2026-10-14:
#     order EDID OBND ODTY [OPDS] [PTT2] [SNTP] [SNBH] [DEFL] [XALG] [component blocks]
#     [FTYP] [MODL] MOLM* FLLD [XFLG] [PRPS] [FULL] DNAM [STLS] [NVNM]; OBND 24, ODTY 4,
#     OPDS 80, PTT2 32, SNTP/SNBH/DEFL 4, XALG 8, FTYP 4n, DNAM 8, STLS 40, PRPS 12n. No
#     record is compressed and none has VMAD. Every record decodes and re-encodes
#     identically. EDID is absent from 4 records and MODL from 15.
#
# DNAM: 1.0 / 1.0 in all but two records; the second float is unnamed upstream and keeps a
# positional name. Component names (BFCB) are counted in docs/schema/items-workshop-family.md.
