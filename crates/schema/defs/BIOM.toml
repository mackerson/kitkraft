# BIOM: Biome, a planet surface type: its flora, resources (RSGD), procedural object
# generation per terrain mask (which pack-ins, leveled pack-ins, containers or references
# to scatter, and how densely), climate, water, density multipliers, colours, marker
# keywords and the terrain textures and noise of each layer.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L10119-L10241 - member order and every layout:
#     the mask groups (FNAM name, BNAM, GNAM objects, DNAM footprints), the swap lists,
#     the water group, multipliers and links, colours, the biome type, the marker groups,
#     the terrain entries (LNAM/ANAM and the six noise texture strings), TX16, BTPS, BDFS,
#     EFSD and the three globals. Helpers: keywords (wbDefinitionsCommon.pas L8935-L8951,
#     common/Keywords.toml), the mask names (L8362-L8380), the noise layer (L8382-L8394,
#     common/BiomeNoiseLayer.toml), the BGRA colour (wbDefinitionsCommon.pas
#     L7051-L7067, common/ColorBgra.toml), the boolean enumeration
#     (wbDefinitionsCommon.pas L7514-L7521), FULL (L3184).
#   corpus: the 434 BIOM records (Starfield.esm 431, ShatteredSpace 3; form versions 581,
#     582), 2026-10-14: every record fits the order below (273 distinct sequences); GNAM 84
#     bytes (50,172 occurrences), DNAM 16, LNAM/ANAM 12, BTPS 224, BDFS 44, colours 4,
#     PNAM a multiple of 4. BNAM is 01 00 00 00 in all 1,757 masks. Every record decodes and
#     re-encodes identically.
#
# Terrain entries are a list where each element is exactly one of LNAM, ANAM or a noise
# texture string; modelling them as a repeated group of optional members (in that order)
# reads every official sequence and writes it back unchanged.
