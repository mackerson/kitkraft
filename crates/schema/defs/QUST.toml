# QUST: Quest. The general data (flags, priority, type, event, location), the dialogue and
# story manager conditions, the stages with their log entries and rewards, the objectives
# with their targets, the aliases (reference, location and reference-collection aliases),
# and the mission board entry. Dialogue topics and scenes of a quest are stored in its
# children group (group type 10), not in the record.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L16339-L16514 - member order, DNAM, the stage
#     (INDX, log entries, rewards), objective (QOBJ, FNAM, NNAM, QSTA targets), alias and
#     mission board layouts, FormID targets. Helpers: script data (L3484-L3530, the quest
#     variant, common/ScriptAttachment.toml), the base form component block (L5984-L6832,
#     kept raw), the filter string (L5697), the condition list (L4750-L4840,
#     common/Condition.toml), the reference alias (L7996-L8163,
#     common/QuestReferenceAlias.toml), the location alias (L8165-L8236), the
#     reference-collection alias (L8238-L8254), the keyword list
#     (wbDefinitionsCommon.pas L8935-L8951), the quest event codes
#     (wbDefinitionsCommon.pas L8119-L8172) and the event member codes (L2918-L2937).
#   corpus: the 2,610 QUST records (Starfield.esm 2,077, ShatteredSpace 241, SFBGS050 134,
#     SFBGS00D 116, SFBGS003 37, SFBGS007 3, SFBGS004 2; form versions 581 and 582; none
#     compressed), 2026-10-14: order EDID [VMAD] [FULL] [BFCB block] DNAM [QTYP] [FTYP]
#     [ENAM] [LNAM] [QTLM] [QSRC] [QDUP] QTGL* [FLTR] [NAM3] CTDA* NEXT CTDA* stages
#     objectives ANAM aliases [GNAM] [mission board] [SCCM]; no CITC precedes either
#     condition list; DNAM 12 bytes, INDX 4, QSDT 1, QSRD 4 (count) then 0 (end marker),
#     QRRD 8, QOBJ 2, QSTA 12, ALAM 4, ALMI 1. No SNAM occurs. Every record decodes with
#     nothing left over and re-encodes identically.
#
# Aliases: reference (ALST..ALED), location (ALLS..ALED) and reference-collection (ALCS,
# ALMI, ALAM, then a reference alias or a bare ALED) aliases interleave in the order they
# were created. Each `Aliases` entry holds a run of reference aliases, then location
# aliases, then collection aliases; the next alias of an earlier kind starts a new entry.
# The list of entries, in order, is the quest's alias list.
signature = "QUST"
