# STMP: SnapTemplateForm, the layout of a snapping outpost or ship piece: its node
# instances (each a template node with an offset and rotation), the overrides a child
# template applies to its parent's instances, bound and origin overrides, the next free
# instance ID, the piece type, and the traversal categories that link instances.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L17941-L18006 - member order, the record flags
#     (L17942-L17952, ten bits by bit number), EDID (L17958), the base form components
#     (L17959, the shared BfcbBlock), PTT2 (L17960; L3965-L3978), PNAM (L17961), HNAM
#     (L17962), the node instances (L17963-L17977: ENAM, an instance ID, a template node,
#     an offset and rotation in degrees with the vector helpers of wbDefinitionsCommon.pas
#     L6725-L6740 and L6843-L6857, a display case slot and four bytes upstream leaves
#     unnamed), the inherited overrides (L17978-L17981: ONAM and TNAM), BNAM (L17982-L17986),
#     GNAM (L17987), INAM (L17988), STPT and its piece types (L17989-L17997) and the
#     traversal categories (L17999-L18005: CNAM, then traversal nodes of an RNAM and its
#     SNAM instance IDs).
#
# Before KK-254 this was an inventory definition (KK-100): corpus order and cardinality,
# every payload but EDID and the component frame opaque. The order here is xEdit's; the
# official records follow it (none has BNAM together with ONAM or TNAM, so the corpus alone
# could not order those). The FLTR and INTV the parity table counts outside the definition
# sit inside base form components, whose data the shared block keeps raw.
