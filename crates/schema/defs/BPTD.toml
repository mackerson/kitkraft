# BPTD: BodyPartData, the body-part data of a creature's body: the generic model and the
# list of body parts. Each part names itself and points at its node and VATS target,
# carries a data block (damage, flags, part type, health, the cripple effects), names its
# gore target bone and hit-reaction strings, and references the blood-impact materials.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the BPTD definition of wbDefinitionsSF1.pas at the pinned revision,
#     L10452-L10527 - member order: EDID (L10453), the base form components (L10454,
#     L5984-L6832, common/BfcbBlock.toml), the generic model (L10455, L7008-L7029,
#     common/Model.toml) and the body-parts array (L10456-L10525). Each part is a struct
#     (L10457-L10520) whose first member is not required (L10524): the part name lstring
#     (L10458), the part node and VATS target strings (L10459-L10460), the data block
#     (L10461-L10513), the gore target bone and the hit-reaction strings
#     (L10514-L10516), the two blood-impact material references (L10517-L10518) and the
#     twist-variable prefix (L10519).
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#   corpus: the 27 BPTD records of the 14 official ESMs (crates/esm/tests/bptd_types.rs,
#     bptd_types_full, 2026-10-31): every subrecord is placed in a member in the
#     definition's order, every placed subrecord decodes with the declared layout and
#     every record re-encodes identically. EDID, the model's MODL and FLLD, and the part
#     members BPTN, BPNN, BPNT, BPD2, NAM4, ENAM, FNAM and DNAM are in all 27; INAM in 3
#     and JNAM in none; the base form components and the model's MOLM, MODC and XFLG are
#     absent from all 27.
#   corpus: lane E's corpus lstring table (crates/engine/src/edit/lstrings.rs, checked by
#     lstring_table_matches_the_corpus): BPTN is an lstring in every official BPTD record.
#
# Names are ours (UpperCamelCase, CK wording where it exists).
