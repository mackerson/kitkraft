# PGRE: placed projectile. Lives in the children group of a cell like every placed
# reference; NAME is the PROJ or HAZD base form placed. It shares the member set of
# every placed reference (xEdit's ReferenceRecord helper).
#
# Sources (ADR 0004, ADR 0005; every member cites its own lines):
#   xedit: the PGRE definition of wbDefinitionsSF1.pas at the pinned revision,
#     ReferenceRecord(PGRE) at L7132 through the shared ReferenceRecord helper
#     L7063-L7113, and the helpers it names there and in wbDefinitionsCommon.pas:
#     field layouts, FormID target types, flag values.
#   corpus: tests/pgre_types.rs over every PGRE record of the 14 official ESMs (see the
#     record evidence), and the M4.BX2 scan for the VMAD size.
#
# Record header flags: the six bits xEdit names for the placed-reference definition
# (L7068-L7075).
#
# Member order: xEdit marks the members of placed references as unordered, and the
# official files do not follow one order. The order below is the one the most official
# records use (from the M4.BX2 scan). The record is `unordered` (M4.BX1): the decoder
# matches a subrecord from its current member on and, when none accepts it there, from
# the first member again, and writes the values back in their on-disk order, so every
# member is typed wherever it stands.
#
# Names are ours; no xEdit code, comments or labels are copied. FormIDs are raw stored
# values (0 means none). Members no official record of this type has are not listed; a
# plugin that has one keeps it raw in `extra`.
signature = "PGRE"
name = "PlacedProjectile"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L7132-L7132"
confidence = "corpus"
evidence = [
  "corpus: kitkraft-esm tests/pgre_types.rs (pgre_types_full), 2026-10-31: in all 2,599 PGRE records of the 14 official ESMs every subrecord this definition places decodes with the declared layout and every record re-encodes identically",
]
flags = [
  ["TurnOffFire", 0x80],
  ["Persistent", 0x400],
  ["InitiallyDisabled", 0x800],
  ["ReflectedByAutoWater", 0x10000000],
  ["DontHavokSettle", 0x20000000],
