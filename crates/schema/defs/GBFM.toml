# GBFM: Generic Base Form, a base object assembled from base form components (BFCB
# blocks) under a template (ANAM: GBFT). Ship modules and other component-built objects
# use it; nearly everything a GBFM describes lives in its components, which stay raw here.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L12247-L12264 - member order, the record flag, the
#     template link, the instance-data names (STRV), the object template block, the two STOP
#     markers and NVNM. Helpers: script data (L3393-L3411, kept opaque), object bounds
#     (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), the
#     base form component block (L5984-L6832, kept raw), FLTR (L5697), the object template
#     (L6961-L6974) with its OBTS item (L6940-L6959, kept opaque: its property list holds
#     unions), navmesh geometry (L3995 onwards, kept opaque).
#   corpus: the 3,903 GBFM records (Starfield.esm 3,141, BlueprintShips-Starfield 356,
#     SFBGS006 175, SFBGS050 148, BlueprintShips-SFBGS050 32, ShatteredSpace 24, SFBGS00D 22,
#     SFBGS003 3, SFBGS004 1, SFBGS047 1; form versions 581, 582), 2026-10-14: order [EDID]
#     [VMAD] OBND ODTY [OPDS] BFCB blocks [FLTR] ANAM STRV+ [OBTE OBTF OBTS] STOP
#     STOP [NVNM]. OBTE is always 1 with one combination; STRV is
#     "BGSMod_Template_Component" (every record) or "Spaceship_InstanceData"; NVNM starts
#     with version 17. Every record decodes and re-encodes identically.
#
# Upstream also allows a FULL name inside a combination (L3184). No official combination has
# one, and FULL occurs inside GBFM component blocks (TESFullName_Component). The doc layer
# resolves layouts by position since M4.BX1, so the combination FULL is a member again
# (`reference`; the integrator added it when lane B round 3's lstring table, which lists
# GBFM FULL and HULL, was merged). The FULL and HULL that official GBFM records carry sit
# inside the full-name and hull-code components and stay raw with the component data
# (BfcbBlock); tools treat them as lstrings by the corpus table (engine edit::lstrings).
#
# The component names a GBFM uses (BFCB) are counted in docs/schema/planet-family.md.
