# MATT: Material Type, the material property record the physics engine reads for a
# surface: the Havok display colour, the buoyancy, the surface behaviour flags, the
# Havok impact data set, the breakable FX and the light layer.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the MATT definition of wbDefinitionsSF1.pas at the pinned revision
#     (L14291-L14307): EDID (L14292, the shared wbEDID string, L3182), the base form
#     component frame (L14293, the shared block L5984-L6832), the Material Parent form
#     (L14294, MATT or none), the Material Name string (L14295), the Havok Display
#     Colour (L14296, a struct of three floats, wbDefinitionsCommon.pas L7084-L7103),
#     the Buoyancy float (L14297), the Flags u32 (L14298-L14303), the Havok Impact Data
#     Set form (L14304, IPDS), the Breakable FX string (L14305) and the Light Layer
#     (L14306, the shared wbFLLD u32 flags, L3818-L3823).
#   corpus: kitkraft-esm tests/matt_types.rs (matt_types_full), 2026-11-06 - the 255
#     MATT records of the 14 official ESMs: EDID 255 (12 to 59 bytes), PNAM 247 (4
#     bytes), MNAM 255 (4 to 45 bytes), CNAM 255 (12 bytes), BNAM 255 (4 bytes),
#     FNAM 255 (4 bytes), HNAM 210 (4 bytes), ANAM 1 (55 bytes), FLLD 255 (4 bytes).
#     No base form components occur, and no record carries both an HNAM and an
#     ANAM. Every record decodes and re-encodes identically.
#
