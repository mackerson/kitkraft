# WRLD: worldspace. The record sits in the top WRLD group; its persistent cell, exterior
# blocks and cells follow in the world children group (type 1) labelled with its FormID.
#
# Sources (ADR 0004, ADR 0005; every member cites its own lines):
#   xedit: the WRLD definition of wbDefinitionsSF1.pas at the pinned revision (L18940-L19035)
#     and the worldspace helpers in wbDefinitionsCommon.pas it uses (Starfield branches only):
#     member order, field layouts, FormID target types, flag values.
#   corpus: tests/world_family.rs over every WRLD record of the 14 official ESMs (see the
#     record evidence). Every official WRLD keeps xEdit's member order.
#
# Several members that xEdit lists are, in the official files, only found inside a BFCB
# component block (BNAM, PNAM, NAM2..NAM9, ZNAM ... CITC/CTDA); those bytes belong to the
# block and stay raw there. OFST and CLSZ are per-cell u32 tables, row after row; the row
# width follows from the bounds (NAM0/NAM9 X) and is not stored, so the tables are typed as
# flat lists. RNAM (large references) carries its own u32 count.
#
# Names are ours; no xEdit code, comments or labels are copied. FormIDs are raw stored values
# (0 means none). Members no official WRLD has stay at `reference`.
