#     (L12386, L5984-L6832, common/BfcbBlock.toml), the name (L12387) and description
#     (L12388) lstrings, the type data struct (L12389-L12422) whose members are the
#     type (L12390-L12395) and the type-dependent data (L12396-L12421), the rewards
#     (L12423-L12428) and the keywords (L12429, L8935-L8951, common/Keywords.toml).
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#   corpus: the 31 GPOF records of the 14 official ESMs (crates/esm/tests/gpof_types.rs,
