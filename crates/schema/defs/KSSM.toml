#     every placed subrecord decoded, every record re-encoded identically, and one
#     record's values pinned (Starfield.esm 0x00000B54).
#
# RSMC stands for two things at two positions: the leading RSMC is the stored count of
# the reverb entries (a separate subrecord, so nothing can derive it), and each entry's
# RSMC is that entry's class. The ordered matcher gives the first RSMC to ReverbCount
# and the later ones to the group.
#
# WED0 and RSMH are the shared SoundReference layout (common/SoundReference.toml); the
# Wwise event GUIDs inside it stay raw.
