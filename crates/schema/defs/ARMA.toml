# ARMA: Armor Addon, the per-gender model layer an armor (ARMO) lists by index in its
# Addon group. It carries the first-person biped slot bits (BO64), the race, the biped
# and first-person models for both genders, the skin textures and morphs, the body-part
# and bone data, and the AVM animation data.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L9619-L9704 - member order, the record flags,
#     EDID (L9628), BO64 (L2543-L2549, a u64 of biped slots; the bit names, transcribed
#     from L2474-L2541, live in the shared BipedSlots definition), RNAM (L9632), DNAM
#     (L9633-L9641), the two model blocks (L9642-L9651), MOD6/MOD7 (L9653-L9654), the
#     skin textures and morphs (L9656-L9664), the additional-race list (L9666), SNDD
#     (L9667), ONAM (L9668), PNAM (L9669), the AVM data block (L9670-L9699, the group
#     type enum L7031-L7037) and the bone data block (L9700-L9703). Helpers: script data
#     (L3407-L3411, kept opaque), the base form component block (L5984-L6832, kept raw),
#     the textured model (wbDefinitionsCommon.pas L9512-L9544, its members unordered),
#     the MOLM-style swap list (L7000-L7006), the colour remapping index (L3812-L3816),
#     the model flags (L3801-L3810), the sex enum (wbDefinitionsCommon.pas L8174-L8183).
#     Upstream ignores FLLD and XFLG in this record (L9704).
#
# The 14 official ESMs hold 1,238 ARMA records; the apparel_types scan in
# crates/esm/tests/apparel_types.rs checks this definition against them: every
# subrecord is placed, every placed subrecord decodes, and the re-encoding
# reproduces every record. Each record carries six FLLD light layers (7,428 in
# total, one per model slot, all 4 bytes), and 380 XFLG model flags occur, each
# directly after a model's FLLD (all 1 byte).
signature = "ARMA"
name = "ArmorAddon"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L9619-L9704"
