# TRNS: Transform, a stored placement for a preview: a position and rotation, a scale and a
# zoom range, which basis the placement is taken in, and colour-mode flags (inventory
# previews and load screens use them).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L18381-L18428 - member order, the record flags
#     (L18382-L18394, twelve flag bits), EDID (L18400), the DATA struct (L18402-L18413: the
#     shared position/rotation helper, then the scale and the two zoom limits), the BNAM
#     basis enum (L18414-L18419) and the ENAM colour-mode flags (L18420-L18427). Upstream
#     also lists the base form component block (L18401); no official record has one, so it
#     is left out (a plugin that has one keeps it raw).
#   corpus: the trns_types scan in crates/esm/tests/trns_types.rs checks this definition
#     against every official TRNS record (733 in the 14 ESMs): every subrecord is placed,
#     every placed subrecord decodes, and the re-encoding reproduces every record.
#
# DATA: upstream marks the members after the rotation as optional, but every official DATA
# is 36 bytes, so all nine floats are typed as present.
