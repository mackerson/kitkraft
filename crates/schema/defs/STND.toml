# snap nodes can be snapped to, with an optional hinge behaviour, a stairway type,
# a min/max/step angle range and an art object.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L18008-L18062 - member order, the record flags,
#     FNAM and its bits, SNST, NNAM and the Angles block (three FLTV floats). Helpers:
#     script data (L3407-L3411, kept raw), object bounds (wbDefinitionsCommon.pas
#     L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), PTT2 (L3965-L3978),
#     SNTP/SNBH (L3919-L3920), DEFL (L3963), XALG (L3230), the base form component block
#     (L5984-L6832, kept raw), the generic model (L7008-L7029), keywords
#     (wbDefinitionsCommon.pas L8935-L8951), the byte RGBA colour (wbDefinitionsCommon.pas
#     L7018-L7033).
#   corpus: the 183 official STND records of the 14 official ESMs: the KK-104 scan
#     (crates/esm/tests/inventory_types.rs, inventory_types_full, 2026-10-28) gives the
#     order and the per-signature counts; stnd_types_full (crates/esm/tests/stnd_types.rs)
#     re-checked every record: every subrecord is placed, every placed subrecord decodes,
#     and the re-encoding reproduces every record. No VMAD, OPDS, PTT2, SNTP, SNBH, DEFL or
#     XALG occurs.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# Inside component blocks (kept raw by BfcbBlock): FLTR INTV.
