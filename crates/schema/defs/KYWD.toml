# KYWD: subrecord inventory. The universal subrecords (EDID, and FULL where present) are
# typed (M2.B2, sources on each member); every other payload is opaque until sourced.
#
# Source (ADR 0005 "inventory" row): corpus scan of the KYWD top group in Starfield.esm, ShatteredSpace.esm,
# Constellation.esm, OldMars.esm and SFBGS003/004/006/007/008/00D/047/050.esm (2026-10-14):
# 6965 records, form versions 552/581/582, 14 distinct subrecord sequences, all consistent
# with the order below. DATA and ENAM never occur in the same record, so their relative
# order is unknown.
#
# DNAM and ENAM vary in size, but no source splits them into fields, so they stay opaque
# (an `if_remaining` tail needs the field split as a sourced fact, not just two sizes).
#
# Opaque member names are placeholders derived from the signature.
signature = "KYWD"
name = "Keyword"
source = "corpus: KYWD records of the official ESMs (12 files with a KYWD group)"
confidence = "corpus"

[[member]]
sig = "EDID"
name = "EditorId"
type = "zstring"
card = "optional"
note = "absent in 3 of 6965 records"
evidence = [
  "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:File_Format_Conventions",
  "corpus: universal subrecord scan 2026-10-14: all 265,346 EDID payloads in the 14 official ESMs end in their only NUL and are printable ASCII",
]

