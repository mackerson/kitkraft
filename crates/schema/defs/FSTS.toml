#     counts, walking, running, sprinting, sneaking and swimming) and the
#     required footstep list DATA (L12106-L12122: FormIDs of FSTP). Upstream
#     also lists VMAD (L12097) and the base form component block (L12098); no
#     official record has either, so they are left out (a plugin that has one
#     keeps it raw).
#   corpus: the fsts_types scan in crates/esm/tests/fsts_types.rs checks this
#     definition against every official FSTS record (19 in the 14 ESMs): every
#     subrecord is placed, every placed subrecord decodes, and the re-encoding
#     reproduces every record.
#
# The pinned file splits DATA into five FormID lists sized by the five XCNT
# counts (swimming first, walking last); a count kept in another subrecord is
# not expressible in the format, so DATA is one list whose length is the sum
# of the counts.
