# AVMD: AvmsData, inventory definition (KK-022).
#
# Sources (ADR 0004, ADR 0005):
#   corpus: the inventory scan of every official AVMD record (6530 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full, 2026-10-29): which
#     subrecords occur, in which order and how often, written out by `cargo xtask
#     inventory-def`. Every member is listed because the corpus has it, and every official
#     record decodes with nothing left unplaced and re-encodes byte for byte.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared BfcbBlock
#     keeps its own provenance.
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# An inventory: EDID and the component block frame are typed; every other payload is opaque
# (named after its signature, a placeholder) until a family lane decodes the record
# (docs/gaps.md).
# Inside component blocks (kept raw by BfcbBlock): FLLD GNAM MODL.
