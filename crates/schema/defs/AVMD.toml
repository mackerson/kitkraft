#     subrecords occur, in which order and how often. Every member is listed because the
#     corpus has it, and every official record decodes with nothing left unplaced and
#     re-encodes byte for byte.
#
# An inventory: EDID is typed, the base form component frame is the shared BfcbBlock, and
# every other payload is opaque (named after its signature, a placeholder) until a family
# lane transcribes the record from the pinned xEdit file (docs/gaps.md). The middle of the
# record is a run of animation entries (LNAM, an optional VNAM and NNAM per entry); the
# entries alternate with no other member between them, so they sit in one repeated group.
