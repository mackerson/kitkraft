# MUSC: Music Type, the music-type form of the audio engine's music system: it groups
# the tracks (MUST) that play for a situation and carries the playback flags, the
# priority and ducking, the fade duration, and the re-evaluation intervals.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14701-L14722 - member order, EDID (L14702), the
#     script data (L14703, kept opaque), the base form components (L14704, the shared BfcbBlock),
#     FNAM (L14705-L14713, its seven flag bits), PNAM (L14714-L14717), WNAM (L14718),
#     VNAM (L14719), UNAM (L14720) and TNAM (L14721, the track list).
#
# The 14 official ESMs hold 117 MUSC records; the musc_types scan in
# crates/esm/tests/musc_types.rs checks this definition against them: every
# subrecord is placed, every placed subrecord decodes, and the re-encoding
# reproduces every record.
