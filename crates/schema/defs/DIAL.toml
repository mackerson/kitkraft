# DIAL: Dialog Topic. A topic belongs to a quest (QNAM) and, for player dialogue, to a
# branch (BNAM, a DLBR); its responses are the INFO records in its own children group
# (group type 7), listed here in TIFL with their count in TIFC. Topics are stored in the
# children group of their quest (group type 10), not in a top-level DIAL group.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L11297-L11523 - member order, PNAM, the DATA
#     layout (topic flags, category, subtype), SNAM, TIFL and TIFC, FormID targets.
#     Helpers: the base form component block (L5984-L6832, kept raw), the dialogue subtype
#     codes (L4461-L4645). The INOM and INOA members upstream are editor-internal
#     (wbDefinitionsCommon.pas L8878-L8898: never saved) and are not part of the format.
#   corpus: the 87,031 DIAL records (Starfield.esm 68,154, ShatteredSpace 9,990, SFBGS00D
#     4,189, SFBGS050 3,580, SFBGS003 1,105, SFBGS004 13; form versions 581 and 582; none
#     compressed; every one in a group of type 10), 2026-10-14: order [EDID] [BFCB block]
#     [FULL] PNAM [BNAM] QNAM [KNAM] [ANAM] DATA SNAM TIFL TIFC; PNAM, BNAM, QNAM, KNAM,
#     ANAM, DATA, SNAM, TIFC 4 bytes; TIFL a multiple of 4 (0 to 3,752 bytes). No record has
#     both a component block and FULL, so their relative order is not confirmed. Every
#     record decodes with nothing left over and re-encodes identically.
signature = "DIAL"
name = "DialogTopic"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L11297-L11523"
evidence = [
  "corpus: the 87,031 DIAL records of the 14 official ESMs, 2026-10-14 scan; every record decodes with an empty extra and re-encodes identically",
]
confidence = "corpus"
flags = [["PartialForm", 0x4000]]

