# LVLN: Leveled NPC, a leveled list whose entries are actors (NPC_) or other leveled
# actor lists. NPC_ templates (TPLT and the TPTA slots) and spawn markers point at it; the
# game picks an entry by the player's level, the chance values and the entry conditions.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14077-L14116 - member order, the record flag,
#     LVLD/LVLM/LVLF/LVLG/LLCT, the entry group (LVLO, COED, conditions), LLKC, ONAM and
#     the model block. Helpers: EDID (L3182), script data (L3393-L3411, kept opaque),
#     object bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS
#     (L3925-L3962), XALG (L3230), the base form component block (L5984-L6832, kept raw),
#     LLCT (L2250), LVLD (L2252), the conditions (L4750-L4840, common/Condition.toml), the
#     leveled entry (wbDefinitionsCommon.pas L9062-L9084), COED (L2294-L2302, kept raw),
#     LLKC (L7791-L7800), the generic model (L7008-L7029) with MOLM (L7000-L7006), FLLD
#     (L3818-L3823), MODC (L3812) and the model flags (L3801-L3804).
#   corpus: the 298 LVLN records (Starfield.esm 243, ShatteredSpace 25, SFBGS050 16,
#     SFBGS00D 8, SFBGS003 6; form versions 581, 582), 2026-10-14: order EDID [VMAD] OBND
#     ODTY [BFCB block] LVLD LVLM LVLF LLCT (LVLO [CTDA...])* [ONAM] [MODL] FLLD; LVLO 12
#     bytes (up to 58 per record), LVLD 4, LVLM 1 (0 everywhere), LVLF 2, LLCT 1, CTDA 32,
#     ONAM 4 (localized), FLLD 4 (always 1), VMAD 136. Every record decodes and re-encodes
#     identically.
#
# The entry count LLCT is a separate subrecord, stored, not derived: an edit that adds or
# removes an Entry must update EntryCount too (the format cannot tie a count subrecord to a
# group's repetitions; the M3.B10 count_from rule covers counts inside one payload only).
# The two unused byte runs of LVLO are 0 in all 2,604 official entries.
