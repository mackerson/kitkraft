# LAYR: Layer, an editor layer that references are sorted into: its parent layer, its
# colour and how its references take part in LOD.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L13315-L13341 - ten record-header flags
#     (L13316-L13326; bit 27 carries two meanings upstream, one name is kept here, as
#     AAPD.toml writes the same ten bits); member order, EDID (L13331), the base form
#     component block (L13333), the FormID of another LAYR named 'Parent' (L13334), the
#     colour of three bytes and one unused byte (L13335, required) and the 32-bit enum
#     named 'LOD Behavior' with three values (L13336-L13340, required). Upstream also
#     lists the script data (L13332); no official record has it, so it is left out (a
#     plugin that has it keeps it raw).
#   corpus: the layr_types scan in crates/esm/tests/layr_types.rs checks this definition
#     against every official LAYR record (10424 in the 14 ESMs): every subrecord is placed,
#     every placed subrecord decodes, and the re-encoding reproduces every record. The
#     earlier inventory scan (M4.BX2, crates/esm/tests/inventory_types.rs) gives the
#     per-member counts below.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared
#     BfcbBlock and ColorRgb groups keep their own provenance.
#   lane E's corpus lstring table: no subrecord of this type is an lstring (M3.B8).
#
# Inside component blocks (kept raw by BfcbBlock): FLCS.
