#   corpus: the M4.BX2 scan of every official LAYR record (10424 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full): which subrecords occur, in
#     which order and how often. Every member is listed because the corpus has it, and every
#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the LAYR definition of wbDefinitionsSF1.pas at the pinned revision (L13315-L13341),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2); the shared Keywords
#     and BfcbBlock groups keep their own provenance.
#   lane E's corpus lstring table: which subrecords are lstrings (M3.B8).
#
# An inventory: EDID, the lstrings, the keyword list and the component block frame are
# typed; every other payload is opaque (named after its signature, a placeholder) until a
# family lane transcribes the record from the pinned xEdit file (docs/gaps.md). Members
# xEdit lists that no official record has are left out; a plugin that has one keeps it raw.
# Inside component blocks (kept raw by BfcbBlock): FLCS.
