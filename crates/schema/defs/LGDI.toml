# LGDI: LegendaryItem, inventory definition (KK-105).
#
# Sources (ADR 0004, ADR 0005):
#   corpus: the KK-105 scan of every official LGDI record (147 in the 14 ESMs,
#     crates/esm/tests/inventory_types.rs, inventory_types_full): which subrecords occur, in
#     which order and how often. Every member is listed because the corpus has it, and every
#     official record decodes with nothing left unplaced and re-encodes byte for byte.
#   xedit: the LGDI definition of wbDefinitionsSF1.pas at the pinned revision (L13639-L13754),
#     cited per member for its position where it lists the subrecord.
#   uesp-skyrim / universal scan: the EDID string convention (M2.B2).
#
# An inventory: EDID is typed; every other payload is opaque (named after its signature, a
# placeholder) until a family lane transcribes the record from the pinned xEdit file
# (docs/gaps.md). Members xEdit lists that no official record has are left out (VMAD, OPDS,
# PTT2, SNTP, SNBH, DEFL, XALG, the base form components and INAM); a plugin that has one
# keeps it raw.
# Order: official LGDI records put the condition subrecords (CITC and the CTDA conditions)
# in both orders, so the record matches unordered; members are listed in the order the
# records use, which is also the order xEdit lists them.
signature = "LGDI"
name = "LegendaryItem"
source = "corpus: inventory_types_full (crates/esm/tests/inventory_types.rs), 2026-10-28: every official LGDI record (147) decodes with every subrecord placed and re-encodes identically"
evidence = [
  "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L13639-L13754",
]
confidence = "corpus"
note = "inventory definition (KK-105): corpus order and cardinality; EDID typed, every other payload opaque"
unordered = true

