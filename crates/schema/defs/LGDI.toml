# LGDI: LegendaryItem, the Starfield legendary-item template: the object mod per rank
# (BNAM), the quality tiers (GNAM), the re-roll and pick costs (FNAM, KNAM, JNAM), the
# keyword filters per rank and tier (CNAM, DNAM, HNAM, INAM), the condition index map
# (LNAM) and the ranked mod conditions (CITC plus conditions).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L13639-L13754 - the record definition: the
#     record flags (L13640-L13652), EDID (L13657), VMAD (L3407-L3411, kept raw), the
#     object bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS
#     (L3925-L3962), PTT2 (L3965-L3978), SNTP (L3919), SNBH (L3920), DEFL (L3963),
#     XALG (L3230), the base form components (L5984-L6832), the generic model
#     (L7008-L7029), FULL (wbFull, L3184), the empty DATA (L13670), the three object
#     references ANAM/ENAM/MNAM (L13671-L13673), the rank slot arrays BNAM
#     (L13674-L13684) and GNAM (L13729-L13739), the condition index map LNAM
#     (L13685-L13695), the ranked mod conditions (L13696-L13702), the keyword filters
#     CNAM, DNAM, HNAM and INAM (L13703-L13704, L13740-L13741) and the cost arrays
#     FNAM, KNAM and JNAM (L13705-L13716, L13717-L13728, L13742-L13753). Helpers: the
#     rank slot (wbLGDIRankSlot, wbDefinitionsCommon.pas L8501-L8514), the rank enum
#     (L7832-L7842) and the quality tier enum (L7844-L7859), the filter array
#     (wbLGDIFilter, L9086-L9100) and the slot array (wbLGDIRankSlotArray,
#     L9102-L9126), the required condition count (L2251), the condition list
#     (L4750-L4840) and the base object signature list (L43-L54).
#
# The 14 official ESMs hold 147 LGDI records; the lgdi_types scan in
# crates/esm/tests/lgdi_types.rs checks this definition against them: every subrecord
# is placed, every placed subrecord decodes, and the re-encoding reproduces every
# record.
#
# The ranked mod conditions (L13696-L13702) are an upstream repeated block of a
# condition count and its conditions, but the official records put the count and the
# conditions in both orders, so the block is matched as the two repeated members the
# records use (the order is not significant; the record matches unordered).
signature = "LGDI"
name = "LegendaryItem"
