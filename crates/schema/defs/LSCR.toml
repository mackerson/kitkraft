# LSCR: LoadScreen, a load screen: its description text, conditions and image.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L13910-L13932 - the member order, EDID (L13915),
#     the required DESC (L13918), the conditions (L13919) and the load screen image
#     string (L13920). Upstream also lists the script data (L13916), the base form
#     component block (L13917) and, after the image, a NIF FormID (L13921), a Transform
#     FormID (L13922), a two-i16 rotation range (L13923-L13926), a two-float zoom range
#     (L13927-L13930) and a camera path string (L13931); no official LSCR record has
#     any of those, so they are left out - the corpus decides which members a
#     definition lists (a plugin that has one keeps it raw).
#   corpus: the lscr_types scan in crates/esm/tests/lscr_types.rs checks this
#     definition against every official LSCR record (393 in the 14 ESMs): every
#     subrecord is placed, every placed subrecord decodes, and the re-encoding
#     reproduces every record.
#
# The conditions are the shared Condition group (common/Condition.toml): a CTDA with
# its optional CIS1/CIS2 string parameters; LSCR has no CITC condition count.
