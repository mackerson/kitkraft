# MISC: Misc. Item, an inventory item with no other function (junk, crafting components,
# keys, trophies). Its CVPA lists the resources (IRES) it breaks down into.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14557-L14605 - member order, the record flags,
#     DATA (value, weight), FLAG and its bits, NNAM. Helpers: script data (L3407-L3411, kept
#     opaque), object bounds (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS
#     (L3925-L3962), PTT2 (L3965-L3978), SNTP/SNBH (L3919-L3920), XALG (L3230), the base
#     form component block (L5984-L6832, kept raw), FULL (L3184), the generic model
#     (L7008-L7029, common/Model.toml), destruction data (L3829-L3890,
#     common/Destructible.toml), CUSH/PUSH/PDSH (L2333-L2335, common/SoundReference.toml),
#     keywords (wbDefinitionsCommon.pas L8935-L8951), FIMD (L2329), CVPA (L2258-L2267), CDIX
#     (L2269).
#   corpus: the 1,495 MISC records (Starfield.esm 1,319, SFBGS00D 94, ShatteredSpace 46,
#     SFBGS050 26, SFBGS003 10; form versions 581, 582), 2026-10-14: order EDID [VMAD] OBND
#     ODTY [OPDS] [PTT2] [XALG] [component blocks] FULL MODL MOLM* FLLD [XFLG] [DEST block]
#     [CUSH] [PUSH] [PDSH] [KSIZ KWDA] [FIMD] [CVPA] DATA [FLAG] [NNAM]; DATA 8, FLAG 4,
#     CVPA 12 (one component per official record; components resolve to IRES), FIMD 4
#     (MESG), NNAM 4 (localized), sounds 40. No record is compressed. Every record decodes
#     and re-encodes identically. EDID is absent from 2 records; FULL from 10.
#
# Record flag 0x800 is named upstream both "calc from components" and "used as platform";
# the first is used here. It is not set on any official MISC.
