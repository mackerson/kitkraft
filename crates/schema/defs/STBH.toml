# Order: official STBH records repeat the behavior subrecords (ENAM, PNAM, CITC, the CTDA
# conditions, UNAM and VNAM) and show every pair of them in both orders, so the record
# matches unordered; members are listed in the order the records use, which is also the
# order xEdit lists them.
