# RACE: Race, the body plan every NPC_ points at (RNAM): size, movement, skeleton and
# animation per sex, attacks, body part and equip slots, character-generation presets and
# morphs, behaviour subgraphs and head parts.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L16517-L16812 - the record: member order, DAT2
#     (221 bytes), the skeleton, junk, chargen and head part sections per sex, attacks,
#     biped object names and conditions, movement overrides, equip slots, subgraphs,
#     mannequin skin swaps. Helpers: EDID (L3182), script data (L3393-L3411, kept opaque),
#     XALG (L3230), the base form component block (L5984-L6832, kept raw), FULL (L3184),
#     DESC (L3190-L3193), SPLO (L2255-L2256), BO64 (L2543-L2549), keywords
#     (wbDefinitionsCommon.pas L8935-L8951), PRPS (L5679-L5686 with the actor value at
#     L2271-L2274), APPR (L5698), the DAT2 flag bits (L7843-L7909), the size enum and
#     its field (L7911-L7923), the biped object enum (L2405-L2472, kept as numbers), FLLD
#     (L3818-L3823), attacks (L3592-L3655, common/AttackData.toml), the sound reference
#     (L2213-L2226, common/SoundReference.toml), SPED (L7743-L7789, kept opaque), the equip
#     type flags (L2841-L2857), morph groups (L7944-L7967), face morphs (L7969-L7986).
#   corpus: the 47 RACE records (Starfield.esm 31, SFBGS050 5, ShatteredSpace 5, SFBGS004
#     2, SFBGS047 2, SFBGS003 1, SFBGS00D 1; form versions 581, 582), 2026-10-14: every
#     record fits the order below. Each record has four MNAM and four FNAM markers (the
#     skeleton, junk, chargen and head part sections); DAT2 221, VTCK 8, RBPC 256 (64
#     FormIDs), NAME 64 per record, WED0/WED1 40, ATKD 48, SRAF 4, NNAM 12, SPED 252.
#     Every record decodes and re-encodes identically.
#
# Corpus against upstream: inside a subgraph entry upstream lists SAKD, SGNM, SAPT, STKD
# and marks the entry unordered; every official entry stores SADD SAKD* STKD* SGNM SAPT*
# SRAF, and that order is used here. A face morph phenotype may start with its FMSR
# entries (no FMRI), as upstream allows. FDDS, SNMV, NAM8, APPR and attacks without ATKE
# are not present in the official records.
#
# What stays opaque, and why: VMAD, the component blocks, DAT2's seven unnamed words and
# its unnamed float (offsets 92 to 127), the chargen NNAM (12 unnamed bytes), the junk
# FLLD (unnamed), SPED (one occurrence; nested speed tables not transcribed). The biped
# object slots and BO64 are kept as numbers (an enum and a flag set of 64 slot names
# upstream, not transcribed).
