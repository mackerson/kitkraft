# LVLP: Leveled Pack-In, a leveled list whose entries are pack-ins (PKIN) or other leveled
# pack-ins. Planet content nodes (PCCN) place it like a pack-in; the game picks entries by
# level, chance and per-entry conditions.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14119-L14156 - member order, the record flag,
#     LVLD/LVLM/LVLF/LVLG/LLCT, the entry group (LVLO plus its conditions), the model block
#     and FTYP. Helpers: script data (L3407-L3411, kept opaque), object bounds
#     (wbDefinitionsCommon.pas L9348-L9365, common/ObjectBounds.toml), ODTY (L3921-L3923),
#     OPDS (L3925-L3962), PTT2 (L3965-L3978), XALG (L3230), the base form component block
#     (L5984-L6832, kept raw), LLCT (L2250), LVLD (L2252), the conditions (L4750-L4840),
#     the leveled entry (wbDefinitionsCommon.pas L9062-L9084), the generic model
#     (L7008-L7029) with MOLM (L7000-L7006), FLLD (L3818-L3823), MODC (L3812) and the
#     model flags (L3801-L3804), FTYP (L5699).
#   corpus: the 52 LVLP records (Starfield.esm 51, SFBGS00D 1; form versions 581, 582),
#     2026-10-14: order EDID OBND ODTY [OPDS] [BFCB blocks] LVLD LVLM LVLF [CTDA...] [LVLG]
#     [LLCT] (LVLO [CTDA...])* [MODL] FLLD [FTYP]; LVLO 12 bytes, LVLD 4, LVLM 1, LVLF 2,
#     LLCT 1, CTDA 32, FTYP 4. Every record decodes and re-encodes identically. LVLM is 0
#     in every record; LVLF takes the values 0, 0x20 and 0x100.
#
# The second byte pair of LVLO and its last byte are unused (0 in all 356 entries); the
# chance-none byte is also 0 everywhere.
