# NPC_: Non-Player Character, the base form of every actor (humans, creatures, robots,
# crew and companions). A placed actor (ACHR) points at one. Templates let an NPC_ inherit
# whole sections from another NPC_ or a leveled actor list (TPLT plus the per-section TPTA
# slots and the ACBS template flags).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L14993-L15426 - the record: member order, record
#     flag, ACBS, the faction, template, override package list, perk, AI, reaction radius,
#     flee, appearance, sound, outfit, tint, face morph and race override members.
#     Helpers: EDID (L3182), script data (L3393-L3411, kept opaque), object bounds
#     (wbDefinitionsCommon.pas L9348-L9365), ODTY (L3921-L3923), OPDS (L3925-L3962), PTT2
#     (L3965-L3978), SNTP/SNBH (L3919-L3920), DEFL (L3963), XALG (L3230), the base form
#     component block (L5984-L6832, kept raw), the faction entry (wbDefinitionsCommon.pas
#     L8801-L8812), the template actor slot (wbDefinitionsCommon.pas L8548-L8552) and
#     template flags (wbDefinitionsCommon.pas L8429-L8452), SPLO (L2255-L2256), the
#     destructible block (L3829-L3889, common/Destructible.toml), attacks (L3592-L3655,
#     common/AttackData.toml), PRPS (L5679-L5686 with the actor value at L2271-L2274),
#     FTYP (L5699), NTRM (L5676), container items (L2304-L2327), AIDT (L7144-L7153) with
#     its enums (wbDefinitionsCommon.pas L7247-L7255, L7297-L7304, L7523-L7532,
#     L7950-L7974), keywords (wbDefinitionsCommon.pas L8935-L8951), APPR (L5698), the
#     object template (L6961-L6974, OBTS typed since M4.BX1), FULL (L3184), the AVM group type
#     (L7031-L7037), byte colours (wbDefinitionsCommon.pas L6954-L6968), ATTX (L5700), the
#     sound reference (L2197-L2226, common/SoundReference.toml), the pronoun enum
#     (L2956-L2961).
#   corpus: the 8,447 NPC_ records (Starfield.esm 7,131, ShatteredSpace 679, SFBGS050 386,
#     SFBGS00D 162, SFBGS003 88, SFBGS004 1; form versions 581, 582; every one compressed,
#     decoded with the esm DecodeLimits defaults), 2026-10-14: every record fits the order
#     below. Sizes: ACBS 16, SNAM 5, TPTA 60, PRKR 5, PRPS 12n, CNTO 8, AIDT 7, RDSA 80n,
#     FLEE 24, OBTE 4 (always 1), DATA 0, DNAM 8, NAM5 2 (always FF 00), MWGT 12, CS3S 40,
#     CS3F 1, EDCT 1, MNAM/INTV/NNAM 4, MRSV 20, STON 1 (0..8), PRON 1 (0..3).
#
# Corpus against upstream: EDID is absent from 1 record (optional); STOP occurs in 4,896
# records and is not required; SPLO occurs without the SPCT count upstream names (SPCT is
# not in the member list), so the effects are a plain list; no record carries DEST, attacks,
# OCOR/GWOR/FCPL/RCLR/RPLD/RPLI, COED, CS3K, SNBH or DEFL (those members stay `reference`).
#
# What stays opaque, and why: VMAD (property values are unions), the component blocks,
# ACBS's level (a union: a level, or a level multiplier when the PcLevelMult flag is set),
# NAM5 (unnamed upstream), the object template OBTS payload (its own include and property
# lists), and ONA2 after its flags (each override block is present
# only when its flag bit is set, which the format cannot express).
