#     order, EDID (L10823), the 32-bit value named 'Color/Index' (L10829) and the 32-bit flags
#     named 'Flags' with three named bits (L10834-L10838). Upstream also lists VMAD (L10824),
#     the base form component block (L10825), FULL (L10826) and conditions (L10839); no official
#     record has any of them, so they are left out (a plugin that has one keeps it raw).
#   corpus: the clfm_types scan in crates/esm/tests/clfm_types.rs checks this definition
#     against every official CLFM record (12 in the 14 ESMs): every subrecord is placed, every
#     placed subrecord decodes, and the re-encoding reproduces every record.
#
# CNAM is typed u32, not a union: the stored value is either four byte colours or a float
# remapping index, and which one it is is decided by FNAM, which comes after it. Upstream
# reads it as an integer for that reason; our format's sibling-field decider reads an
# earlier sibling only, so a union decided by FNAM cannot be expressed (README.md, "Unions").
