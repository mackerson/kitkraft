# GRUP: the 24-byte group header. Groups hold records and nested groups.
#
# Sources (ADR 0005):
#   uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format (section "Groups").
#   corpus: every group in Constellation, OldMars and SFBGS003/004/006/007/008/047.esm
#     (2026-10-14) walks cleanly with GroupSize including the 24 header bytes; all 180
#     top-level groups are type 0 with a record signature as label. Types 0..9 all occur,
#     and so does type 10, which has no name here and is preserved as Other(10).
#
# Label is four raw bytes whose meaning depends on GroupType (record signature, parent
# FormID, block number or grid coordinates); it is kept raw until each case is confirmed.
signature = "GRUP"
name = "GroupHeader"
kind = "header"
source = "uesp-skyrim: https://en.uesp.net/wiki/Skyrim_Mod:Mod_File_Format"
confidence = "corpus"
evidence = ["corpus: group walk of 8 small official ESMs, 2026-10-14"]
size = 24
field = [
  { name = "Signature", type = "sig", note = "always GRUP" },
  { name = "GroupSize", type = "u32" },
  { name = "Label", type = "opaque", size = 4 },
  { name = "GroupType", type = "enum", base = "i32", values = [
    ["Top", 0],
    ["WorldChildren", 1],
    ["InteriorCellBlock", 2],
    ["InteriorCellSubBlock", 3],
    ["ExteriorCellBlock", 4],
    ["ExteriorCellSubBlock", 5],
    ["CellChildren", 6],
    ["TopicChildren", 7],
    ["CellPersistentChildren", 8],
    ["CellTemporaryChildren", 9],
  ] },
  { name = "Timestamp", type = "u16" },
  { name = "VersionControl", type = "u16" },
  { name = "Unknown", type = "u32" },
]
