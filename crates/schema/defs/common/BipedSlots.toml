# BipedSlots: the 64 first-person biped-object-template slots an armor or an armor
# addon claims: which body parts it shows or hides on a first-person model (hair, head,
# body, hat, gloves, the vis-only layer, the misc slots, and the second-set "Ss" copy
# of each). It is the payload of the BO64 subrecord of ARMO and of ARMA.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L2474-L2541 - the slot list: 64 entries, a bit
#     each, whose index is the bit position (the hex values printed next to some of
#     them upstream are unreliable past bit 55, so the position is the bit, not the
#     printed value). BO64 is that u64 (wbFirstPersonFlagsU64, L2543-L2549). Several
#     entries are unnamed placeholders upstream and are left unnamed here, their bits
#     preserved. Bit 63 (an upstream "FaceLights") cannot be named: its value would not
#     fit the signed integer the bit values are read as, so it stays a raw bit (see
#     docs/gaps.md).
#   corpus: BO64 in the 1,168 ARMO records of the 14 official ESMs (2026-10-14 scan,
#     ITEMS/WORKSHOP family, ARMO.toml): every payload is 8 bytes, a full u64 of slots.
#     ARMA not yet scanned.
