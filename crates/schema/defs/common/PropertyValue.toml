# PropertyValue: one entry of a property list (LCTN PRPS, REFR XPPS): an actor value, its
# value, and an optional curve table.
#
# Source (ADR 0004): the object property helper of wbDefinitionsSF1.pas at the pin and the
# actor value helper it uses. xEdit adds the curve table from form version 152 (L5683), so
# CurveTable is gated `since = 152` and the entry is 8 bytes before that and 12 from it
# (`size_by_version`, lane B round 4). Every official record is form version 436 or later
# (docs/corpus.md), so the field is always present in the corpus; the 8-byte form is only
# what xEdit states.
#
# Folded in M4.BX1 (ITEMS merge): the items/workshop family defined the same 12-byte element
# as common/ObjectProperty (STAT, ACTI, CONT, FURN, MSTT, TERM PRPS), and PKIN (planet
# family) and NPC_, RACE and CLAS (actor family) spelled it out inline; all reference this
# type now. Their corpus checks are added below.
