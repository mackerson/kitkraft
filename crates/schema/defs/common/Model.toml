# Model: the generic model block (model file name, material swaps, light layer, colour
# remapping index, model flags), shared by every record type that has one.
#
# Source (ADR 0004): the generic model helper of wbDefinitionsSF1.pas at the pin
# (L7008-L7029), with the light-layer flags (L3818-L3823), the colour remapping index
# (L3812), the model flags (L3801-L3804) and the material swap list (L7000-L7006) it uses.
# xEdit lets these members appear in any order and marks the file name as not required; we
# list them in xEdit's order, which is also the order every official record uses.
#
# The material swap list carries a count prefix before its FormIDs; xEdit encodes it as a
# 2-byte prefix (negative array count). It is written here as an explicit count field.
#
# Folded in M4.BX1 (ACTOR merge): LVLP (planet family) and LVLN (actor family) spelled the
# same block out inline from the same xEdit lines; both now reference this one, and their
# corpus checks are added to MODL and FLLD below (no official LVLP or LVLN has MOLM, MODC
# or XFLG).
name = "Model"
kind = "group"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L7008-L7029"
confidence = "reference"

