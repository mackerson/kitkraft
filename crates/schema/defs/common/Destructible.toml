  { name = "SelfDamagePerSecond", type = "i32" },
  { name = "Explosion", type = "formid", targets = ["EXPL"] },
  { name = "Debris", type = "formid", targets = ["DEBR"] },
  { name = "DebrisCount", type = "i32" },
  { name = "ReplacementModelDelay", type = "f32" },
]

