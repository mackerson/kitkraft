# Destructible: the destruction data of a base object: a DEST header, optional resistances
# and secondary damage list, then one block per destruction stage (DSTD data, optional
# animation event, optional replacement model, DSTF end marker).
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L3829-L3890 - member order, the DEST header (health,
#     stage count, flags, two unused bytes), the DAMC resistance element (damage type,
#     value, curve table), DSDL, the DSTD stage data and its flags, DSTA, the stage model
#     (DMDL, FLLD, DMDS, unordered upstream) and DSTF. FLLD bits: L3818-L3823.
#   corpus: the destruction blocks of the ACTI, MISC, CONT, FURN and MSTT records of the 14
#     official ESMs (2026-10-14 scan, ITEMS/WORKSHOP family): DEST 8 bytes, DAMC 12 or 24,
#     DSDL 4 (one record, an SDLT), DSTD 24, DSTF 0; stages follow DEST in the order below;
#     some DEST have no stage (stage count 0). DAMC types resolve to DMGT and its curve
#     slots are null; DSTD explosions resolve to EXPL, debris to DEBR; DMDS is null in every
#     official record. Every record decodes and re-encodes identically.
#
# The stage count in the header is stored, not derived: an edit that adds or removes a
# stage must update it.
name = "Destructible"
kind = "group"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L3829-L3890"
evidence = [
  "corpus: destruction blocks of the ACTI, MISC, CONT, FURN and MSTT records of the 14 official ESMs, 2026-10-14 scan (ITEMS/WORKSHOP family): every record decodes and re-encodes identically",
]
confidence = "corpus"

[[member]]
sig = "DEST"
name = "Header"
type = "struct"
size = 8
field = [
  { name = "Health", type = "i32" },
  { name = "StageCount", type = "u8" },
  { name = "Flags", type = "flags", base = "u8", bits = [["VatsTargetable", 0x1], ["LargeActorDestroys", 0x2], ["ResistAllExcept", 0x4]] },
  { name = "Unused", type = "opaque", size = 2 },
]

