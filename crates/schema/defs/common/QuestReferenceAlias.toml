# QuestReferenceAlias: one reference alias of a quest, from ALST (its ID) to the ALED end
# marker. QUST uses it for a plain reference alias and, nested, for the reference template
# of a reference-collection alias, so it is written once here.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L7996-L8163 - member order, the FNAM flag bits,
#     the fill types (specific reference, unique actor or base form, location alias
#     reference, external alias, create reference to object, create matching reference,
#     find matching reference: in collection, closest to, from event, near alias), the
#     override package lists, linked aliases and FormID targets. Helpers: the condition
#     list (L4750-L4840, common/Condition.toml), the keyword list
#     (wbDefinitionsCommon.pas L8935-L8951, common/Keywords.toml), the container items
#     (L2294-L2327), the quest event codes (wbDefinitionsCommon.pas L8119-L8172) and the
#     event member codes (L2918-L2937).
#   corpus: the 25,882 reference aliases (ALST) in the QUST records of the 14 official
#     ESMs, 2026-10-14 scan: order as below; ALST, ALFG, ALFI, ALFA, ALRT, ALEQ, ALEA, ALCO,
#     ALCA, ALCL, ALCM, ALCS, ALCC, ALFE, ALFD, ALNA, ALNT, ALNR, ALDN, ALDI, ALFV, SPOR,
#     OCOR, GWOR, ECOR, ALSP, ALFC, ALPC, ALTM, VTCK 4 bytes; ALLR 1; CNTO 8; ALLA a
#     multiple of 8; ALED empty. Every QUST record decodes with nothing left over and
#     re-encodes identically.
#
# The fill types are alternatives selected by which subrecords are present (the first
# signature decides), so each is an optional member or group here; at most one is set.
name = "QuestReferenceAlias"
kind = "group"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L7996-L8163"
evidence = [
  "corpus: the 25,882 reference aliases in the QUST records of the 14 official ESMs, 2026-10-14 scan; every record decodes with an empty extra and re-encodes identically",
]
confidence = "corpus"

