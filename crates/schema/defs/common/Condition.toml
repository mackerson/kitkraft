# Condition: one CTDA condition with its optional CIS1/CIS2 string parameters. Records
# that carry conditions reference it as `group_ref = "Condition"` with `card = "repeated"`,
# after their CITC condition count.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L4750-L4840 - the condition list: the CTDA field
#     order and widths, the Run On enumeration, and the two optional string subrecords.
#     The unions inside CTDA and their deciders: the comparison value by the type byte's
#     "use global" bit (wbDefinitionsCommon.pas L5738-L5749), parameters 1 and 2 by the
#     function's parameter types and the type byte's "use aliases" / "use packdata" bits
#     (L828-L857, L859-L880), the reference by Run On = Reference (wbDefinitionsCommon.pas
#     L5762-L5779), parameter 3 by Run On (wbDefinitionsCommon.pas L5751-L5760). The
#     parameter layouts (L4672-L4748), the parameter type enumeration (L61-L129), the
#     condition function table (index and parameter types, L150-L761) and the reference
#     and base object signature lists (L37-L54).
#   corpus: the top-level CTDA payloads of the PCMT, PCBN and LVLP records in the 14
#     official ESMs (2026-10-14 scan): all 504 are 32 bytes, the sum of the field widths
#     below, and decode and re-encode identically through this group. CTDA inside the
#     planet content component blocks (PCCN, PKIN, GBFM) decode through it too since lane D
#     (2026-10-15, common/BfcbBlock.toml).
#   corpus (lane B round 3): the CTDA of the COBJ records of the 14 official ESMs (2,833,
#     all 32 bytes; no CIS1 or CIS2 in COBJ), and the conditions of the FLST and LVLI
#     records, through the M2.A3 typed check.
#   corpus (quest family, M4.BQ1): the 102,280 CTDA of the FACT, QUST, PACK, INFO, SCEN,
#     SMBN, SMQN and SMEN records (all decode), with CIS1 (QUST 14, PACK 2, SCEN 1) and
#     CIS2 (QUST 43, PACK 18, INFO 115, SCEN 34), which decode and re-encode identically.
#
# Integrated (M4.BX1): the planet family and lane B round 3 each wrote this block from
# the same xEdit range (L4750-L4840); the planet family's typed CTDA struct is kept and
# round 3's COBJ evidence added. Every record type that references it (COBJ, FLST, LVLI,
# LVLP, PCBN, PCMT, RSPJ, and the quest family's FACT, QUST, PACK, INFO, SCEN, SMBN, SMQN,
# SMEN) uses this one definition. CIS1 and CIS2 were raised to `corpus` at the QUEST
# merge on the quest family's evidence.
#
# Lane D (2026-10-15): the comparison value, the parameters and the reference are struct
# field unions (sibling deciders, defs/README.md "Unions"), so their FormIDs are typed and
# `refs` / `validate` see them. The comparison value's "use global" bit is matched by listing
# every type value with the bit set. Not typed (kept as read, `Other`): parameters 1 and 2 of
# the functions whose parameter is a reference, an actor or a package (80 functions for
# parameter 1), which the type byte's "use aliases" / "use packdata" bits turn into an
# alias index or a packdata ID (a choice by a bit of a second sibling, which the format does
# not express); and the parameters of a function index the table does not list. The function
# names and the enumerations of the enum-typed parameters (axis, sex, ...) are not
# transcribed: the function stays a number and those parameters a `u32`.
