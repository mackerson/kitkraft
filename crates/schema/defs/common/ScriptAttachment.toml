# ScriptAttachment: the VMAD payload, the Papyrus scripts attached to a form with their
# property values, followed on quests, dialogue responses, scenes and packages by script
# fragments. Records use it as an optional `sig = "VMAD"` member of
# `type = "ref:ScriptAttachment"`.
#
# Sources (ADR 0005 Amendment 2):
#   xedit: wbDefinitionsSF1.pas@9fb01688 L3393-L3411 - the plain script data: a signed
#     16-bit version, a signed 16-bit object format, then the script list with a 16-bit
#     count. L3413-L3583 - the record-specific variants (INFO, PACK, PERK, QUST, SCEN): the
#     same three leading fields, then a fragment block after the script list.
#   corpus: the VMAD of the QUST, PACK and INFO records of the 14 official ESMs (1,703, 85
#     and 2,040 payloads, 2026-10-14 scan, `docs/schema/quest-family.md`): each decodes and
#     re-encodes identically through this layout.
#
# What stays opaque, and why: each script entry holds properties whose value layout the
# property's type byte selects (object, string, integers, floats, booleans, structs and
# arrays of each), a union decided by a sibling field that the format cannot express; the
# fragment block that follows differs per record type and repeats script entries. So
# everything after the script count is kept as raw bytes (lossless). Raw FormIDs inside
# object properties stay raw and are not visited.
name = "ScriptAttachment"
kind = "type"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L3393-L3411"
