# BfcbBlock: one base form component, BFCB ... BFCE, shared by every record type that has
# components.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the base form component list of wbDefinitionsSF1.pas at the pin (L5984-L6832):
#     BFCB names the component type (a NUL-terminated string from a fixed list), the
#     component data follows, and an empty BFCE ends the component (L6829).
#   corpus: the BFCB..BFCE blocks of every official record of the types that use this
#     group (inventory scans of 2026-10-14 and the round 3 typed check): every BFCB is a
#     NUL-terminated ASCII name and every BFCE is 0 bytes.
#
# The component data is upstream's record union over the component layouts (L6055-L6828):
# each layout is a run of subrecords, and the run's first subrecord says which layout it is
# (lane D, 2026-10-15). These layouts are typed here as optional groups, in upstream's
# order, each led by signatures no other upstream layout starts with in the 14 official
# ESMs (`crates/doc/tests/components.rs` checks every official block):
#   - `AnimationGraph` (ANAM..ENAM strings and a marker, L6079-L6087);
#   - `ContactShadow` (FLCS, five floats, L6096-L6105);
#   - `DisplayCase` (DCSD slot templates and DCED exclusivity lists, L6122-L6139; lane D
#     round 4, 2026-10-16, for CONT);
#   - `PlanetContentProperties` (ZNAM..NAM9, CITC and conditions, L6179-L6198): the
#     placement properties of PKIN, PCCN, PCBN and LVLP, with FormIDs (globals, curves)
#     and conditions, so `refs` and `validate` see them;
#   - `QualityUpgrade` (QUPA, OMOD FormIDs, L6203-L6206) and `SoundTag` (STCP, an STAG
#     FormID, L6207-L6210 with L5675; both round 4, for WEAP);
#   - `ParticleSystem` (one PTCL payload, L6607-L6610; round 4) and `Reflection` (one REFL
#     payload, L6820-L6827): kept raw (opaque), since their layout is a helper in another
#     upstream unit that is not an authorized source (ADR 0004).
#   - `Keywords` (KSIZ and KWDA through the shared Keywords group, L6694-L6697; KK-282,
#     2026-11-15): BGSKeywordForm_Component, a STAT's and a REFR's keywords.
#   - `ObjectPaletteDefaults` (one OPDS, the shared ObjectPaletteDefaults type,
#     L6170-L6173; KK-283, 2026-11-15): BGSObjectPaletteDefaults_Component.
#   - `FullName` (one FULL lstring, L6611-L6614; KK-284, 2026-11-15):
#     TESFullName_Component, the names of GBFM, PNDT and STDT records.
#   - `LightLayer` (a lone FLLD, L6682-L6685) and `PlanetModel` (MODL, FLLD, XMPM kept
#     opaque, ring strings, L6619-L6635; KK-285, 2026-11-15): TESPlanetModel_Component and
#     TESModel_Component; LightLayer sits before PlanetModel (see its note).
#   - `PropertySheet` (one PRPS of the shared PropertyValue entries, L6199-L6202; KK-286,
#     2026-11-15): BGSPropertySheet_Component.
#   - `AttachParentArray` (one APPR, keyword FormIDs, L6088-L6091; KK-287, 2026-11-15):
#     BGSAttachParentArray_Component.
#   - `ObjectWindowFilter` (INTV count and FLTR paths, L6174-L6178; KK-288, 2026-11-15):
#     BGSObjectWindowFilter_Component.
#   - `Destructible` (the shared Destructible group, L6118-L6121; KK-289, 2026-11-15):
#     BGSDestructibleObject_Component.
#   - `LinkedVoiceType` (FCTF, L6166-L6169), `SpaceshipAiActor` (SAIA, L6211-L6214),
#     `SpaceshipEquipment` (ESSF, L6215-L6218), `SpaceshipHullCode` (HULL, L6219-L6222)
#     and `SpaceshipWeaponBindings` (SHWB, L6223-L6230) (2026-11-16): the ship-part
#     components of GBFM.
#   - `ExternalDataSource` (EXDC..EXBS, L6140-L6157), `FormLinkData` (ITMC, FLKW/FLFM
#     pairs, L6158-L6165), `Blueprint` (BUO4..BOID, L6561-L6602) and `HoudiniData` (one
#     PCCC payload, L6603-L6606, kept opaque as PTCL) (2026-11-16).
#   - `AdaptiveTrigger` (WFIR, WAIM, L6060-L6074), `AddToInventoryOnDestroy` (INAM,
#     L6075-L6078), `CityMapsUsage` (MOD2, L6092-L6095), `SpawnOnDestroy` (SODA,
#     L6231-L6234), `WorldSpaceOverlay` (SNAM, PNAM, BNAM, L6554-L6560),
#     `ImageSpaceModifiable` (MNAM, L6615-L6618), `ForcedLocRefType` (FTYP, L6686-L6689),
#     `Container` (COCT, CNTO; L6678-L6681, without COED) and `BodyPartInfo` (one GNAM,
#     unknown upstream, kept opaque, L6690-L6693)
#     (2026-11-16).
#   - `Crowd` (CDND, CDNS, populations of PRPS, CITC, conditions, STRV, FLTV,
#     L6106-L6117; 2026-11-16), after PropertySheet (see its note).
#   - `StoredTraversals` (one STRD: loose traversals, then placements with their own,
#     each entry the shared Traversal type, L6235-L6258 with L5789-L5813) and `Volumes`
#     (one VLMS: entries whose tail is as wide as the entry's type says, L6636-L6677 with
#     the decider L1632-L1646) (2026-11-17): the first layouts that need the format's
#     conditional fields (`present_if`), half floats (`f16`) and variable-width field
#     unions; a payload they cannot decode exactly (an unnamed volume type, a miscounted
#     array) stays raw in `extra`, and `components.rs` counts such fallbacks.
# After those groups, the subrecord union `NamedLayout` (ADR 0015; KK-294, 2026-11-15) reads
# the layouts upstream chooses by the component name, each one DATA or DAT2 subrecord
# (L1479-L1551 and L6699-L6819): star data, orbited data, unique overlay list, unique pattern
# placement, overlay designated placement; block height adjustment, surface tree pattern
# swap, block editor metadata. A variant reads a block only when its BFCB names it and its
# data up to BFCE is that variant's run; otherwise the block stays raw. Upstream's orbital
# data layout (L6721-L6733) is left out: no official block carries it, and a `reference`
# member in this shared block would lower every record type with components below
# `corpus` (the KK-289 lesson), so a BGSOrbitalDataComponent_Component block stays raw.
# Every other layout (activity tracker, vehicle config, the block cell height grid;
# 2026-11-17) stays raw subrecords in `ComponentData`,
# the `any_until` member after the typed ones: a block whose data starts with a signature
# none of the groups above starts with, and that no union variant reads, is kept as read.
# A component whose name and data disagree is read by the lead-signature groups by its
# data's first subrecord, as upstream's record union does; the corpus test above finds no
# such block among the official files.
