# BfcbBlock: one base form component, BFCB ... BFCE, shared by every record type that has
# components.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the base form component list of wbDefinitionsSF1.pas at the pin (L5984-L6832):
#     BFCB names the component type (a NUL-terminated string from a fixed list), the
#     component data follows, and an empty BFCE ends the component (L6829).
#   corpus: the BFCB..BFCE blocks of every official record of the types that use this
#     group (inventory scans of 2026-10-14 and the round 3 typed check): every BFCB is a
#     NUL-terminated ASCII name and every BFCE is 0 bytes.
#
# The component data is upstream's record union over the component layouts (L6055-L6828):
# each layout is a run of subrecords, and the run's first subrecord says which layout it is
# (lane D, 2026-10-15). Eight layouts are typed here as optional groups, in upstream's
# order, each led by signatures no other upstream layout starts with in the 14 official
# ESMs (`crates/doc/tests/components.rs` checks every official block):
#   - `AnimationGraph` (ANAM..ENAM strings and a marker, L6079-L6087);
#   - `ContactShadow` (FLCS, five floats, L6096-L6105);
#   - `DisplayCase` (DCSD slot templates and DCED exclusivity lists, L6122-L6139; lane D
#     round 4, 2026-10-16, for CONT);
#   - `PlanetContentProperties` (ZNAM..NAM9, CITC and conditions, L6179-L6198): the
#     placement properties of PKIN, PCCN, PCBN and LVLP, with FormIDs (globals, curves)
#     and conditions, so `refs` and `validate` see them;
#   - `QualityUpgrade` (QUPA, OMOD FormIDs, L6203-L6206) and `SoundTag` (STCP, an STAG
#     FormID, L6207-L6210 with L5675; both round 4, for WEAP);
#   - `ParticleSystem` (one PTCL payload, L6607-L6610; round 4) and `Reflection` (one REFL
#     payload, L6820-L6827): kept raw (opaque), since their layout is a helper in another
#     upstream unit that is not an authorized source (ADR 0004).
# Every other layout (about forty more upstream) stays raw subrecords in `ComponentData`, the
# `any_until` member after the typed ones: a block whose data starts with a signature none
# of the groups above starts with is kept as read. A component whose name and data
# disagree is read by its data's first subrecord, as upstream's record union does; the
# corpus test above finds no such block among the official files.
