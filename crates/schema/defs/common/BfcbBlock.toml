# BfcbBlock: one base form component, BFCB ... BFCE, shared by every record type that has
# components.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the base form component list of wbDefinitionsSF1.pas at the pin (L5984-L6832):
#     BFCB names the component type (a NUL-terminated string from a fixed list), the
#     component data follows, and an empty BFCE ends the component (L6829).
#   corpus: the BFCB..BFCE blocks of every official record of the types that use this
#     group (inventory scans of 2026-10-14 and the round 3 typed check): every BFCB is a
#     NUL-terminated ASCII name and every BFCE is 0 bytes.
#
# The component data is a union decided by the BFCB string (xEdit's record union), with
# different layouts for the same signature in different components (BNAM is a string in
# the animation graph component and a FormID in the world space overlay component, for
# example). Unions decided by another subrecord are not expressible yet (defs/README.md,
# "Not supported"), so the data stays raw subrecords (`ComponentData`) until M3.B9; see
# docs/gaps.md.
name = "BfcbBlock"
