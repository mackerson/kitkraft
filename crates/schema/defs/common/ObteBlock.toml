# ObteBlock: the object template (OBTE count, then one combination per entry: an optional
# editor-only marker, a name and the template item), closed by the STOP marker.
#
# Sources (ADR 0004, ADR 0005):
#   xedit: the object template helper of wbDefinitionsSF1.pas at the pin (L6961-L6974),
#     its template item (L6940-L6959) and property list (L6894-L6938); the closing STOP
#     marker is a member of the records that use the block (WEAP L18621).
#   corpus: the OBTE..STOP blocks of the WEAP records of the official ESMs (inventory scan
#     and round 3 typed check, 2026-10-14). STOP also occurs on its own, in records without
#     OBTE, which is why OBTE is optional here.
#
# The OBTE count and the two counts at the head of each template item are stored, not
# derived: an edit that changes a list must update its count. The keyword list inside a
# template item has a one-byte count prefix (xEdit's negative array count); it is written
# here as an explicit count field.
name = "ObteBlock"
kind = "group"
source = "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L6961-L6974"
evidence = [
  "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L6940-L6959",
  "xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L18621-L18621",
  "corpus: kitcraft-esm tests/corpus.rs corpus_full_roundtrip typed check (M2.A3), 2026-10-14: every OBTE..STOP block of the 452 WEAP records in the 14 official ESMs decodes and re-encodes identically",
]
confidence = "corpus"

