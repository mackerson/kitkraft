# Edit-dialog layout for TERM (M7.W3; crates/ui-egui/src/dialogs/mod.rs reads it).
# Tabs, groups and field order are KitKraft's own arrangement in the style of the
# Creation Kit's edit dialogs. They are UNOBSERVED: no CK sitting has shown this
# dialog yet (M7.O3, sitting 2), so every name below is ours, not the CK's, and
# M7.W4 replaces them with what the sitting records in docs/ck-parity.md.
# Fields are subrecord signatures from the record schema (a test checks each one);
# a subrecord the layout does not place shows on an "Other" tab. Read-only until
# M7.E2 and the owner's ruling on ADR 0007 Amendment 4 (M7.O4).
type = "TERM"
parity = "Edit dialog: TERM"
observed = false

[[tab]]
name = "Object"
[[tab.group]]
name = "Identity"
fields = ["EDID", "FULL", "ATTX"]
[[tab.group]]
name = "Bounds and placement"
fields = ["OBND", "ODTY", "OPDS", "PTT2", "SNTP", "SNBH", "DEFL", "XALG"]
[[tab.group]]
name = "Terminal"
fields = ["DNAM", "NTRM", "NAM1"]

[[tab]]
name = "Furniture"
[[tab.group]]
name = "Activation"
fields = ["FNAM", "JNAM", "GNAM", "MNAM"]
[[tab.group]]
name = "Markers"
fields = ["FNPR", "XMRK", "SNAM", "FTMP"]
[[tab.group]]
name = "Workbench"
fields = ["WBDT"]

[[tab]]
name = "Art and Sound"
[[tab.group]]
name = "Model"
fields = ["MODL", "MOLM", "FLLD", "MODC", "XFLG"]
[[tab.group]]
name = "Color and water"
fields = ["PNAM", "WTFM"]
[[tab.group]]
name = "Sounds"
fields = ["ALSH", "ACSH", "RADR"]

[[tab]]
name = "Keywords"
[[tab.group]]
name = "Keywords"
fields = ["KSIZ", "KWDA", "FTYP"]
[[tab.group]]
name = "Properties"
fields = ["PRPS"]

[[tab]]
name = "Conditions"
[[tab.group]]
name = "Conditions"
fields = ["CITC", "CTDA", "CIS1", "CIS2"]

[[tab]]
name = "Scripts"
[[tab.group]]
name = "Scripts"
fields = ["VMAD"]
