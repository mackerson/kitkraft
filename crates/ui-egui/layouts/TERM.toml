# Edit-dialog layout for TERM (M7.W4, sprint 2026-11-09 D6; dialogs/mod.rs reads it).
# One page: one group per label that CK sitting 2 (ck-20261102-03) recorded and
# M7.K4 mapped (layouts/sitting2.toml `map`), in the record's order. The
# group's name is the observed label, its field the signature the label edits and
# its member the `set` field path. Labels M7.K4 could not map are listed by the dialog
# from sitting2.toml's `gaps`, read-only, with their reasons. The page's name is the
# dialog's observed title ("Terminal").
# The sitting did not record whether the dialog has tabs: one page is ours (observed = false).
type = "TERM"
parity = "Edit dialog: TERM"
observed = false

[[tab]]
name = "Terminal"
[[tab.group]]
name = "ID"
fields = ["EDID"]
members = ["EDID"]
[[tab.group]]
name = "Name"
fields = ["FULL"]
members = ["FULL"]
[[tab.group]]
name = "Model"
fields = ["MODL"]
members = ["MODL"]
[[tab.group]]
name = "Marker Model"
fields = ["XMRK"]
members = ["XMRK"]
[[tab.group]]
name = "Looping Sound (Select Audio Data)"
fields = ["ALSH"]
members = ["ALSH"]
[[tab.group]]
name = "Papyrus Scripts:"
fields = ["VMAD"]
members = ["VMAD"]
[[tab.group]]
name = "Keywords"
fields = ["KWDA"]
members = ["KWDA"]
[[tab.group]]
name = "Actor Values"
fields = ["PRPS"]
members = ["PRPS"]
[[tab.group]]
name = "Preview Transform"
fields = ["PTT2"]
members = ["PTT2.Preview"]
[[tab.group]]
name = "Forced Loc Ref Types:"
fields = ["FTYP"]
members = ["FTYP"]
[[tab.group]]
name = "Art Theme"
fields = ["NAM1"]
members = ["NAM1"]
[[tab.group]]
name = "Furniture Template"
fields = ["FTMP"]
members = ["FTMP"]
[[tab.group]]
name = "Ignored By Sandbox"
fields = ["FNAM"]
members = ["FNAM"]
[[tab.group]]
name = "Active Markers"
fields = ["MNAM"]
members = ["MNAM"]
