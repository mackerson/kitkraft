# Edit-dialog layout for REFR (M7.W4, sprint 2026-11-09 D7; dialogs/mod.rs reads it).
# From the Reference dialog CK sitting ck-20261101-03 observed (docs/ck-parity.md, row
# "Reference dialog (a placed reference)"): the tab names below are the CK's, in its
# order, and the "3D Data" tab holds what the sitting saw on it. The four fields the CK
# shows above its tabs (Reference Editor ID, Base Object, Layer, Location Override) are
# placed first on "3D Data", since a layout has no area above its tabs. A tab or field
# the sitting saw but no schema member holds is left out (Extra, Reflected by, Linked
# From, MultiBound, Keywords, NavMesh Import Option; Test Radius; the 22 flag boxes,
# which the sitting did not name one by one), and what the sitting did not record on a
# tab (every tab but 3D Data) is ours: one field named after its tab. Group names are
# labels; `members` is the `set` field path each edits. Rotation is stored in radians;
# the CK's dialog shows degrees, so the labels name the unit shown and the dialog keeps
# the rotation read-only (dialogs::layouts::READ_ONLY).
# observed = false: the tab names are observed, their contents mostly not.
type = "REFR"
parity = "Reference dialog (a placed reference)"
observed = false

[[tab]]
name = "3D Data"
[[tab.group]]
name = "Reference Editor ID"
fields = ["EDID"]
members = ["EDID"]
[[tab.group]]
name = "Base Object"
fields = ["NAME"]
members = ["NAME"]
[[tab.group]]
name = "Layer"
fields = ["XLYR"]
members = ["XLYR"]
[[tab.group]]
name = "Location Override"
fields = ["XEZN"]
members = ["XEZN"]
[[tab.group]]
name = "Position X"
fields = ["DATA"]
members = ["DATA.Position.X"]
[[tab.group]]
name = "Position Y"
fields = ["DATA"]
members = ["DATA.Position.Y"]
[[tab.group]]
name = "Position Z"
fields = ["DATA"]
members = ["DATA.Position.Z"]
[[tab.group]]
name = "Rotation X (radians)"
fields = ["DATA"]
members = ["DATA.Rotation.X"]
[[tab.group]]
name = "Rotation Y (radians)"
fields = ["DATA"]
members = ["DATA.Rotation.Y"]
[[tab.group]]
name = "Rotation Z (radians)"
fields = ["DATA"]
members = ["DATA.Rotation.Z"]
[[tab.group]]
name = "Scale"
fields = ["XSCL"]
members = ["XSCL"]

[[tab]]
name = "Linked Ref"
[[tab.group]]
name = "Linked Ref"
fields = ["XLKR"]
members = ["XLKR"]

[[tab]]
name = "Enable Parent"
[[tab.group]]
name = "Enable Parent"
fields = ["XESP"]
members = ["XESP"]

[[tab]]
name = "Emittance"
[[tab.group]]
name = "Emittance"
fields = ["XEMI"]
members = ["XEMI"]

[[tab]]
name = "Location Ref Type"
[[tab.group]]
name = "Location Ref Type"
fields = ["XLRT"]
members = ["XLRT"]

[[tab]]
name = "Attach Ref"
[[tab.group]]
name = "Attach Ref"
fields = ["XATR"]
members = ["XATR"]

[[tab]]
name = "Comments"
[[tab.group]]
name = "Comments"
fields = ["MNAM"]
members = ["MNAM"]

[[tab]]
name = "Scripts"
[[tab.group]]
name = "Scripts"
fields = ["VMAD"]
members = ["VMAD"]
