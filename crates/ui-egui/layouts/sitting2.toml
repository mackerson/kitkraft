# CK interface sitting 2 (M7.O3, ck-20261102-03), as the edit dialog reads it (M7.W4).
# One [[dialog]] per type of sitting 2, in the record's step order, copied from that
# entry of docs/ck-observations.md (a test holds each label list equal to the record's
# row). It records labels, not which field each label edits, and no tab names, so the
# dialogs' tabs and groups stay KitKraft's (layouts/<TYPE>.toml, or the default layout
# from the schema); M7.K4 maps each label to a schema member.
#
# M7.K4's mapping (sprint 2026-11-09) goes in each [[dialog]] as explicit pairs:
#   map = [{ label = "ID", member = "EDID" }, ...]
# where `member` is a `set` field path of the type (`SIG`, `SIG.Member` or
# `SIG.Member.Member`), and every other label is a gap with its reason:
#   gaps = [{ label = "Edit", reason = "a button or control, not a field" }, ...]
# A label is mapped only where the type's schema has the member and the label plainly
# names it; a flag label names the flags member that holds its bit. Buttons, list
# columns, captions, record header flags (`set` edits subrecords only) and labels the
# sitting did not tie to one field are gaps. Both lists follow the labels' order;
# dialogs::layouts::tests (the members check) pins the pairs and the counts.

