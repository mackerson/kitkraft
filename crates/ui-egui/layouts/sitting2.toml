# CK interface sitting 2 (M7.O3, ck-20261102-03), as the edit dialog reads it (M7.W4).
# One [[dialog]] per type of sitting 2, in the record's step order, copied from that
# entry of docs/ck-observations.md (a test holds each label list equal to the record's
# row). It records labels, not which field each label edits, and no tab names, so the
# dialogs' tabs and groups stay KitKraft's (layouts/<TYPE>.toml, or the default layout
# from the schema); M7.K4 maps each label to a schema member.
#
# M7.K4's mapping goes in each [[dialog]] as explicit pairs, one per label:
#   map = [{ label = "ID", member = "EDID" }, ...]
# where `member` is a `set` field path of the type (`SIG` or `SIG.Member`). A label
# without a pair is a gap (dialogs::layouts::tests, the members check, pins the list).

