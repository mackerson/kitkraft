# Edit-dialog layout for COBJ (M7.W4, sprint 2026-11-09 D6; dialogs/mod.rs reads it).
# One page: one group per label that CK sitting 2 (ck-20261102-03) recorded and
# M7.K4 mapped (layouts/sitting2.toml `map`), in the record's order. The
# group's name is the observed label, its field the signature the label edits and
# its member the `set` field path. Labels M7.K4 could not map are listed by the dialog
# from sitting2.toml's `gaps`, read-only, with their reasons. The page's name is the
# dialog's observed title ("Constructible Object").
# The sitting recorded no tab control, so the one page is as observed.
type = "COBJ"
parity = "Edit dialog: COBJ"
observed = true

[[tab]]
name = "Constructible Object"
[[tab.group]]
name = "ID"
fields = ["EDID"]
members = ["EDID"]
[[tab.group]]
name = "Created Object"
fields = ["CNAM"]
members = ["CNAM"]
[[tab.group]]
name = "Created Object Count"
fields = ["NNAM"]
members = ["NNAM"]
[[tab.group]]
name = "Required Item List"
fields = ["FVPA"]
members = ["FVPA"]
[[tab.group]]
name = "Workbench Keyword"
fields = ["BNAM"]
members = ["BNAM"]
[[tab.group]]
name = "Recipe Filters"
fields = ["FNAM"]
members = ["FNAM"]
[[tab.group]]
