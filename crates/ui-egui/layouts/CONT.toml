# Edit-dialog layout for CONT (M7.W4, sprint 2026-11-09 D6; dialogs/mod.rs reads it).
# One page: one group per label that CK sitting 2 (ck-20261102-03) recorded and
# M7.K4 mapped (layouts/sitting2.toml `map`), in the record's order. The
# group's name is the observed label, its field the signature the label edits and
# its member the `set` field path. Labels M7.K4 could not map are listed by the dialog
# from sitting2.toml's `gaps`, read-only, with their reasons. The page's name is the
# dialog's observed title ("Container").
# The sitting recorded no tab control (ledger amended by C, ask A-D1), so the one page is as observed.
type = "CONT"
parity = "Edit dialog: CONT"
observed = true

[[tab]]
name = "Container"
[[tab.group]]
name = "ID"
fields = ["EDID"]
members = ["EDID"]
[[tab.group]]
name = "Name"
fields = ["FULL"]
members = ["FULL"]
[[tab.group]]
name = "Model"
fields = ["MODL"]
members = ["MODL"]
[[tab.group]]
name = "Object"
