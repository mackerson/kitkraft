# Edit-dialog layout for AMMO (M7.W4, sprint 2026-11-09 D6; dialogs/mod.rs reads it).
# One page: one group per label that CK sitting 2 (ck-20261102-03) recorded and
# M7.K4 mapped (layouts/sitting2.toml `map`), in the record's order. The
# group's name is the observed label, its field the signature the label edits and
# its member the `set` field path. Labels M7.K4 could not map are listed by the dialog
# from sitting2.toml's `gaps`, read-only, with their reasons. The page's name is the
# dialog's observed title ("Ammo").
# The sitting recorded no tab control, so the one page is as observed.
type = "AMMO"
parity = "Edit dialog: AMMO"
observed = true

[[tab]]
name = "Ammo"
[[tab.group]]
name = "ID"
fields = ["EDID"]
members = ["EDID"]
[[tab.group]]
name = "Name"
fields = ["FULL"]
members = ["FULL"]
[[tab.group]]
name = "Short name"
fields = ["ONAM"]
members = ["ONAM"]
[[tab.group]]
name = "Value"
fields = ["DATA"]
members = ["DATA.Value"]
[[tab.group]]
name = "Model"
fields = ["MODL"]
members = ["MODL"]
[[tab.group]]
name = "Pickup Sound"
fields = ["PUSH"]
members = ["PUSH"]
[[tab.group]]
name = "Putdown Sound"
fields = ["PDSH"]
members = ["PDSH"]
[[tab.group]]
name = "Projectile"
fields = ["DNAM"]
members = ["DNAM.Projectile"]
[[tab.group]]
name = "Damage"
fields = ["DNAM"]
members = ["DNAM.Damage"]
[[tab.group]]
name = "Description"
fields = ["DESC"]
members = ["DESC"]
[[tab.group]]
name = "Keywords"
fields = ["KWDA"]
members = ["KWDA"]
[[tab.group]]
name = "Preview Transform"
fields = ["PTT2"]
members = ["PTT2.Preview"]
[[tab.group]]
name = "Shell Casing"
fields = ["NAM1"]
members = ["NAM1"]
[[tab.group]]
name = "Health"
fields = ["DNAM"]
members = ["DNAM.Health"]
[[tab.group]]
name = "Weight"
fields = ["DATA"]
members = ["DATA.Weight"]
[[tab.group]]
name = "Flags (Playable, Has Count Based 3D)"
fields = ["DNAM"]
members = ["DNAM.Flags"]
