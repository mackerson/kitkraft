# FTH-EXP-01 prototype, arm A (authored-POI workshop): an authored exterior site with a
# LocTypeOutpost location, an outpost-beacon-style activator, its centre marker and its map
# marker, on a fixed vanilla planet surface (the Crucible's world on Charybdis III).
# kit build prototypes/foothold/exp01-authored-site/site.toml out/prototypes/foothold/exp01/KitKraftFootholdSite.esm
# Every value is copied from a vanilla outpost record (README.md, "Evidence"). Since lane D
# round 5 the links are authored too: the location names its map marker and lists its
# references, the cell names the location, the beacon and the map marker link the centre
# marker, and the map marker carries its marker data (README.md, "Not authored", for
# what remains).
version = 3

[load_order]
plugins = ["Starfield.esm"]

[[clone]]
# OutpostBeaconActivator ("Outpost Beacon"): model, snap template and behaviour, animation
# graph, the 19 keywords (MustPersist, WorkshopKeyword, the OutpostCategory* build menu
# categories, WorkshopNoStackingOn), PRPS OutpostBuildAreaRadius 150 (the build radius) and
# OutpostMainPackinItem 1, FTYP OutpostBeacon_RefType, and VMAD outpostbeaconscript with
# OutpostSurveyBoost. The clone keeps all of it and renames it.
name = "beacon"
form = "Starfield.esm:2C60E9"
edid = "KitKraftFootholdBeacon"
fields = { FULL = "KitKraft Foothold Beacon" }
brief = "FTH-EXP-01"

[[clone]]
# OutpostOverlayTemplateLocation (Starfield.esm:2A39CC), the only LCTN of Starfield.esm
# with LocTypeOutpost: KWDA [LocTypeOutpost 0234F1], DATA LevelFlags 16
# (UseParentsLockedLevel) with owner none and levels 0, RNAM 0, ANAM 1.0, TNAM 60, kept by
# the clone. Its FULL ("Outpost") is ours here. The clone gains what the template lacks:
# PNAM, the planet surface location that the Crucible's own location
# (SettleCrucibleLocation 299F69) names as its parent; MNAM, the map marker reference (as
# CityNewAtlantisLodgeLocation 27C8ED names its map marker); and LCPR, the three
# persistent references, each with the world and the grid of the cell its position is in
# (1, -2), and FFFFFFFF after it, as SettleCrucibleLocation's own entries are written.
name = "site_location"
form = "Starfield.esm:2A39CC"
edid = "KitKraftFootholdSiteLocation"
brief = "FTH-EXP-01"

[clone.fields]
FULL = "KitKraft Foothold Site"
PNAM = "Starfield.esm:01B38B"
MNAM = "new:map_marker"
LCPR = [
  { Ref = "new:beacon_ref", WorldOrCell = "Starfield.esm:29B000", GridY = -2, GridX = 1, Bytes12 = "hex:FFFFFFFF" },
  { Ref = "new:centre", WorldOrCell = "Starfield.esm:29B000", GridY = -2, GridX = 1, Bytes12 = "hex:FFFFFFFF" },
  { Ref = "new:map_marker", WorldOrCell = "Starfield.esm:29B000", GridY = -2, GridX = 1, Bytes12 = "hex:FFFFFFFF" },
]

[[set]]
# The site's cell, SettleCrucibleWorld (1, -2): it has no XLCN (it inherits
# SettleCrucibleLocation from the world); it gains one naming the site's location.
form = "Starfield.esm:127392"
fields = { XLCN = "new:site_location" }
brief = "FTH-EXP-01"

[[place]]
# The beacon. Vanilla's own beacon reference (Starfield.esm:29A8C8, in the pack-in
# OutpostBeacon_Packin's storage cell) is persistent at the pack-in origin and links its
# centre marker with the keyword WorkshopLinkCenter (038C0B), XLKT after it.
# SettleCrucibleWorld, cell (1, -2) (Starfield.esm:127392): 5 references (a fern and four
# rocks at its north edge), next to the landing cell (1, -1) whose ship landing marker
# Starfield.esm:12A0DD stands at (157.96, -57.40, 4.92); z from the rocks at y -101..-103
# (z 7.2 to 9.7): unobserved terrain height, see README.md.
name = "beacon_ref"
base = "new:beacon"
world = "Starfield.esm:29B000"
position = [155.0, -110.0, 8.0]
persistent = true
edid = "KitKraftFootholdBeaconRef"
brief = "FTH-EXP-01"
fields = { "XLKR.Keyword" = "Starfield.esm:038C0B", "XLKR.Ref" = "new:centre", XLKT = "" }

[[place]]
# The beacon's centre marker: vanilla 29A8C7, an XMarkerHeading (Starfield.esm:000034) at
# (0, -1.5, 0) from the beacon, rotated 4.712389 about z, persistent, with XLRT [28ADA0]
# (an LCRT whose EditorID marks it obsolete; copied as vanilla has it).
name = "centre"
base = "Starfield.esm:000034"
world = "Starfield.esm:29B000"
position = [155.0, -111.5, 8.0]
rotation = [0.0, 0.0, 4.712389]
persistent = true
edid = "KitKraftFootholdBeaconCenter"
brief = "FTH-EXP-01"
fields = { XLRT = ["Starfield.esm:28ADA0"] }

[[place]]
# The map marker: vanilla OutpostMapMarker001 (Starfield.esm:295918), a MapMarker_LongRange
# (Starfield.esm:254244) at (0, -0.0679, 0) from the beacon, persistent, with its marker
# data: XMRK, FNAM 51 (Visible, CanTravelTo, VisibleOnStarMap, Discovered), FULL (vanilla
# "Outpost"; ours names the site), TNAM 12, VNAM 2 (Structure), UNAM empty (string ID 0 in
# vanilla), VISI 0, XRDS 150, and a link with no keyword to the centre marker, XLKT after it.
name = "map_marker"
base = "Starfield.esm:254244"
world = "Starfield.esm:29B000"
position = [155.0, -110.0679, 8.0]
persistent = true
edid = "KitKraftFootholdMapMarker"
brief = "FTH-EXP-01"

[place.fields]
XMRK = ""
FNAM = 51
FULL = "KitKraft Foothold Site"
TNAM = 12
VNAM = 2
UNAM = ""
VISI = 0
XRDS = 150.0
"XLKR.Keyword" = "00000000"
"XLKR.Ref" = "new:centre"
XLKT = ""
