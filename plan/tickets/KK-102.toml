# Generated by plan/tickets/generate.py inventory; edit freely, a rerun never rewrites it.
id = "KK-102"
title = "Inventory definitions for LVLB, AMBS, IPDS, IMGS and MUST"
timeout_min = 45
owns = [
  "crates/schema/defs/LVLB.toml",
  "crates/schema/defs/AMBS.toml",
  "crates/schema/defs/IPDS.toml",
  "crates/schema/defs/IMGS.toml",
  "crates/schema/defs/MUST.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "docs/record-parity.md",
]
brief = """
89 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
M4.BX2 did fourteen (`crates/schema/defs/LAYR.toml` is one). Do 5 more, from the largest
left that no other ticket covers (record counts and signatures from `docs/record-parity.md`;
names are xEdit's record names in our UpperCamelCase):

- `LVLB`: 373 records, 12 signatures seen; name `LeveledBaseForm` (xEdit's "Leveled Base
  Form"); xEdit definition at `L13952-L14010`; the xEdit definition has base form
  components.
- `AMBS`: 369 records, 5 signatures seen; name `AmbienceSetForm` (xEdit's "Ambience Set");
  xEdit definition at `L9473-L9516`; the xEdit definition has base form components.
- `IPDS`: 356 records, 3 signatures seen; name `ImpactDataSet` (xEdit's "Impact Data Set");
  xEdit definition at `L13186-L13194`; the xEdit definition has base form components.
- `IMGS`: 303 records, 4 signatures seen; name `ImageSpaceForm` (xEdit's "Image Space");
  xEdit definition at `L12712-L12717`.
- `MUST`: 279 records, 10 signatures seen; name `MusicTrack` (xEdit's "Music Track"); xEdit
  definition at `L14725-L14744`; the xEdit definition has base form components.

`LVLB`, `AMBS`, `IPDS`, `MUST`: the parity table counts the subrecords inside component
blocks (`BFCB` .. `BFCE`) as unknown even with a definition (`docs/record-parity.md`,
"Columns"), so their rows must show the definition's name and may keep as unknown only the
signatures the inventory run lists as `inside BFCB..BFCE`; every other row must show 0
unknown.

Start from `crates/schema/defs/LAYR.toml` (an inventory definition: header comment, `source
= "corpus: ..."`, every member the corpus shows, in corpus order) and
`crates/schema/defs/README.md` ("Provenance", "Inventory definitions"). Then:

1. Add the 5 signatures to `TYPES` in the existing test file
   `crates/esm/tests/inventory_types.rs`, in its order (and its doc comment's list and the
   array length, if the file still keeps them). Run `cargo test -p kitkraft-esm --release
   --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture`
   before writing a definition: it prints, per type, every signature, how often it occurs,
   its sizes and the subrecord orders. Those printed facts are your only source for the
   members.
2. Write the files `crates/schema/defs/<SIG>.toml` with the names above. `EDID` is the
   shared EditorID zstring (copy LAYR's EDID member and its evidence, if the type has one).
   Every other payload is `type = "opaque"`, named after its signature, with a `note` giving
   the observed sizes. If a type shows base form component blocks (`BFCB` .. `BFCE`), use
   `group_ref = "BfcbBlock"` as LAYR does. None of these types is in the corpus lstring
   table (`crates/engine/src/edit/lstrings.rs`), so no member is an lstring. Cite the
   inventory run in `source` with the date and the record count, and the record's xEdit
   definition once in the record's `evidence` with the line range above (`xedit:
   wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L<a>-L<b>`, as LAYR.toml
   does). The pinned file is read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas`; per the
   README's "Inventory definitions" you may also cite the line where it lists a member, and
   follow its order where two members never occur together. Never type a member from it
   (that is a later ticket), and never copy its code or comments (clean room, AGENTS.md).
3. Register the files: `crates/schema/src/lib.rs` (`BUILTIN_DEFINITIONS`, alphabetical) and
   whatever `cargo test -p kitkraft-schema` then reports as missing in `tests/defs.rs` (it
   prints the exact lines). Regenerate code with `cargo xtask codegen` and the golden seed
   as the schema tests describe (`KITKRAFT_UPDATE_GOLDEN=1`,
   `crates/schema/tests/codegen.rs`); never edit `crates/esm/src/generated/records.rs` by
   hand.
4. Regenerate `docs/record-parity.md` with `cargo xtask parity` (it reads the Data folder).
   Each of the 5 rows must show its definition's name and 0 unknown (component blocks aside,
   above).

Done: the inventory run prints `defined: true` for each of the 5 with no unplaced, failed or
re-encode lines, and `cargo xtask ci` passes. Do not change any other definition, and do not
change the output of any command for any other record type. Other schema tickets may run the
same night on other types: touch only the lines of the shared lists (`TYPES`,
`BUILTIN_DEFINITIONS`, the record list in `tests/defs.rs`) your types need, and regenerate
the generated files rather than editing them.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== LVLB: 373 records .*defined: true' /tmp/o && grep -Eq '^== AMBS: 369 records .*defined: true' /tmp/o && grep -Eq '^== IPDS: 356 records .*defined: true' /tmp/o && grep -Eq '^== IMGS: 303 records .*defined: true' /tmp/o && grep -Eq '^== MUST: 279 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = '''grep -Eq '^\| `LVLB` +\| LeveledBaseForm +\| +373 \|' docs/record-parity.md && grep -Eq '^\| `AMBS` +\| AmbienceSetForm +\| +369 \|' docs/record-parity.md && grep -Eq '^\| `IPDS` +\| ImpactDataSet +\| +356 \|' docs/record-parity.md && grep -Eq '^\| `IMGS` +\| ImageSpaceForm +\| +303 .*\| +0 \|$' docs/record-parity.md && grep -Eq '^\| `MUST` +\| MusicTrack +\| +279 \|' docs/record-parity.md'''
