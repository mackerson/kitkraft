# Written 2026-11-18 in the shape of KK-371 (inventory to typed, from the pinned xEdit file),
# with a value check on a named official record (planning lane plan/tickets-20261118).
id = "KK-418"
title = "Type AOPS (AimOpticalSightMarker) from the pinned xEdit file, corpus-checked, values pinned"
timeout_min = 60
budget_h = 1.5
priority = 1
owns = [
  "crates/schema/defs/AOPS.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/aops_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`AOPS` (AimOpticalSightMarker, an optical sight marker: a weapon sight's attach node, laser and timing; 21 official records, 2 signatures in
the corpus: `EDID`, `ANAM`) has an inventory definition:
`crates/schema/defs/AOPS.toml`. Only EDID, lstrings and shared blocks are typed; every other
payload is `opaque` or an opaque group. Its xEdit definition is at `L9567-L9602` of the pinned
file. Parity target: the first `AOPS` row of `docs/record-parity.md` (the per-type table,
columns records, compressed, signatures, typed, opaque, unknown) must show at least
2 typed and 0 opaque and 0 unknown.

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): EDID; the base form component block; `ANAM`, a struct: a one-byte boolean 'Activate Sight
on Sighted Mode'; a length-prefixed string, the sight attach node (a 32-bit byte count, the
pinned file's default prefix, that includes the terminating NUL); floats 'Delay Before
Sight Activation' and 'Delay Before Sight Deactivation'; a FormID of a `LIGH` (or null);
floats 'Focal Point Distance', 'Focal Point Distance During Aiming', 'Delay Between
Shots'; FormIDs of two `ARTO` (laser, laser dot; or null); a float 'Max Laser Pointer
Distance'; three one-byte booleans (sight controls firing direction; activate on
non-sighted mode; activate on scoped mode). Type them so:

- `EDID` stays as it is.
- `ANAM`: named `Data`, `type = "struct"`, `card = "optional"` (the pinned file does not
  require it; all 21 official records have it: put that count in its `evidence`), fields in
  order: `ActivateOnSightedMode`
  (`ref:Bool8`), `AttachNodeLength` (`u32`), `AttachNode` (`array`, `element = "u8"`,
  `count_from = "AttachNodeLength"`, `note`: the string's bytes as stored, NUL included),
  `DelayBeforeActivation`, `DelayBeforeDeactivation` (`f32`), `SightLight` (`formid`,
  `targets = ["LIGH"]`), `FocalPointDistance`, `FocalPointDistanceAiming`,
  `DelayBetweenShots` (`f32`), `LaserArt`, `LaserDotArt` (`formid`, `targets = ["ARTO"]`),
  `MaxLaserPointerDistance` (`f32`), `SightControlsFiringDirection`,
  `ActivateOnNonSightedMode`, `ActivateOnScopedMode` (`ref:Bool8`).
- The base form component block: in no official AOPS record; leave it out.

What makes this one harder than the template: The format has no 32-bit length-prefixed string: write it as a length field and a
`count_from` byte array, exactly as `crates/schema/defs/PROJ.toml` writes
`ParticleDefineLength`/`ParticleDefine`. Payloads are 44 to 59 bytes because of that
string; everything else is fixed.

Which members are required: follow "Members" in `crates/schema/defs/README.md` (owner ruling
2026-11-07): a member is `required` only where the pinned file requires it; a member every
official record carries but the pinned file leaves optional is `optional`, with the corpus
count in its `evidence`; the first member of a group stays `required` (the group is
recognised by it). Where the pinned file requires a member that some official record lacks,
the corpus wins: `optional`, with the count in a `note`. Which members exist, their order and
their sizes also follow the corpus: leave out members no official record has.

Change the record-level `source` to the xEdit citation (`xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L9567-L9602`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. Keep each member's corpus facts (which records have
it, its sizes) in its `source` or `evidence`. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops AOPS from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"AOPS"` from its inventory list in
`crates/schema/tests/defs.rs` (AOPS is in `BX2_INVENTORY`): those lists are for definitions that type
nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while AOPS is listed with a
typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). The record header flags xEdit lists are out of scope too. Do not edit the
corpus lstring table (`crates/engine/src/edit/lstrings.rs`); it must still match.

Read first: `crates/schema/defs/README.md` (the definition format: structs, flags, enums,
arrays, groups, `ref:` types, "Not supported"), then `crates/schema/defs/WWED.toml` (KK-290: its header comment, citations and evidence lines are the style to follow) and `crates/schema/defs/PROJ.toml` (the length-prefixed strings).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase; use the names this brief gives (the value check
below and later tickets rely on them). The corpus wins over xEdit: where a size or an order
differs, follow the corpus and say so in a `note`. If one member cannot be typed as
described, keep that one `opaque` with a `note` that says why; do not guess a layout. Write
a `corpus:` evidence line only after a test of yours has printed the fact it cites; until
then cite xEdit with `confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/aops_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `aops_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `aops AOPS: <n>
records, <m> identical` and, for each signature, `aops AOPS <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Value check (required: the checks above pass for a wrong layout of the right width; this one
does not). The record `Starfield.esm` FormID `000040E5` (as stored in that file), EditorID `LaserSight_Red_OSM` must decode to these values:

- `Data.ActivateOnSightedMode` is true (stored 1).
- `Data.AttachNodeLength` is 10 and `Data.AttachNode` is the nine bytes of `LaserNode` followed by one 0 byte (ten bytes, the NUL included).
- `Data.LaserArt` is `FormId(0x00039B5A)`, `Data.LaserDotArt` is `FormId(0)`.
- `Data.MaxLaserPointerDistance` has the bits `0x3F800000`; `Data.ActivateOnNonSightedMode` is true, `Data.ActivateOnScopedMode` false.

Do it mechanically: add `value_checked: bool` to `Stats`. In `check_record`, after
`Typed::decode`, add `if name == "Starfield.esm" && form_id == 0x000040E5 { let Typed::Aops(r) = &typed
else { panic!("000040E5: not a AOPS") }; ... t.value_checked = true; }`. Read every value from
`r`'s generated typed fields (run `cargo xtask codegen`, then look up `pub struct AopsRecord`
in `crates/esm/src/generated/records.rs`: member `FooBar` is field `foo_bar`, an optional or
required member is an `Option<Sub<T>>`, a repeated one a `Vec`, and `Sub<T>` dereferences
to its value), never from the raw subrecord bytes, and check each with `assert_eq!` (or
`assert!` for `starts_with`/`ends_with`). Compare an `f32` by its bits:
`assert_eq!(x.to_bits(), 0x3F800000)`. In `aops_types_full`, after `assert_clean(&t)`, add
`assert!(t.value_checked, "000040E5 not seen")` and then print exactly `aops value check: ok`.
Write these constants in the test exactly as given, in that spelling: `0x000040E5`, `0x00039B5A`, `0x3F800000`, `LaserNode` (the
acceptance looks for them in the file). Never change an expected value to make the check
pass: if a decoded value differs, your layout is wrong; fix the definition.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: AOPS has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (its schema summary row is updated
after the batch). Do not edit `plan/STATUS.md` (tickets no longer add a "Landed" line there:
the merge commit and `plan/tickets/README.md` record the ticket). Put the xEdit lines, what
is typed, what stays opaque, the corpus counts your test printed and the parity row in your
commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test aops_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "aops-full"
cmd = '''cargo test --release -p kitkraft-esm --test aops_types -- --ignored --exact aops_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^aops AOPS: 21 records, 21 identical' /tmp/o && grep -Eq '^aops AOPS EDID: 21 records' /tmp/o && grep -Eq '^aops AOPS ANAM: 21 records' /tmp/o && grep -q '^aops value check: ok' /tmp/o'''

[[accept]]
name = "aops-values-pinned"
cmd = '''grep -qiF '0x000040E5' crates/esm/tests/aops_types.rs && grep -qiF '0x00039B5A' crates/esm/tests/aops_types.rs && grep -qiF '0x3F800000' crates/esm/tests/aops_types.rs && grep -qiF 'LaserNode' crates/esm/tests/aops_types.rs'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`AOPS` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity AOPS:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "AimOpticalSightMarker" && $7 + 0 >= 2 && $8 + 0 == 0 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]AOPS[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
