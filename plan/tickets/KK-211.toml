cmd = "cargo test --release -p kitkraft-esm --test txst_types -- --ignored --exact txst_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^txst TXST: 23 records, 23 identical' /tmp/o"

[[accept]]
name = "schema-all"
