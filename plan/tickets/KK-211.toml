brief = """
`TXST` (TextureSet, 23 official records, 12 signatures in the corpus: 1 typed, 11 opaque, 0
unknown) has an inventory definition (every corpus signature a member, all but EDID, the
lstrings and the shared blocks `opaque`): `crates/schema/defs/TXST.toml`. Its xEdit
definition is at `L18430-L18464`; follow the helpers it names. Parity target: the `TXST` row
of `docs/record-parity.md` must show at least 7 typed (today 1) and at most 0 unknown (today
0): at least half of the 11 signatures a transcription can type, and no new unknown. Also
remove it from `BX2_INVENTORY` (and `BX2_TYPED_BOUNDS` if listed) in
`crates/schema/tests/defs.rs` (those lists are for definitions that type nothing but EDID,
lstrings and shared blocks); leave `xtask/src/parity.rs`'s `INVENTORY` list alone (out of
scope). It is in no family (`xtask/src/parity.rs`): if `docs/gaps.md` names it among the
inventories or lstring-only types, update that row.

Type it the way KK-006 typed `ARMA`: from the pinned xEdit file, checked against the corpus.
Read first: `crates/schema/defs/README.md` (the definition format), then
`crates/schema/defs/ACTI.toml` (a typed activator with the shared blocks) and `ARMA.toml`
(KK-006's, for how a definition cites xEdit and the corpus). The shared blocks are in
`crates/schema/defs/common/`: `Model`, `Destructible`, `ObjectBounds`, `ObteBlock`,
`Keywords`, `BfcbBlock`, `Transforms`, `Condition` and others. Use them by `group_ref` or
`ref:`; do not copy their members, and do not add or change a shared block (other tickets
use them).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e). Cite line ranges in `source`/`evidence` as
ACTI.toml does. Clean-room rule (AGENTS.md): read it for facts (member order, types, sizes,
names) and write the TOML in your own words; never copy its code or comments. Names are
ours, UpperCamelCase, CK wording where it exists. Type every member xEdit gives a layout.
The corpus wins over xEdit: a subrecord xEdit lacks, or a different size, is added from the
corpus with a `corpus:` evidence line; a member stays `opaque` only where xEdit has no
layout for it (an unknown or byte-array field) or the corpus disagrees and you cannot tell
the layout, with a `note` that says "kept raw" and why (as `STAT.toml`'s VMAD and NVNM notes
do). Keep the lstring members exactly as typed today (the corpus lstring table,
`crates/engine/src/edit/lstrings.rs`, must still match). Write a `corpus:` evidence line
only after a test of yours has printed the fact it cites; until then cite xEdit with
`confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/txst_types.rs`, modelled on
`crates/esm/tests/apparel_types.rs` (same lint allowances and checks: every subrecord placed
in a member, every placed subrecord decodes, re-encoding reproduces each record). One new
test, `txst_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators) `txst TXST: <n> records, <m> identical`
and, per signature, how many records have it. Regenerate code with `cargo xtask codegen` and
the golden seed as the schema tests describe (`KITKRAFT_UPDATE_GOLDEN=1`,
`crates/schema/tests/codegen.rs`); never hand-edit generated files. Fix whatever `cargo test
-p kitkraft-schema` reports in `crates/schema/tests/defs.rs`. Regenerate
`docs/record-parity.md` with `cargo xtask parity` (it reads the Data folder) and check the
parity target above. Do not move a type between families in `xtask` (out of scope), and do
not change any other definition or the output of any command for another record type. Other
schema tickets may run the same night on other types: touch only the lines of the shared
lists your type needs.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test txst_types -- --ignored --nocapture`. Then `cargo
xtask ci`. Commit after the definition first loads, and after the corpus test passes.
"""

[[accept]]
