# Written 2026-11-15 in the shape of KK-258 to KK-260 (typed-write tests, merged as b5dd24a5 and 92c307cc).
id = "KK-291"
title = "Typed-write tests for WWED; the gap matrix marks it typed-writable"
timeout_min = 60
budget_h = 1.5
after = ["KK-290"]
owns = [
  "crates/engine/src/handlers/authoring_tests.rs",
  "docs/schema/evidence.toml",
  "docs/schema/support-matrix.md",
  "docs/foothold/gap-matrix.md",
  "docs/record-parity.md",
]
brief = """
`kit coverage --matrix` (MX) reports a record type `typed-writable` only when
`docs/schema/evidence.toml` cites a test that writes the type with every typed member and
reads it back. KK-290 typed `WWED` (WwiseEventData, the Wwise event data a sound
reference's start form points at) from the pinned xEdit file and corpus-checked it
(`crates/esm/tests/wwed_types.rs` `wwed_types_full`), but no test writes it, so MX says
`not-run`. Add the two tests and the evidence entry, as KK-258, KK-259 and KK-260 did for
nine other types, then make the hand-written gap-matrix row agree.

Read `crates/schema/defs/WWED.toml` first: EDID, then `WSED` (`StartEvent`) and `WTED`
(`EndEvent`), two 16-byte Wwise GUIDs kept `opaque`, and `CNAM` (`Condition`), a FormID of
a `CNDF`. WWED has no base form component block (`BfcbBlock`).

Start from `crates/engine/src/handlers/authoring_tests.rs`. Its module docs explain the two
test shapes, and the existing tests are your template:

- `wwed_new_sets_every_typed_member_and_reads_back` calls `writes_and_reads_back(sig,
  layout, component)`: one record built with `new` on a synthetic load order, every typed
  member given a value, read back, re-encoded, `validate`d. WWED has no `BfcbBlock`, so pass
  the usual `"ContactShadow", "BGSContactShadowComponent_Component"`, which are then inert
  (see the comment above `kywd_new_sets_every_typed_member_and_reads_back`). The two
  whole-opaque GUID members are written and left unchecked by the helper already; do not
  type them and do not use `writes_and_reads_back_with` unless `validate` reports one of
  them through a fallback (it should not: neither is an lstring).
- `wwed_dangling_link_is_reported` calls `dangling(...)` with `CNAM` set to `MISSING` and
  checks that `validate`'s `formid.dangling` and `refs` report it (`&[("CNAM",
  json!(MISSING))]`, `&["CNAM"]`, as `flor_dangling_link_is_reported` does for three
  members).

If either test cannot pass (`new` refuses a member, or `validate` reports a finding on
what `new` wrote), do not edit the engine or the schema (not yours here) and do not relax
`check_written` or any other helper's checks: find out why, write the reason in a comment
above the test and in the Landed line, and stop; the run then fails on its acceptance and
the merge reads your reason. Never change or loosen an existing test. You may add a
parameter to a helper only if every existing caller keeps its behaviour.

Then:

- `docs/schema/evidence.toml`: one `[[entry]]` with `type = "WWED"`, `status =
  "typed-writable"`, `result = "pass"`, and `evidence` citing both tests as the `ENCH` entry
  does (`test: crates/engine/src/handlers/authoring_tests.rs::<fn>`). The gate test
  `every_evidence_pointer_resolves` (`crates/engine/src/handlers/matrix.rs`) fails if a
  cited test does not exist.
- `docs/schema/support-matrix.md`: add WWED to the typed-writable list (the
  `authoring_tests.rs` types) and a short section for this round, as KK-265's (ENCH, IRES,
  HAZD) is written. Add WWED (KK-291) to the module docs at the top of `authoring_tests.rs`.
- `docs/foothold/gap-matrix.md`: KK-290 made the row's Type cell a single backticked
  `WWED`. Set its Typed-writable cell to `yes` and add to its notes "Writes:" with the two
  test names and "MX typed-writable pass", as the `FLST` row does. Update the
  Typed-writable counts of the tally paragraph under the headline ("The 51 rows of the
  record-family table ...": one row from `untested` to `yes`) and nothing else in it.
  Then run `cargo xtask parity`, which regenerates the headline (the evidence file is one
  of its inputs) and `docs/record-parity.md`, and `cargo xtask parity --check`: it fails on
  any disagreement between a single-type row of the hand-written family table and MX
  (Parsed, Typed-writable, Game), so the table and the generated data must agree.
- Add this ticket's one "Landed" line at the end of `plan/STATUS.md` (always allowed, so
  not listed in `owns`), in the form of the KK-258 and KK-259 lines.

Run `cargo test -p kitkraft-engine --lib authoring_tests` while you work, then `cargo xtask
parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness
keeps uncommitted work if the time runs out).
"""

[[accept]]
name = "wwed-read-back"
cmd = "cargo test -p kitkraft-engine --lib -- --exact handlers::authoring_tests::wwed_new_sets_every_typed_member_and_reads_back 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "wwed-dangling"
cmd = "cargo test -p kitkraft-engine --lib -- --exact handlers::authoring_tests::wwed_dangling_link_is_reported 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "evidence"
cmd = "cargo test -p kitkraft-engine --lib -- --exact handlers::matrix::tests::every_evidence_pointer_resolves 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -A2 '^type = \"WWED\"' docs/schema/evidence.toml | tr '\\n' ' ' | grep -q 'type = \"WWED\" status = \"typed-writable\" result = \"pass\"' && grep -q 'authoring_tests.rs::wwed_new_sets_every_typed_member_and_reads_back' docs/schema/evidence.toml && grep -q 'authoring_tests.rs::wwed_dangling_link_is_reported' docs/schema/evidence.toml"

[[accept]]
name = "gap-matrix"
cmd = "grep -Eq '^\\| `WWED` \\| yes \\| (yes|partial) \\| yes \\|' docs/foothold/gap-matrix.md && cargo xtask parity --check"
