# Written 2026-11-15 in the shape of KK-290 (inventory to typed; merged 7/7 by the local agent).
id = "KK-335"
title = "Type TRNS (Transform) from the pinned xEdit file, corpus-checked"
timeout_min = 60
budget_h = 1.5
owns = [
  "crates/schema/defs/TRNS.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/trns_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`TRNS` (Transform, a stored position, rotation, scale and zoom range, used by inventory
previews and load screens; 733 official records, 4 signatures in the corpus) has an
inventory definition: `crates/schema/defs/TRNS.toml`. Only `EDID` is typed; `DATA` (733 of
733 records, 36 bytes), `BNAM` (733 records, 1 byte) and `ENAM` (733 records, 4 bytes) are
`opaque`. Its xEdit definition is at `L18381-L18428` of the pinned file. Parity target: the
first `TRNS` row of `docs/record-parity.md` (the per-type table, columns records,
compressed, signatures, typed, opaque, unknown) must show at least 3 typed and 0 unknown
(today 0 unknown).

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): twelve record-header flags (the official records use bits 16 and 17 only); EDID; the
base form component block; `DATA`, a struct of nine floats: a position (x, y, z), a rotation
(x, y, z), a scale, a minimum zoom and a maximum zoom; `BNAM`, an 8-bit enum named 'Basis'
with two values; `ENAM`, a 32-bit flags value named 'Color Mode Flags' with three named
bits. Type them so:

- `EDID` stays as it is.
- `DATA`: named `Data`, `type = "struct"`, 36 bytes: the position and rotation first, then
  `Scale`, `ZoomMin` and `ZoomMax`, every field an `f32`. For the first six floats use the
  shared `ref:PositionRotation` type as one field if the loader accepts a shared type as a
  struct field (`crates/schema/defs/README.md`, "Fields";
  `crates/schema/defs/common/PositionRotation.toml`); if it does not, write six `f32`
  fields `PositionX` to `RotationZ`. xEdit marks the last members as optional, but every
  official `DATA` is 36 bytes, so all nine are present: give the member `size = 36` if the
  format asks for a size.
- `BNAM`: named `Basis`, `type = "enum"`, `base = "u8"`, the two values xEdit lists at
  L18414-L18419 (0 and 1), in our own names. The official values are 0 (483 records) and 1
  (250).
- `ENAM`: named `ColorModeFlags`, `type = "flags"`, `base = "u32"`, the three bits xEdit
  names at L18420-L18427 in list order (0x1, 0x2, 0x4), in our own names. The official
  values are 0 (725 records) and 1 (8).
- The record-header flags of L18382-L18394: a top-level `flags = [...]` list in our own
  names, as `crates/schema/defs/AAPD.toml` writes its record flags; TRNS has two more bits
  than AAPD, 16 (0x10000) and 17 (0x20000), and both occur in the official records.
- The base form component block: no official TRNS record has one (your corpus test
  confirms it: every subrecord is placed), so leave it out and say so in the header
  comment; a plugin with one keeps it raw. Every member then stays at `corpus` confidence.
- Keep the member order of the pinned file, which is also the corpus order: EDID, DATA,
  BNAM, ENAM. All four are in every official record (`card = "required"`).

Change the record-level `source` to the xEdit citation (`xedit:
wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L18381-L18428`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops TRNS from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"TRNS"` from `BX2_INVENTORY` in
`crates/schema/tests/defs.rs` (TRNS is in `BX2_INVENTORY`, not `INVENTORY_CORPUS_ONLY`):
those lists are for definitions that type nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while TRNS is listed with
a typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). TRNS has no lstring; the corpus lstring table
(`crates/engine/src/edit/lstrings.rs`) must still match, so do not edit it.

Read first: `crates/schema/defs/README.md` (the definition format), then
`crates/schema/defs/WWED.toml` (KK-290, the last inventory a ticket typed: its header
comment, citations and evidence lines are the style to follow) and
`crates/schema/defs/MOVT.toml` (KK-243: structs of floats) with
`crates/schema/defs/SPCH.toml` (KK-239: an enum member).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase. The corpus wins over xEdit: where a size or an
order differs, follow the corpus and say so in a `note`. If one member cannot be typed as
described, keep that one `opaque` with a `note` that says why (the parity target leaves room
for exactly one); do not guess a layout. Write a `corpus:` evidence line only after a test
of yours has printed the fact it cites; until then cite xEdit with `confidence =
"reference"`.

Then check it against the corpus: `crates/esm/tests/trns_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `trns_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `trns TRNS: <n>
records, <m> identical` and, for each signature, `trns TRNS <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: TRNS has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (not yours here; its schema summary row
is updated at the merge). Do not edit `plan/STATUS.md` (tickets no longer add a
"Landed" line there: the merge commit and `plan/tickets/README.md` record the ticket). Put
the xEdit lines, what is typed, what stays opaque, the corpus counts your test printed and
the parity row in your commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test trns_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "trns-full"
cmd = '''cargo test --release -p kitkraft-esm --test trns_types -- --ignored --exact trns_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^trns TRNS: 733 records, 733 identical' /tmp/o && grep -Eq '^trns TRNS EDID: 733 records' /tmp/o && grep -Eq '^trns TRNS DATA: 733 records' /tmp/o && grep -Eq '^trns TRNS BNAM: 733 records' /tmp/o && grep -Eq '^trns TRNS ENAM: 733 records' /tmp/o'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`TRNS` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity TRNS:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "Transform" && $7 + 0 >= 3 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]TRNS[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
