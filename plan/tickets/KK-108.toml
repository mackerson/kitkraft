# Generated by plan/tickets/generate.py inventory; edit freely, a rerun never rewrites it.
id = "KK-108"
title = "Inventory definitions for SECH, STAG, LENS, EQUP, AAPD, AOPS, CLDF and AOPF"
timeout_min = 45
owns = [
  "crates/schema/defs/SECH.toml",
  "crates/schema/defs/STAG.toml",
  "crates/schema/defs/LENS.toml",
  "crates/schema/defs/EQUP.toml",
  "crates/schema/defs/AAPD.toml",
  "crates/schema/defs/AOPS.toml",
  "crates/schema/defs/CLDF.toml",
  "crates/schema/defs/AOPF.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "docs/record-parity.md",
]
brief = """
89 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
M4.BX2 did fourteen (`crates/schema/defs/LAYR.toml` is one). Do 8 more, from the largest
left that no other ticket covers (record counts and signatures from `docs/record-parity.md`;
names are xEdit's record names in our UpperCamelCase):

- `SECH`: 32 records, 15 signatures seen; name `SoundEchoMarker` (xEdit's "Sound Echo
  Marker"); xEdit definition at `L17467-L17523`; the xEdit definition has base form
  components.
- `STAG`: 30 records, 4 signatures seen; name `AnimationSoundTagSet` (xEdit's "Animation
  Sound Tag Set"); xEdit definition at `L17820-L17845`; the xEdit definition has base form
  components.
- `LENS`: 26 records, 9 signatures seen; name `LensFlare` (xEdit's "Lens Flare"); xEdit
  definition at `L13590-L13636`; the xEdit definition has base form components.
- `EQUP`: 25 records, 4 signatures seen; name `EquipType` (xEdit's "Equip Type"); xEdit
  definition at `L11767-L11778`; the xEdit definition has base form components.
- `AAPD`: 22 records, 7 signatures seen; name `AimAssistPoseDataForm` (xEdit's "Aim Assist
  Pose Data"); xEdit definition at `L9117-L9150`; the xEdit definition has base form
  components.
- `AOPS`: 21 records, 2 signatures seen; name `AimOpticalSightMarker` (xEdit's "Aim Optical
  Sight Marker"); xEdit definition at `L9567-L9602`; the xEdit definition has base form
  components.
- `CLDF`: 21 records, 2 signatures seen; name `Clouds` (xEdit's "Clouds"); xEdit definition
  at `L10783-L10803`; the xEdit definition has base form components.
- `AOPF`: 20 records, 5 signatures seen; name `AudioOcclusionPrimitive` (xEdit's "Audio
  Occlusion Primitive"); xEdit definition at `L9531-L9564`; the xEdit definition has base
  form components.

`SECH`, `STAG`, `LENS`, `EQUP`, `AAPD`, `AOPS`, `CLDF`, `AOPF`: the parity table counts the
subrecords inside component blocks (`BFCB` .. `BFCE`) as unknown even with a definition
(`docs/record-parity.md`, "Columns"), so their rows must show the definition's name and may
keep as unknown only the signatures the inventory run lists as `inside BFCB..BFCE`.

Start from `crates/schema/defs/LAYR.toml` (an inventory definition: header comment, `source
= "corpus: ..."`, every member the corpus shows, in corpus order) and
`crates/schema/defs/README.md` ("Provenance", "Inventory definitions"). Then:

1. Add the 8 signatures to `TYPES` in the existing test file
   `crates/esm/tests/inventory_types.rs`, in its order (and its doc comment's list and the
   array length, if the file still keeps them). Run `cargo test -p kitkraft-esm --release
   --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture`
   before writing a definition: it prints, per type, every signature, how often it occurs,
   its sizes and the subrecord orders. Those printed facts are your only source for the
   members.
2. Write the files `crates/schema/defs/<SIG>.toml` with the names above. `EDID` is the
   shared EditorID zstring (copy LAYR's EDID member and its evidence, if the type has one).
   Every other payload is `type = "opaque"`, named after its signature, with a `note` giving
   the observed sizes. If a type shows base form component blocks (`BFCB` .. `BFCE`), use
   `group_ref = "BfcbBlock"` as LAYR does. None of these types is in the corpus lstring
   table (`crates/engine/src/edit/lstrings.rs`), so no member is an lstring. Cite the
   inventory run in `source` with the date and the record count, and the record's xEdit
   definition once in the record's `evidence` with the line range above (`xedit:
   wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L<a>-L<b>`, as LAYR.toml
   does). The pinned file is read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas`; per the
   README's "Inventory definitions" you may also cite the line where it lists a member, and
   follow its order where two members never occur together. Never type a member from it
   (that is a later ticket), and never copy its code or comments (clean room, AGENTS.md).
3. Register the files: `crates/schema/src/lib.rs` (`BUILTIN_DEFINITIONS`, alphabetical) and
   whatever `cargo test -p kitkraft-schema` then reports as missing in `tests/defs.rs` (it
   prints the exact lines). Regenerate code with `cargo xtask codegen` and the golden seed
   as the schema tests describe (`KITKRAFT_UPDATE_GOLDEN=1`,
   `crates/schema/tests/codegen.rs`); never edit `crates/esm/src/generated/records.rs` by
   hand.
4. Regenerate `docs/record-parity.md` with `cargo xtask parity` (it reads the Data folder).
   Each of the 8 rows must show its definition's name and 0 unknown (component blocks aside,
   above).

Done: the inventory run prints `defined: true` for each of the 8 with no unplaced, failed or
re-encode lines, and `cargo xtask ci` passes. Do not change any other definition, and do not
change the output of any command for any other record type. Other schema tickets may run the
same night on other types: touch only the lines of the shared lists (`TYPES`,
`BUILTIN_DEFINITIONS`, the record list in `tests/defs.rs`) your types need, and regenerate
the generated files rather than editing them.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== SECH: 32 records .*defined: true' /tmp/o && grep -Eq '^== STAG: 30 records .*defined: true' /tmp/o && grep -Eq '^== LENS: 26 records .*defined: true' /tmp/o && grep -Eq '^== EQUP: 25 records .*defined: true' /tmp/o && grep -Eq '^== AAPD: 22 records .*defined: true' /tmp/o && grep -Eq '^== AOPS: 21 records .*defined: true' /tmp/o && grep -Eq '^== CLDF: 21 records .*defined: true' /tmp/o && grep -Eq '^== AOPF: 20 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = '''grep -Eq '^\| `SECH` +\| SoundEchoMarker +\| +32 \|' docs/record-parity.md && grep -Eq '^\| `STAG` +\| AnimationSoundTagSet +\| +30 \|' docs/record-parity.md && grep -Eq '^\| `LENS` +\| LensFlare +\| +26 \|' docs/record-parity.md && grep -Eq '^\| `EQUP` +\| EquipType +\| +25 \|' docs/record-parity.md && grep -Eq '^\| `AAPD` +\| AimAssistPoseDataForm +\| +22 \|' docs/record-parity.md && grep -Eq '^\| `AOPS` +\| AimOpticalSightMarker +\| +21 \|' docs/record-parity.md && grep -Eq '^\| `CLDF` +\| Clouds +\| +21 \|' docs/record-parity.md && grep -Eq '^\| `AOPF` +\| AudioOcclusionPrimitive +\| +20 \|' docs/record-parity.md'''
