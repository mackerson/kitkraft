id = "DRAFT"
title = "new writes every condition group of a QUST: align CTDA occurrence counts with the slots"
timeout_min = 45
budget_h = 1.5
after = ["KK-002"]
owns = [
  "crates/engine/src/edit/scaffold.rs",
  "crates/engine/src/handlers/newform.rs",
  "crates/engine/src/handlers/authoring_tests.rs",
  "docs/schema/evidence.toml",
  "docs/schema/support-matrix.md",
]
brief = """
KK-002 (not merged; on its branch `origin/kk/KK-002-wip`, read it with `git show
origin/kk/KK-002-wip:crates/engine/src/handlers/authoring_tests.rs` and `git log
--oneline main..origin/kk/KK-002-wip`) adds typed-write tests to
`crates/engine/src/handlers/authoring_tests.rs`: each test builds one record with `new`,
giving every typed member a value through the file's `Plan` builder (it walks the
definition, numbers each signature's occurrences in schema walk order, and collects the
planned member paths in `p.paths`), reads it back, and checks every planned member was
written (`check_written`). On the branch the QUST test is a live `#[test]` — the two
`#[ignore]`d tests there are the WRLD ones, which this ticket does not touch — and it
fails today as described below; this ticket makes it pass. The test must pass, and it
must not be left failing or ignored. Do not loosen `check_written` or any existing test
to get there; the run may touch the `Plan` builder only to fix what it plans (the
finding below), and the acceptance below decides.

The test: `qust_new_sets_every_typed_member_and_reads_back` calls `writes_and_reads_back(
"QUST", "PlanetContentProperties", "BGSPlanetContentManagerContentProperties_Component")`.
Its comment, in KK-002's own words: with a base form component layout without conditions
(`ContactShadow`) the BFCB block's condition slot is left unplanned "and every planned
CTDA lands one slot early"; `PlanetContentProperties` gives the block conditions so the
occurrence numbers line up, yet the test still fails with `QUST: members not written:
["Aliases.Collection.Template.MatchConditions.Data",
"Aliases.Collection.Template.MatchConditions.StringParameter1",
"Aliases.Collection.Template.MatchConditions.StringParameter2"]` (the panic at
`authoring_tests.rs:424` on the branch).

The machinery. `new` (`crates/engine/src/handlers/newform.rs`, `plan_new`) counts how many
occurrences of each signature the fields name (`crates/engine/src/edit/scaffold.rs`,
`wanted_slots`) and then places the k-th occurrence of a signature at its k-th slot in
schema member order (`slot_of`, over the flattened slots of `member_order`: groups
flattened, every component layout of the BFCB block included in the slot list, `AnyUntil`
skipped). A QUST (`crates/schema/defs/QUST.toml`) has several condition groups
(`crates/schema/defs/common/Condition.toml`, members `Data`/`CTDA`, `StringParameter1`/`CIS1`,
`StringParameter2`/`CIS2`): the one inside the BFCB block's `PlanetContentProperties`
layout (`crates/schema/defs/common/BfcbBlock.toml`), the quest's own (`DialogueConditions`,
`StoryManagerConditions`), each stage log entry's and reward's, each objective target's,
each location alias's match conditions, a planet content request's, and a collection
alias template's.

Finding to confirm (this is the best read of the code so far, not a settled fact): the two
sides count differently. The engine's `member_order` flattens every group, so a QUST with
the `PlanetContentProperties` layout has nine `CTDA` slots: the block's layout condition
first, then the eight record-level groups in schema order, the last being
`Aliases.Collection.Template.MatchConditions`. But the test's `Plan` walker skips a
group when its path is inside a component layout and its name is not the chosen layout
(`in_component_layout` and `g.name != layout` in the `members` method).
`kitkraft_schema::in_component_layout` (`crates/schema/src/model.rs`) is true of any path
of the form `BfcbBlock.<layout>.<deeper>`, so the `Conditions` group nested inside the
chosen layout is inside a component layout, its name is not the chosen layout's, and the
Plan skips it: it numbers only eight CTDAs, the block's condition unplanned. With eight wanted CTDAs, `slot_of` (n > 1) maps
the k-th wanted CTDA to the k-th slot, so every planned CTDA lands one slot early and the
ninth slot, the collection template's match condition, receives no subrecord: exactly the
three missing members above. Confirm this in the code before touching code (the branch
merges before the run starts, and its `Plan` is the starting point), and decide which
side you fix. The fix may live in the engine (`scaffold.rs` /
`newform.rs`) or in the test's `Plan` (it is owned); whichever you choose, the k-th CTDA
of the fields must land in the k-th condition group in schema order, the record must
write the block's condition when the layout has one, and a QUST with a layout without
conditions (`ContactShadow`) must place every planned CTDA in its own group with nothing
unplaced. Never loosen `check_written` or any existing test.

Then record the evidence, the way the other passing types have it on main: add the
passing QUST's `typed-writable` entry to `docs/schema/evidence.toml` — an `[[entry]]`
with `type = "QUST"`, `status = "typed-writable"`, `result = "pass"` and
`evidence = ["test: crates/engine/src/handlers/authoring_tests.rs::qust_new_sets_every_typed_member_and_reads_back"]`,
copying the shape of the entries already there (LCTN, COBJ and the rest) — and add or
update QUST's row in `docs/schema/support-matrix.md` (its per-type sections and "The
proofs" list describe each type's proof; read the file and follow its shape). With the
entry in, QUST's row in the generated `coverage --matrix` reads `typed-writable: pass`.

Add one new engine unit test with the exact name `a_repeated_signature_counts_every_slot_of_a_repeating_group`
in `crates/engine/src/edit/scaffold.rs` (add `#[cfg(test)] mod tests` at the end of the
file; it has no test module yet), pinning the slot rule
on a small case: `member_order` plus `slot_of` on a real record type with several
repeated groups holding the same signature (a QUST's `CTDA` is the shape) must put the
k-th occurrence at the k-th slot in schema order for every k the definition has a slot
for, and report `None` only past the last slot when it does not repeat. Do not change any
other existing test; the existing `new`, `set` and authoring tests must pass unchanged
(the acceptance below checks their count only grows or holds).

Done means: `qust_new_sets_every_typed_member_and_reads_back` passes (not ignored, not
left failing); the new slot-rule test passes; every existing `new`, `set` and authoring
test still passes unchanged; the evidence entry and matrix row are in; and the slot rule
reads in `scaffold.rs` as the rule the fix implements. Do not touch any file outside
`owns`; do not merge or rebase the KK-002 branch (it merges before this run starts, and
its tests are the starting point); do not read `plan/STATUS.md` or
`plan/execution-plan.md`.
"""

[[accept]]
name = "qust-passes"
cmd = "cargo test -p kitkraft-engine --lib -- --exact handlers::authoring_tests::qust_new_sets_every_typed_member_and_reads_back 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "slot-rule-pinned"
cmd = "cargo test -p kitkraft-engine --lib -- --exact edit::scaffold::tests::a_repeated_signature_counts_every_slot_of_a_repeating_group 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "existing-tests-hold"
cmd = "cargo test -p kitkraft-engine --lib -- newform authoring scaffold 2>&1 | tee /tmp/o; grep -Eq '^test result: ok. [1-9][0-9]* passed' /tmp/o"

[[accept]]
name = "evidence"
cmd = "grep -q 'QUST' docs/schema/evidence.toml && grep -q 'QUST' docs/schema/support-matrix.md"
