id = "DRAFT"
title = "validate warns when an LMSW names an override material found nowhere"
timeout_min = 60
budget_h = 1.5
after = ["KK-018", "KK-019"]
owns = [
  "crates/engine/src/validate/",
  "crates/engine/tests/validate_corpus.rs",
  "docs/validate.md",
]
brief = """
The owner's clothing colourways are layered material swaps (`LMSW`): each `LMSW`'s one `REFL`
subrecord maps a key material path to an override material path. KK-007 decodes `REFL`
losslessly (`crates/doc/src/refl.rs`: `decode`, `lmsw_entries`, `SwapEntry`); `lmsw_entries`
returns each entry's `key` and `override` material path. KK-018 added the `validate` rule
`asset.missing-model` for model files. This ticket adds the material analogue: a `validate`
warning when an `LMSW` of the validated plugin names an override material path that is found
nowhere. Existence only — the content of a `.mat` is not checked (those rules stay with the
owner).

Add the rule `asset.missing-material` (warning, grade D: that the game looks a material up this
way is not observed). It fires for an `LMSW` record of the validated plugin (new forms and the
overrides it holds; never a master's records). Decode its `REFL` with `kitkraft_doc::refl::
decode` and read the entries with `lmsw_entries`; for each entry's **override** path (not the
key), look for the file in the same places `asset.missing-model` looks — loose next to the
plugin (its folder, as a package lays out `Data`), loose in the game Data folder, the plugin's
own archives (`<stem> - *.ba2`), and the load order's archives — sharing KK-018's lookup. An
`LMSW` whose `REFL` does not decode gets a limitation line naming the record (the decoder
returns `Err`, and `REFL` is opaque in the schema, so no layout finding fires); the corpus
decodes all 17,410, so this does not happen in practice.

The stored `.mat` path seems relative to a top folder, `materials`: a stored value such as
`Clothes\\Outfit_Sanctum_Priest\\Outfit_Sanctum_Priest_Hat.mat` sits under `Data\\Materials\\`
loose, and mods ship their `.mat` there or in a `- Main.ba2`. Confirm that mapping on the
official archives and write what you found in `docs/validate.md`. Note the research
(`docs/research/materials-lmsw-2026-10-23.md`) found no `.mat` file in any official archive —
vanilla materials live in `Starfield - Materials.ba2`'s `.cdb` — so expect the official count to
be large (one finding per override entry that is not found). Names compare ASCII
case-insensitively, with `/` and the backslash the same. An empty override path is not a
finding. The finding names the `LMSW` record, the entry, and the override path, and lists where
it looked.

Generalise the shared lookup in `crates/engine/src/validate/models.rs` (its loose walk and
`target_path` hard-code the top folder `meshes`) so it takes the top folder, and reuse it here
with `materials`; do not change `asset.missing-model`'s behaviour. Put the new rule in a new file
`crates/engine/src/validate/materials.rs` (`pub mod materials;` in `mod.rs`), modelled on
`models.rs`, and register it the way the other rules are registered in
`crates/engine/src/validate/mod.rs` (the rule list and its severity) plus its row in
`docs/validate.md`'s rule table (grade D).

Read `crates/doc/src/refl.rs` first (the decoder, `lmsw_entries`, and its `mod tests`, which
build a synthetic `REFL` payload), then `crates/engine/src/validate/models.rs` and
`models_tests.rs` (the lookup and the test helpers in `crates/engine/src/validate/tests.rs`).
Add tests in a new `crates/engine/src/validate/materials_tests.rs` (`#[cfg(test)] mod
materials_tests;` in `mod.rs`), on a synthetic plugin holding one `LMSW` whose `REFL` you build
as `refl.rs`'s tests do, with these exact names:
- `a_missing_material_is_a_warning`: the `LMSW`'s single override names a `.mat` found nowhere:
  exactly one `asset.missing-material` warning naming it.
- `a_loose_material_next_to_the_plugin_is_found`: the `.mat` under `materials/` beside the
  plugin: no finding.
- `an_archived_material_is_found`: the `.mat` inside a `<stem> - Main.ba2` written in the test
  with `kitkraft_ba2`'s pack API: no finding.

Then the official files: `validate_corpus_official_files` in `crates/engine/tests/validate_corpus.rs`
validates all 14 and already pins each file's `asset.missing-model` count; add a per-file pinned
count for `asset.missing-material` there the same way (zero is a count too: the assertion names
`asset.missing-material`, and the acceptance greps the test file for it). Do
not remove or loosen any existing assertion. That test reads 2.5 GB through `KITKRAFT_DATA_DIR`,
is `#[ignore]`d and runs in release; run it only after your unit tests pass: `cargo test
--release -p kitkraft-engine --test validate_corpus -- --ignored --exact
validate_corpus_official_files --nocapture`. Keep its `#[ignore]`.

Never panic (AGENTS.md): an archive that does not open is a limitation line, not a crash. Run
`cargo test -p kitkraft-engine --lib validate`, then `cargo xtask ci`. Commit when the three
unit tests pass.
"""

[[accept]]
name = "missing-warns"
cmd = "cargo test -p kitkraft-engine --lib -- --exact validate::materials_tests::a_missing_material_is_a_warning 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "loose-found"
cmd = "cargo test -p kitkraft-engine --lib -- --exact validate::materials_tests::a_loose_material_next_to_the_plugin_is_found 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "archived-found"
cmd = "cargo test -p kitkraft-engine --lib -- --exact validate::materials_tests::an_archived_material_is_found 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "official-files"
cmd = "cargo test --release -p kitkraft-engine --test validate_corpus -- --ignored --exact validate_corpus_official_files --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && ! grep -q 'skipped: KITKRAFT_DATA_DIR' /tmp/o && grep -q 'asset.missing-material' crates/engine/tests/validate_corpus.rs"

[[accept]]
name = "documented"
cmd = "grep -q 'asset.missing-material' docs/validate.md"
