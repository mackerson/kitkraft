id = "KK-224"
title = "Inventory definitions for MRPH, CNDF, VTYP, MTPT and ASPC"
timeout_min = 45
budget_h = 1.5
after = ["KK-023"]
owns = [
  "crates/schema/defs/MRPH.toml",
  "crates/schema/defs/CNDF.toml",
  "crates/schema/defs/VTYP.toml",
  "crates/schema/defs/MTPT.toml",
  "crates/schema/defs/ASPC.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "crates/esm/src/bridge.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
About 90 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
KK-008 did one for `LMSW`, M4.BX2 did fourteen, and KK-022 did five more (`CURV`, `REGN`,
`AVMD`, `IPCT`, `DFOB`). Do five more: `MRPH` (1,145 records, name `MorphableObject`),
`CNDF` (1,055, `ConditionForm`), `VTYP` (915, `VoiceType`), `MTPT` (906, `MaterialPath`)
and `ASPC` (814, `AcousticSpace`). The five rows in `docs/record-parity.md` today show the
definition `-`.

Use the inventory tools (`crates/schema/defs/README.md`, "Inventory definitions",
"Workflow"; `crates/schema/defs/LAYR.toml` is an example of their output). They take every
count from one scan of the corpus, the one the inventory test prints. Then:

1. For each type, `cargo xtask inventory-def <SIG> --name <Name> --ticket KK-224` with the
   name above (for `MRPH`: `cargo xtask inventory-def MRPH --name MorphableObject --ticket
   KK-224`). It scans the 14 official ESMs and writes `crates/schema/defs/<SIG>.toml` in
   LAYR.toml's style: every member the corpus shows, in corpus order and cardinality, EDID,
   `BfcbBlock`, `Keywords` and the corpus table's lstrings typed, every other payload
   `opaque`, every `source` citing the scan's counts and sizes with today's date. Pass no
   `--evidence`: this ticket cites the corpus only, and reads no xEdit file.

2. Read each file and settle every `# TODO(review): ...` comment and every warning the
   command printed (the README's "Workflow" says what each one means: an inferred group to
   check and name, a repeat it could not group, two members seen in both orders), then
   delete the comment. Change structure only; keep the generated `source` counts, never type
   a count by hand.

3. `cargo xtask add-def MRPH CNDF VTYP MTPT ASPC` registers all 5 at once:
   `BUILTIN_DEFINITIONS` in `crates/schema/src/lib.rs`, `TYPES` in
   `crates/esm/tests/inventory_types.rs`, the inventory list in
   `crates/schema/tests/defs.rs` and, for a type with no EDID, `WITHOUT_EDID` in
   `crates/esm/src/bridge.rs`; then it regenerates `crates/esm/src/generated/records.rs`,
   the golden seed and `docs/record-parity.md` (and the gap matrix). Rerun it after any
   change to a definition; never edit the generated files by hand.

4. `KK_INVENTORY_ONLY=MRPH,CNDF,VTYP,MTPT,ASPC cargo test -p kitkraft-esm --release --test
   inventory_types -- --include-ignored --exact inventory_types_full --nocapture` runs the
   inventory test on these types alone: each must print `defined: true` with no unplaced,
   failed or re-encode lines. If one does not, fix its definition from the orders it prints
   and rerun step 3.

5. `cargo xtask inventory-check MRPH CNDF VTYP MTPT ASPC` must pass: it fails on any cited
   count, size, per-record maximum or top-level `card` the corpus scan does not show.

Scheduling: the schema tickets `KK-006`, `KK-008`, `KK-022` and `KK-023` all regenerate
`crates/esm/src/generated/` and the golden seed, so none of them may run on the same night
as this one. This one is scheduled after `KK-023` and must not share a night with any of
the four.

Done: the existing `inventory_types_full` test prints `defined: true` for each of the five
with no unplaced, failed or re-encode lines, and `cargo xtask ci` passes. Do not change any
other definition, and do not change the output of any command for any other record type.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== MRPH: 1145 records .*defined: true' /tmp/o && grep -Eq '^== CNDF: 1055 records .*defined: true' /tmp/o && grep -Eq '^== VTYP: 915 records .*defined: true' /tmp/o && grep -Eq '^== MTPT: 906 records .*defined: true' /tmp/o && grep -Eq '^== ASPC: 814 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = "grep -Eq '^\\| `MRPH` +\\| MorphableObject +\\| +1,145 +\\| +[0-9,]+ +\\| +4 +\\| +[0-9]+ +\\| +[0-9]+ +\\| +0 +\\|$' docs/record-parity.md && grep -Eq '^\\| `CNDF` +\\| ConditionForm +\\| +1,055 +\\| +[0-9,]+ +\\| +6 +\\| +[0-9]+ +\\| +[0-9]+ +\\| +0 +\\|$' docs/record-parity.md && grep -Eq '^\\| `VTYP` +\\| VoiceType +\\| +915 +\\| +[0-9,]+ +\\| +4 +\\| +[0-9]+ +\\| +[0-9]+ +\\| +0 +\\|$' docs/record-parity.md && grep -Eq '^\\| `MTPT` +\\| MaterialPath +\\| +906 +\\| +[0-9,]+ +\\| +2 +\\| +[0-9]+ +\\| +[0-9]+ +\\| +0 +\\|$' docs/record-parity.md && grep -Eq '^\\| `ASPC` +\\| AcousticSpace +\\| +814 +\\| +[0-9,]+ +\\| +16 +\\| +[0-9]+ +\\| +[0-9]+ +\\| +0 +\\|$' docs/record-parity.md"

[[accept]]
name = "inventory-counts"
cmd = "cargo xtask inventory-check MRPH CNDF VTYP MTPT ASPC"
