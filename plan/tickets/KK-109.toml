# Generated by plan/tickets/generate.py inventory; edit freely, a rerun never rewrites it.
id = "KK-109"
title = "Inventory definitions for LVSC, FSTS, IDLM, SCOL, BNDS, TODD, CLFM and AORU"
timeout_min = 45
budget_h = 2.5
base = "kk/KK-109-wip"
owns = [
  "crates/schema/defs/LVSC.toml",
  "crates/schema/defs/FSTS.toml",
  "crates/schema/defs/IDLM.toml",
  "crates/schema/defs/SCOL.toml",
  "crates/schema/defs/BNDS.toml",
  "crates/schema/defs/TODD.toml",
  "crates/schema/defs/CLFM.toml",
  "crates/schema/defs/AORU.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "crates/esm/src/bridge.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
89 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
M4.BX2 did fourteen (`crates/schema/defs/LAYR.toml` is one). Do 8 more, from the largest
left that no other ticket covers (record counts and signatures from `docs/record-parity.md`;
names are xEdit's record names in our UpperCamelCase):

- `LVSC`: 20 records, 6 signatures seen; name `LeveledSpaceCell` (xEdit's "Leveled Space
  Cell"); xEdit definition at `L14161-L14204`; the xEdit definition has base form
  components.
- `FSTS`: 19 records, 3 signatures seen; name `FootstepSet` (xEdit's "Footstep Set"); xEdit
  definition at `L12095-L12123`; the xEdit definition has base form components.
- `IDLM`: 18 records, 13 signatures seen; name `IdleMarker` (xEdit's "Idle Marker"); xEdit
  definition at `L12688-L12703`; the xEdit definition has base form components.
- `SCOL`: 15 records, 11 signatures seen; name `StaticCollection` (xEdit's "Static
  Collection"); xEdit definition at `L17403-L17431`; the xEdit definition has base form
  components.
- `BNDS`: 14 records, 5 signatures seen; name `BendableSplineForm` (xEdit's "Bendable
  Spline"); xEdit definition at `L10374-L10392`; the xEdit definition has base form
  components.
- `TODD`: 14 records, 6 signatures seen; name `TimeOfDayDataForm` (xEdit's "Time Of Day
  Data"); xEdit definition at `L18251-L18255`; the xEdit definition has base form
  components.
- `CLFM`: 12 records, 3 signatures seen; name `ColorForm` (xEdit's "Color"); xEdit
  definition at `L10806-L10840`; the xEdit definition has base form components.
- `AORU`: 11 records, 2 signatures seen; name `AttractionRuleForm` (xEdit's "Attraction
  Rule"); xEdit definition at `L9605-L9617`; the xEdit definition has base form components.

`LVSC`, `FSTS`, `IDLM`, `SCOL`, `BNDS`, `TODD`, `CLFM`, `AORU`: the parity table counts the
subrecords inside component blocks (`BFCB` .. `BFCE`) as unknown even with a definition
(`docs/record-parity.md`, "Columns"), so their rows must show the definition's name and may
keep as unknown only the signatures the inventory run lists as `inside BFCB..BFCE`.

Use the inventory tools (`crates/schema/defs/README.md`, "Inventory definitions",
"Workflow"; `crates/schema/defs/LAYR.toml` is an example of their output). They take every
count from one scan of the corpus, the one the inventory test prints. Then:

1. For each type, `cargo xtask inventory-def <SIG> --name <Name> --ticket KK-109 --evidence
   'xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L<a>-L<b>'`,
   with the name and the xEdit line range listed above (for `LVSC`: `cargo xtask
   inventory-def LVSC --name LeveledSpaceCell --ticket KK-109 --evidence
   'xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L14161-L14204'`).
   It scans the 14 official ESMs and writes `crates/schema/defs/<SIG>.toml` in LAYR.toml's
   style: every member the corpus shows, in corpus order and cardinality, EDID, `BfcbBlock`
   and `Keywords` typed, every other payload `opaque`, every `source` citing the scan's
   counts and sizes with today's date.

2. Read each file and settle every `# TODO(review): ...` comment and every warning the
   command printed (the README's "Workflow" says what each one means: an inferred group to
   check and name, a repeat it could not group, two members seen in both orders), then
   delete the comment. Change structure only; keep the generated `source` counts, never type
   a count by hand. The pinned xEdit file is read-only at
   `/opt/xedit-ref/wbDefinitionsSF1.pas`; per the README's "Inventory definitions" you may
   cite the line where it lists a member (in the member's `evidence`) and follow its order
   where a member's `note` says the corpus does not show the order. Never type a member from
   it (that is a later ticket), and never copy its code or comments (clean room, AGENTS.md).

3. `cargo xtask add-def LVSC FSTS IDLM SCOL BNDS TODD CLFM AORU` registers all 8 at once:
   `BUILTIN_DEFINITIONS` in `crates/schema/src/lib.rs`, `TYPES` in
   `crates/esm/tests/inventory_types.rs`, the inventory list in
   `crates/schema/tests/defs.rs` and, for a type with no EDID, `WITHOUT_EDID` in
   `crates/esm/src/bridge.rs`; then it regenerates `crates/esm/src/generated/records.rs`,
   the golden seed and `docs/record-parity.md` (and the gap matrix). Rerun it after any
   change to a definition; never edit the generated files by hand.

4. `KK_INVENTORY_ONLY=LVSC,FSTS,IDLM,SCOL,BNDS,TODD,CLFM,AORU cargo test -p kitkraft-esm
   --release --test inventory_types -- --include-ignored --exact inventory_types_full
   --nocapture` runs the inventory test on these types alone: each must print `defined:
   true` with no unplaced, failed or re-encode lines. If one does not, fix its definition
   from the orders it prints and rerun step 3.

5. `cargo xtask inventory-check LVSC FSTS IDLM SCOL BNDS TODD CLFM AORU` must pass: it fails
   on any cited count, size, per-record maximum or top-level `card` the corpus scan does not
   show.

Continuing from `kk/KK-109-wip` (the 2026-10-28 run worked from the older brief, by hand,
and ran out of time: AORU, CLFM, BNDS, FSTS, IDLM and LVSC written and registered, SCOL and
TODD not started; their counts were typed by hand and are unchecked). The branch predates
the inventory tools. First merge `main` into the branch: take either side of every
conflicted shared file, then run `cargo xtask add-def AORU CLFM BNDS FSTS IDLM LVSC`. Then
`cargo xtask inventory-check AORU CLFM BNDS FSTS IDLM LVSC` and, for every definition it
rejects, `cargo xtask inventory-def <SIG> ... --force` (step 1) to rewrite it from the scan;
write SCOL and TODD with step 1, and carry on from step 2 for all 8.

Done: the inventory run prints `defined: true` for each of the 8 with no unplaced, failed or
re-encode lines, and `cargo xtask ci` passes. Do not change any other definition, and do not
change the output of any command for any other record type. Other schema tickets may run the
same night on other types: touch only the lines of the shared lists (`TYPES`,
`BUILTIN_DEFINITIONS`, the record list in `tests/defs.rs`) your types need, and regenerate
the generated files rather than editing them.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== LVSC: 20 records .*defined: true' /tmp/o && grep -Eq '^== FSTS: 19 records .*defined: true' /tmp/o && grep -Eq '^== IDLM: 18 records .*defined: true' /tmp/o && grep -Eq '^== SCOL: 15 records .*defined: true' /tmp/o && grep -Eq '^== BNDS: 14 records .*defined: true' /tmp/o && grep -Eq '^== TODD: 14 records .*defined: true' /tmp/o && grep -Eq '^== CLFM: 12 records .*defined: true' /tmp/o && grep -Eq '^== AORU: 11 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = '''grep -Eq '^\| `LVSC` +\| LeveledSpaceCell +\| +20 \|' docs/record-parity.md && grep -Eq '^\| `FSTS` +\| FootstepSet +\| +19 \|' docs/record-parity.md && grep -Eq '^\| `IDLM` +\| IdleMarker +\| +18 \|' docs/record-parity.md && grep -Eq '^\| `SCOL` +\| StaticCollection +\| +15 \|' docs/record-parity.md && grep -Eq '^\| `BNDS` +\| BendableSplineForm +\| +14 \|' docs/record-parity.md && grep -Eq '^\| `TODD` +\| TimeOfDayDataForm +\| +14 \|' docs/record-parity.md && grep -Eq '^\| `CLFM` +\| ColorForm +\| +12 \|' docs/record-parity.md && grep -Eq '^\| `AORU` +\| AttractionRuleForm +\| +11 \|' docs/record-parity.md'''

[[accept]]
name = "inventory-counts"
cmd = "cargo xtask inventory-check LVSC FSTS IDLM SCOL BNDS TODD CLFM AORU"
