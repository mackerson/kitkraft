id = "KK-022"
title = "Inventory definitions for CURV, REGN, AVMD, IPCT and DFOB"
timeout_min = 45
base = "kk/KK-022-wip"
owns = [
  "crates/schema/defs/CURV.toml",
  "crates/schema/defs/REGN.toml",
  "crates/schema/defs/AVMD.toml",
  "crates/schema/defs/IPCT.toml",
  "crates/schema/defs/DFOB.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "crates/esm/src/bridge.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
About 90 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
KK-008 did one for `LMSW`, M4.BX2 did fourteen. Do five more: `CURV` (29 records, name
`CurveTable`), `REGN` (4, `Region`), `AVMD` (6,530, `AvmsData`), `IPCT` (1,459, `Impact`) and
`DFOB` (1,273, `DefaultObject`). `CURV` and `REGN` are the two the Foothold gap matrix names
as having no definition; the other three are the largest undefined types after `LMSW`.

Continuing from `kk/KK-022-wip` (the 2026-10-27 run; the merge review did not take it). The
five files, the `TYPES` entries and the registration are there and the inventory test
passes, but the review doubted the cited counts. A scan with `cargo xtask inventory-check`
(2026-10-28) finds them right, AVMD's 46,000 `LNAM` and `NNAM` included (parity counts only
typed occurrences), except that AVMD's and IPCT's `BfcbBlock` `source` does not cite the
scan's form, and IPCT names its `FLLD` member `Fldl`, not `Flld` (as DOOR, ARTO, RACE and
LIGH do). First merge `main` into the branch; take either side of `records.rs`, `seed.rs`,
`record-parity.md`, `lib.rs`, `inventory_types.rs` and `defs.rs`: step 3 rewrites them. Then
rewrite the five files with the tools, `--force` overwriting the branch's:

Use the inventory tools (`crates/schema/defs/README.md`, "Inventory definitions",
"Workflow"; `crates/schema/defs/LAYR.toml` is an example of their output). They take every
count from one scan of the corpus, the one the inventory test prints. Then:

1. For each type, `cargo xtask inventory-def <SIG> --name <Name> --ticket KK-022 --force`
   with the name above (for `CURV`: `cargo xtask inventory-def CURV --name CurveTable
   --ticket KK-022 --force`). It scans the 14 official ESMs and writes
   `crates/schema/defs/<SIG>.toml` in LAYR.toml's style: every member the corpus shows, in
   corpus order and cardinality, EDID, `BfcbBlock`, `Keywords` and the corpus table's
   lstrings typed, every other payload `opaque`, every `source` citing the scan's counts and
   sizes with today's date. Pass no `--evidence`: this ticket cites the corpus only, and
   reads no xEdit file.

2. Read each file and settle every `# TODO(review): ...` comment and every warning the
   command printed (the README's "Workflow" says what each one means: an inferred group to
   check and name, a repeat it could not group, two members seen in both orders), then
   delete the comment. Change structure only; keep the generated `source` counts, never type
   a count by hand.

3. `cargo xtask add-def CURV REGN AVMD IPCT DFOB` registers all 5 at once:
   `BUILTIN_DEFINITIONS` in `crates/schema/src/lib.rs`, `TYPES` in
   `crates/esm/tests/inventory_types.rs`, the inventory list in
   `crates/schema/tests/defs.rs` and, for a type with no EDID, `WITHOUT_EDID` in
   `crates/esm/src/bridge.rs`; then it regenerates `crates/esm/src/generated/records.rs`,
   the golden seed and `docs/record-parity.md` (and the gap matrix). Rerun it after any
   change to a definition; never edit the generated files by hand.

4. `KK_INVENTORY_ONLY=CURV,REGN,AVMD,IPCT,DFOB cargo test -p kitkraft-esm --release --test
   inventory_types -- --include-ignored --exact inventory_types_full --nocapture` runs the
   inventory test on these types alone: each must print `defined: true` with no unplaced,
   failed or re-encode lines. If one does not, fix its definition from the orders it prints
   and rerun step 3.

5. `cargo xtask inventory-check CURV REGN AVMD IPCT DFOB` must pass: it fails on any cited
   count, size, per-record maximum or top-level `card` the corpus scan does not show.

Each of the five rows of "Decoded through the definitions" in `docs/record-parity.md` must
show its definition's name and 0 failed. The "Record types" row may still count signatures
inside `BFCB` .. `BFCE` blocks as unknown: parity counts them so (KK-008's LMSW row shows
4); leave `common/BfcbBlock.toml` alone.

Done: the inventory run prints `defined: true` for each of the five with no unplaced, failed
or re-encode lines, and `cargo xtask ci` passes. Do not change any other definition, and do
not change the output of any command for any other record type.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== CURV: 29 records .*defined: true' /tmp/o && grep -Eq '^== REGN: 4 records .*defined: true' /tmp/o && grep -Eq '^== AVMD: 6530 records .*defined: true' /tmp/o && grep -Eq '^== IPCT: 1459 records .*defined: true' /tmp/o && grep -Eq '^== DFOB: 1273 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = "grep -Eq '^\\| `CURV` +\\| CurveTable +\\| +29 .*\\| +0 \\|$' docs/record-parity.md && grep -Eq '^\\| `REGN` +\\| Region +\\| +4 .*\\| +0 \\|$' docs/record-parity.md && grep -Eq '^\\| `AVMD` +\\| AvmsData +\\| +6,530 .*\\| +0 \\|$' docs/record-parity.md && grep -Eq '^\\| `IPCT` +\\| Impact +\\| +1,459 .*\\| +0 \\|$' docs/record-parity.md && grep -Eq '^\\| `DFOB` +\\| DefaultObject +\\| +1,273 .*\\| +0 \\|$' docs/record-parity.md"

[[accept]]
name = "inventory-counts"
cmd = "cargo xtask inventory-check CURV REGN AVMD IPCT DFOB"
