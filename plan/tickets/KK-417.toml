# Written 2026-11-18 in the shape of KK-371 (inventory to typed, from the pinned xEdit file),
# with a value check on a named official record (planning lane plan/tickets-20261118).
id = "KK-417"
title = "Type KSSM (SoundKeywordMapping) from the pinned xEdit file, corpus-checked, values pinned"
timeout_min = 60
budget_h = 1.5
priority = 1
owns = [
  "crates/schema/defs/KSSM.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/kssm_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`KSSM` (SoundKeywordMapping, a sound keyword mapping: a sound, the keywords that select it and reverb-class variants; 591 official records, 5 signatures in
the corpus: `EDID`, `WED0`, `KNAM`, `RSMC`, `RSMH`) has an inventory definition:
`crates/schema/defs/KSSM.toml`. Only EDID, lstrings and shared blocks are typed; every other
payload is `opaque` or an opaque group. Its xEdit definition is at `L13275-L13294` of the pinned
file. Parity target: the first `KSSM` row of `docs/record-parity.md` (the per-type table,
columns records, compressed, signatures, typed, opaque, unknown) must show at least
5 typed and 0 opaque and 0 unknown.

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): EDID; `WED0`, a sound reference; a repeated `KNAM`, a FormID of a `KYWD`; `RSMC`, a u32
count, required; then that many entries, each `RSMC` again (a u32 enum: Default, Class A to
Class E, 0 to 5) and `RSMH`, a sound reference. Type them so:

- `EDID` stays as it is.
- `WED0`: named `Sound`, `type = "ref:SoundReference"`. The pinned file does not require it;
  make it `optional` with the corpus count (591 of 591) in its `evidence`.
- `KNAM`: named `Keywords`, `formid`, `targets = ["KYWD"]`, `card = "repeated"`.
- The first `RSMC`: named `ReverbCount`, `u32`, required, `note`: the number of reverb
  entries that follow; stored, not derived.
- The `RSMC`/`RSMH` pairs (today an opaque group): a group named `ReverbSounds`, `card =
  "repeated"`, with `RSMC` named `ReverbClass` (`enum`, `base = "u32"`, values `Default` 0,
  `ClassA` 1, `ClassB` 2, `ClassC` 3, `ClassD` 4, `ClassE` 5; required, it starts the group)
  and `RSMH` named `Sound` (`ref:SoundReference`, required).

What makes this one harder than the template: One signature, `RSMC`, is used twice with two meanings: first the count, then each
entry's class. The format allows the same signature at two positions with different names
(the README, "Members"); the ordered matcher gives the first `RSMC` to `ReverbCount` and
the later ones to the group. Check that your value check sees the count and the classes
apart. The count lives in a separate subrecord, so nothing can derive it: it is stored.

Which members are required: follow "Members" in `crates/schema/defs/README.md` (owner ruling
2026-11-07): a member is `required` only where the pinned file requires it; a member every
official record carries but the pinned file leaves optional is `optional`, with the corpus
count in its `evidence`; the first member of a group stays `required` (the group is
recognised by it). Where the pinned file requires a member that some official record lacks,
the corpus wins: `optional`, with the count in a `note`. Which members exist, their order and
their sizes also follow the corpus: leave out members no official record has.

Change the record-level `source` to the xEdit citation (`xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L13275-L13294`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. Keep each member's corpus facts (which records have
it, its sizes) in its `source` or `evidence`. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops KSSM from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"KSSM"` from its inventory list in
`crates/schema/tests/defs.rs` (KSSM is in `BX2_INVENTORY`): those lists are for definitions that type
nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while KSSM is listed with a
typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). The record header flags xEdit lists are out of scope too. Do not edit the
corpus lstring table (`crates/engine/src/edit/lstrings.rs`); it must still match.

Read first: `crates/schema/defs/README.md` (the definition format: structs, flags, enums,
arrays, groups, `ref:` types, "Not supported"), then `crates/schema/defs/WWED.toml` (KK-290: its header comment, citations and evidence lines are the style to follow), `crates/schema/defs/common/SoundReference.toml` and `crates/schema/defs/COLL.toml` (KK-242, an enum and flags).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase; use the names this brief gives (the value check
below and later tickets rely on them). The corpus wins over xEdit: where a size or an order
differs, follow the corpus and say so in a `note`. If one member cannot be typed as
described, keep that one `opaque` with a `note` that says why; do not guess a layout. Write
a `corpus:` evidence line only after a test of yours has printed the fact it cites; until
then cite xEdit with `confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/kssm_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `kssm_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `kssm KSSM: <n>
records, <m> identical` and, for each signature, `kssm KSSM <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Value check (required: the checks above pass for a wrong layout of the right width; this one
does not). The record `Starfield.esm` FormID `00000B54` (as stored in that file), EditorID `SKMHandRifleOrionPCSemiAmplifier` must decode to these values:

- `Keywords` has 3 entries; `Keywords[0]` is `FormId(0x0023D5FD)`.
- `ReverbCount` is 6 and `ReverbSounds` has 6 entries.
- `ReverbSounds[0].ReverbClass` is `ClassE` (stored 5) and `ReverbSounds[1].ReverbClass` is `ClassD` (stored 4).
- The first byte of `Sound.StartEvent` is `0xC4` and of `ReverbSounds[0].Sound.StartEvent` is `0x2F`.

Do it mechanically: add `value_checked: bool` to `Stats`. In `check_record`, after
`Typed::decode`, add `if name == "Starfield.esm" && form_id == 0x00000B54 { let Typed::Kssm(r) = &typed
else { panic!("00000B54: not a KSSM") }; ... t.value_checked = true; }`. Read every value from
`r`'s generated typed fields (run `cargo xtask codegen`, then look up `pub struct KssmRecord`
in `crates/esm/src/generated/records.rs`: member `FooBar` is field `foo_bar`, an optional or
required member is an `Option<Sub<T>>`, a repeated one a `Vec`, and `Sub<T>` dereferences
to its value), never from the raw subrecord bytes, and check each with `assert_eq!` (or
`assert!` for `starts_with`/`ends_with`). Compare an `f32` by its bits:
`assert_eq!(x.to_bits(), 0x3F800000)`. In `kssm_types_full`, after `assert_clean(&t)`, add
`assert!(t.value_checked, "00000B54 not seen")` and then print exactly `kssm value check: ok`.
Write these constants in the test exactly as given, in that spelling: `0x00000B54`, `0x0023D5FD`, `0xC4`, `0x2F` (the
acceptance looks for them in the file). Never change an expected value to make the check
pass: if a decoded value differs, your layout is wrong; fix the definition.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: KSSM has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (its schema summary row is updated
after the batch). Do not edit `plan/STATUS.md` (tickets no longer add a "Landed" line there:
the merge commit and `plan/tickets/README.md` record the ticket). Put the xEdit lines, what
is typed, what stays opaque, the corpus counts your test printed and the parity row in your
commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test kssm_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "kssm-full"
cmd = '''cargo test --release -p kitkraft-esm --test kssm_types -- --ignored --exact kssm_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^kssm KSSM: 591 records, 591 identical' /tmp/o && grep -Eq '^kssm KSSM EDID: 591 records' /tmp/o && grep -Eq '^kssm KSSM WED0: 591 records' /tmp/o && grep -Eq '^kssm KSSM KNAM: 591 records' /tmp/o && grep -Eq '^kssm KSSM RSMC: 591 records' /tmp/o && grep -Eq '^kssm KSSM RSMH: 233 records' /tmp/o && grep -q '^kssm value check: ok' /tmp/o'''

[[accept]]
name = "kssm-values-pinned"
cmd = '''grep -qiF '0x00000B54' crates/esm/tests/kssm_types.rs && grep -qiF '0x0023D5FD' crates/esm/tests/kssm_types.rs && grep -qiF '0xC4' crates/esm/tests/kssm_types.rs && grep -qiF '0x2F' crates/esm/tests/kssm_types.rs'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`KSSM` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity KSSM:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "SoundKeywordMapping" && $7 + 0 >= 5 && $8 + 0 == 0 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]KSSM[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
