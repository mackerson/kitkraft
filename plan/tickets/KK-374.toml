# Written 2026-11-17 in the shape of KK-330 (inventory to typed, from the pinned xEdit file).
id = "KK-374"
title = "Type REVB (ReverbParameters) from the pinned xEdit file, corpus-checked"
timeout_min = 60
budget_h = 1.5
priority = 1
owns = [
  "crates/schema/defs/REVB.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/revb_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`REVB` (ReverbParameters, a reverb setting: its Wwise aux bus and its class; 41 official records, 3 signatures in
the corpus: `EDID`, `RABG`, `ANAM`) has an inventory definition:
`crates/schema/defs/REVB.toml`. Only `EDID` is typed; every other payload is `opaque` or an
opaque group. Its xEdit definition is at `L16883-L16891` of the pinned file. Parity target:
the first `REVB` row of `docs/record-parity.md` (the per-type table, columns records,
compressed, signatures, typed, opaque, unknown) must show at least 2 typed and 0 unknown (`RABG` stays opaque by design (a Wwise GUID)).

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): EDID; VMAD; the base form component block; `RABG`, a Wwise GUID named 'Aux Bus';
`ANAM`, a 32-bit enum named 'Reverb Class' (its values are the enum xEdit declares as a
variable near L2940; read it). Type them so:

- `EDID` stays as it is.
- `RABG`: keep it `opaque` (16 bytes), renamed `AuxBus`, with the note `WWED.toml` gives its
  Wwise GUIDs (every Wwise GUID in this repo stays raw: the pinned files give the type no
  field layout).
- `ANAM`: named `ReverbClass`, `type = "enum"`, `base = "u32"`, the values xEdit lists, in
  our own UpperCamelCase names.
- VMAD and the base form component block: no official REVB record has either; leave them
  out and say so in the header comment.

Change the record-level `source` to the xEdit citation (`xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L16883-L16891`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. Keep each member's corpus facts (which records have
it, its sizes) in its `source` or `evidence`. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops REVB from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"REVB"` from its inventory list in
`crates/schema/tests/defs.rs` (REVB is in `BX2_INVENTORY`): those lists are for definitions that type
nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while REVB is listed with a
typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). The record header flags xEdit lists are out of scope too. REVB has no
lstring; the corpus lstring table (`crates/engine/src/edit/lstrings.rs`) must still match,
so do not edit it.

Read first: `crates/schema/defs/README.md` (the definition format: structs, flags, enums,
arrays, groups, `ref:` types), then `crates/schema/defs/WWED.toml` (KK-290, the last
inventory a ticket typed: its header comment, citations and evidence lines are the style to
follow) and `crates/schema/defs/WWED.toml` (its raw Wwise GUIDs) and `ADDN.toml` (an enum field).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase. The corpus wins over xEdit: where a size or an
order differs, follow the corpus and say so in a `note`. The parity target leaves no room for a member you cannot type: if one cannot be typed as described, keep it `opaque` with a `note` that says why, do not guess a layout, write the reason in your commit message and stop; the run then fails on its acceptance and the merge reads your reason. Write a `corpus:`
evidence line only after a test of yours has printed the fact it cites; until then cite
xEdit with `confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/revb_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `revb_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `revb REVB: <n>
records, <m> identical` and, for each signature, `revb REVB <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: REVB has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (its schema summary row is updated
after the batch). Do not edit `plan/STATUS.md` (tickets no longer add a "Landed" line there:
the merge commit and `plan/tickets/README.md` record the ticket). Put the xEdit lines, what
is typed, what stays opaque, the corpus counts your test printed and the parity row in your
commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test revb_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "revb-full"
cmd = '''cargo test --release -p kitkraft-esm --test revb_types -- --ignored --exact revb_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^revb REVB: 41 records, 41 identical' /tmp/o && grep -Eq '^revb REVB EDID: 41 records' /tmp/o && grep -Eq '^revb REVB RABG: 35 records' /tmp/o && grep -Eq '^revb REVB ANAM: 41 records' /tmp/o'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`REVB` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity REVB:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "ReverbParameters" && $7 + 0 >= 2 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]REVB[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
