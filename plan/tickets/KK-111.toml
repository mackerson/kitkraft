# Generated by plan/tickets/generate.py inventory; edit freely, a rerun never rewrites it.
id = "KK-111"
title = "Inventory definitions for DEBR, OSWP, WTHR, PERS, SDLT, DOBJ, GWED and MAAM"
timeout_min = 45
budget_h = 2.5
owns = [
  "crates/schema/defs/DEBR.toml",
  "crates/schema/defs/OSWP.toml",
  "crates/schema/defs/WTHR.toml",
  "crates/schema/defs/PERS.toml",
  "crates/schema/defs/SDLT.toml",
  "crates/schema/defs/DOBJ.toml",
  "crates/schema/defs/GWED.toml",
  "crates/schema/defs/MAAM.toml",
  "crates/schema/src/lib.rs",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/inventory_types.rs",
  "crates/esm/src/bridge.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
89 record types of the official files have no schema definition at all
(`docs/record-parity.md`, rows whose definition is `-`): KitKraft parses and re-writes them
but cannot name a single subrecord. An inventory definition (every signature the corpus
shows, in corpus order and cardinality, every payload `opaque`) is the first step for each;
M4.BX2 did fourteen (`crates/schema/defs/LAYR.toml` is one). Do 8 more, from the largest
left that no other ticket covers (record counts and signatures from `docs/record-parity.md`;
names are xEdit's record names in our UpperCamelCase):

- `DEBR`: 3 records, 3 signatures seen; name `Debris` (xEdit's "Debris"); xEdit definition
  at `L11282-L11286`; the xEdit definition has base form components.
- `OSWP`: 3 records, 1 signature seen; name `ObjectSwap` (xEdit's "Object Swap"); xEdit
  definition at `L15479-L15503`; the xEdit definition has base form components.
- `WTHR`: 3 records, 26 signatures seen; name `Weather` (xEdit's "Weather"); xEdit
  definition at `L18846-L18929`.
- `PERS`: 2 records, 2 signatures seen; name `UnknownPers` (xEdit's "Unknown - PERS"); xEdit
  definition at `L15925-L15932`.
- `SDLT`: 2 records, 4 signatures seen; name `SecondaryDamageListForm` (xEdit's "Secondary
  Damage List"); xEdit definition at `L17454-L17465`; the xEdit definition has base form
  components.
- `DOBJ`: 1 record, 2 signatures seen; name `DefaultObjectManager` (xEdit's "Default Object
  Manager"); xEdit definition at `L11563-L11572`.
- `GWED`: 1 record, 2 signatures seen; name `GravityWielderEffectData` (xEdit's "Gravity
  Wielder Effect Data"); xEdit definition at `L12507-L12528`; the xEdit definition has base
  form components.
- `MAAM`: 1 record, 2 signatures seen; name `MeleeAimAssistModel` (xEdit's "Melee Aim Assist
  Model"); xEdit definition at `L14259-L14288`; the xEdit definition has base form
  components.

`DEBR`, `OSWP`, `SDLT`, `GWED`, `MAAM`: the parity table counts the subrecords inside
component blocks (`BFCB` .. `BFCE`) as unknown even with a definition
(`docs/record-parity.md`, "Columns"), so their rows must show the definition's name and may
keep as unknown only the signatures the inventory run lists as `inside BFCB..BFCE`; every
other row must show 0 unknown.

Use the inventory tools (`crates/schema/defs/README.md`, "Inventory definitions",
"Workflow"; `crates/schema/defs/LAYR.toml` is an example of their output). They take every
count from one scan of the corpus, the one the inventory test prints. Then:

1. For each type, `cargo xtask inventory-def <SIG> --name <Name> --ticket KK-111 --evidence
   'xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L<a>-L<b>'`,
   with the name and the xEdit line range listed above (for `DEBR`: `cargo xtask
   inventory-def DEBR --name Debris --ticket KK-111 --evidence
   'xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L11282-L11286'`).
   It scans the 14 official ESMs and writes `crates/schema/defs/<SIG>.toml` in LAYR.toml's
   style: every member the corpus shows, in corpus order and cardinality, EDID, `BfcbBlock`
   and `Keywords` typed, every other payload `opaque`, every `source` citing the scan's
   counts and sizes with today's date.

2. Read each file and settle every `# TODO(review): ...` comment and every warning the
   command printed (the README's "Workflow" says what each one means: an inferred group to
   check and name, a repeat it could not group, two members seen in both orders), then
   delete the comment. Change structure only; keep the generated `source` counts, never type
   a count by hand. The pinned xEdit file is read-only at
   `/opt/xedit-ref/wbDefinitionsSF1.pas`; per the README's "Inventory definitions" you may
   cite the line where it lists a member (in the member's `evidence`) and follow its order
   where a member's `note` says the corpus does not show the order. Never type a member from
   it (that is a later ticket), and never copy its code or comments (clean room, AGENTS.md).

3. `cargo xtask add-def DEBR OSWP WTHR PERS SDLT DOBJ GWED MAAM` registers all 8 at once:
   `BUILTIN_DEFINITIONS` in `crates/schema/src/lib.rs`, `TYPES` in
   `crates/esm/tests/inventory_types.rs`, the inventory list in
   `crates/schema/tests/defs.rs` and, for a type with no EDID, `WITHOUT_EDID` in
   `crates/esm/src/bridge.rs`; then it regenerates `crates/esm/src/generated/records.rs`,
   the golden seed and `docs/record-parity.md` (and the gap matrix). Rerun it after any
   change to a definition; never edit the generated files by hand.

4. `KK_INVENTORY_ONLY=DEBR,OSWP,WTHR,PERS,SDLT,DOBJ,GWED,MAAM cargo test -p kitkraft-esm
   --release --test inventory_types -- --include-ignored --exact inventory_types_full
   --nocapture` runs the inventory test on these types alone: each must print `defined:
   true` with no unplaced, failed or re-encode lines. If one does not, fix its definition
   from the orders it prints and rerun step 3.

5. `cargo xtask inventory-check DEBR OSWP WTHR PERS SDLT DOBJ GWED MAAM` must pass: it fails
   on any cited count, size, per-record maximum or top-level `card` the corpus scan does not
   show.

Done: the inventory run prints `defined: true` for each of the 8 with no unplaced, failed or
re-encode lines, and `cargo xtask ci` passes. Do not change any other definition, and do not
change the output of any command for any other record type. Other schema tickets may run the
same night on other types: touch only the lines of the shared lists (`TYPES`,
`BUILTIN_DEFINITIONS`, the record list in `tests/defs.rs`) your types need, and regenerate
the generated files rather than editing them.
"""

[[accept]]
name = "inventory"
cmd = "cargo test -p kitkraft-esm --release --test inventory_types -- --include-ignored --exact inventory_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^== DEBR: 3 records .*defined: true' /tmp/o && grep -Eq '^== OSWP: 3 records .*defined: true' /tmp/o && grep -Eq '^== WTHR: 3 records .*defined: true' /tmp/o && grep -Eq '^== PERS: 2 records .*defined: true' /tmp/o && grep -Eq '^== SDLT: 2 records .*defined: true' /tmp/o && grep -Eq '^== DOBJ: 1 records .*defined: true' /tmp/o && grep -Eq '^== GWED: 1 records .*defined: true' /tmp/o && grep -Eq '^== MAAM: 1 records .*defined: true' /tmp/o"

[[accept]]
name = "schema-defs"
cmd = "cargo test -p kitkraft-schema"

[[accept]]
name = "codegen-fresh"
cmd = "cargo xtask codegen --check"

[[accept]]
name = "parity-rows"
cmd = '''grep -Eq '^\| `DEBR` +\| Debris +\| +3 \|' docs/record-parity.md && grep -Eq '^\| `OSWP` +\| ObjectSwap +\| +3 \|' docs/record-parity.md && grep -Eq '^\| `WTHR` +\| Weather +\| +3 .*\| +0 \|$' docs/record-parity.md && grep -Eq '^\| `PERS` +\| UnknownPers +\| +2 .*\| +0 \|$' docs/record-parity.md && grep -Eq '^\| `SDLT` +\| SecondaryDamageListForm +\| +2 \|' docs/record-parity.md && grep -Eq '^\| `DOBJ` +\| DefaultObjectManager +\| +1 .*\| +0 \|$' docs/record-parity.md && grep -Eq '^\| `GWED` +\| GravityWielderEffectData +\| +1 \|' docs/record-parity.md && grep -Eq '^\| `MAAM` +\| MeleeAimAssistModel +\| +1 \|' docs/record-parity.md'''

[[accept]]
name = "inventory-counts"
cmd = "cargo xtask inventory-check DEBR OSWP WTHR PERS SDLT DOBJ GWED MAAM"
