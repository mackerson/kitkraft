# Written 2026-11-18 in the shape of KK-371 (inventory to typed, from the pinned xEdit file),
# with a value check on a named official record (planning lane plan/tickets-20261118).
id = "KK-425"
title = "Type NAVI (NavmeshInfoMap) from the pinned xEdit file, corpus-checked, values pinned"
timeout_min = 60
budget_h = 1.5
priority = 0
owns = [
  "crates/schema/defs/NAVI.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/navi_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`NAVI` (NavmeshInfoMap, a navmesh info map: per navmesh its location, links, door links and traversals; 8 official records, 3 signatures in
the corpus (no EDID: the type has none): `NVER`, `NVMI`, `NVPP`) has an inventory definition:
`crates/schema/defs/NAVI.toml`. Only EDID, lstrings and shared blocks are typed; every other
payload is `opaque` or an opaque group. Its xEdit definition is at `L14770-L14891` of the pinned
file. Parity target: the first `NAVI` row of `docs/record-parity.md` (the per-type table,
columns records, compressed, signatures, typed, opaque, unknown) must show at least
2 typed and 0 unknown.

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): EDID (no official record has one); `NVER`, a u32 version; a repeated `NVMI`, a struct: a
FormID of a `NAVM`; u32 flags (bit 0x20 'Is Island', 0x40 'Not Edited'); a three-float
approximate location; a float 'Preferred %'; edge links and preferred edge links (each a u32
count, then FormIDs of `NAVM`); door links (a u32 count, then 8-byte entries: a u32 CRC
hash and a FormID of a `REFR`); traversals (a u32 count, then 60-byte entries: a u32 type
CRC, a FormID of a `CELL` or `REFR`, a FormID of a `TRAV` or `REFR`, a from position and a to
position of three floats each, three unnamed floats, u32 flags, FormIDs of the from and to
`NAVM`); then island data behind a boolean (a union with variable arrays), a pathing cell (a
union chosen by the parent world's type), an unknown byte and a CRC array; `NVPP`,
precomputed paths (an array of variable arrays) and road markers. Type them so:

- `NVER`: named `Version`, `u32`, `card = "optional"` (with the corpus count).
- `NVMI`: named `NavmeshInfos`, `card = "repeated"`, `struct`, fields in order: `Navmesh`
  (`formid`, `targets = ["NAVM"]`), `Flags` (`flags`, `base = "u32"`, `IsIsland` 0x20,
  `NotEdited` 0x40), `ApproxLocation` (`ref:Vec3`), `PreferredPercent` (`f32`),
  `EdgeLinkCount` (`u32`), `EdgeLinks` (`array`, `formid`, `targets = ["NAVM"]`,
  `count_from = "EdgeLinkCount"`), `PreferredEdgeLinkCount`, `PreferredEdgeLinks` (the
  same), `DoorLinkCount`, `DoorLinks` (`array`, `element = "struct"`, fields `CrcHash`
  `u32`, `DoorRef` `formid` `targets = ["REFR"]`, `count_from = "DoorLinkCount"`),
  `TraversalCount`, `Traversals` (`array`, `element = "struct"`, `count_from =
  "TraversalCount"`, fields `Type` `u32`, `CellOrObject` `formid` `targets = ["CELL",
  "REFR"]`, `Traversal` `formid` `targets = ["TRAV", "REFR"]`, `FromPosition` and
  `ToPosition` `ref:Vec3`, `Unnamed` `opaque` `size = 12` (three floats upstream leaves
  unnamed), `Flags` `u32`, `FromNavmesh` and `ToNavmesh` `formid` `targets = ["NAVM"]`:
  60 bytes), then `Rest` (`opaque`, no size, `note`: island data and the pathing cell are
  unions the format cannot express, one behind a boolean with variable arrays, one chosen
  by the parent world's type; kept raw).
- `NVPP`: stays `opaque`, renamed `PrecomputedPathing`, `note`: an array of variable
  arrays, not expressible. The pinned file does not require it: `optional`.
- EDID: in no official NAVI record; leave it out (the definition has none).

What makes this one harder than the template: The hardest of the batch. `NVMI` is a long struct with four counted arrays, two of them
arrays of structs, and a raw tail; 93,295 `NVMI`s in 8 records (up to 56,631 in one), 58 to
24,510 bytes each. Count the traversal entry's bytes (60) before you run anything. A wrong
field before the tail shifts every later one and most payloads then fail to decode, so the
corpus test tells you quickly; the value check pins the first entry. The record has no EDID,
so the corpus test prints no `EDID` line. `NVPP` stays opaque, so the target is 2 typed.

Which members are required: follow "Members" in `crates/schema/defs/README.md` (owner ruling
2026-11-07): a member is `required` only where the pinned file requires it; a member every
official record carries but the pinned file leaves optional is `optional`, with the corpus
count in its `evidence`; the first member of a group stays `required` (the group is
recognised by it). Where the pinned file requires a member that some official record lacks,
the corpus wins: `optional`, with the count in a `note`. Which members exist, their order and
their sizes also follow the corpus: leave out members no official record has.

Change the record-level `source` to the xEdit citation (`xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L14770-L14891`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. Keep each member's corpus facts (which records have
it, its sizes) in its `source` or `evidence`. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops NAVI from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"NAVI"` from its inventory list in
`crates/schema/tests/defs.rs` (NAVI is in `BX2_INVENTORY`): those lists are for definitions that type
nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while NAVI is listed with a
typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). The record header flags xEdit lists are out of scope too. Do not edit the
corpus lstring table (`crates/engine/src/edit/lstrings.rs`); it must still match.

Read first: `crates/schema/defs/README.md` (the definition format: structs, flags, enums,
arrays, groups, `ref:` types, "Not supported"), then `crates/schema/defs/WWED.toml` (KK-290: its header comment, citations and evidence lines are the style to follow), `crates/schema/defs/REGN.toml` (arrays of structs) and `crates/schema/defs/PROJ.toml` (`count_from`).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase; use the names this brief gives (the value check
below and later tickets rely on them). The corpus wins over xEdit: where a size or an order
differs, follow the corpus and say so in a `note`. If one member cannot be typed as
described, keep that one `opaque` with a `note` that says why; do not guess a layout. Write
a `corpus:` evidence line only after a test of yours has printed the fact it cites; until
then cite xEdit with `confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/navi_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `navi_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `navi NAVI: <n>
records, <m> identical` and, for each signature, `navi NAVI <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Value check (required: the checks above pass for a wrong layout of the right width; this one
does not). The record `Starfield.esm` FormID `00000FF1` (as stored in that file), which has no EditorID must decode to these values:

- `Version` is 17.
- `NavmeshInfos[0].Navmesh` is `FormId(0x000B0C1E)` and its stored `Flags` value is `0x00000020`.
- `NavmeshInfos[0].EdgeLinks` and `DoorLinks` are empty; `NavmeshInfos[0].TraversalCount` is 19 and `Traversals` has 19 entries.
- `NavmeshInfos[0].Traversals[0].Type` is `0xDAF94F6D` and its `CellOrObject` is `FormId(0x0025558A)`.

Do it mechanically: add `value_checked: bool` to `Stats`. In `check_record`, after
`Typed::decode`, add `if name == "Starfield.esm" && form_id == 0x00000FF1 { let Typed::Navi(r) = &typed
else { panic!("00000FF1: not a NAVI") }; ... t.value_checked = true; }`. Read every value from
`r`'s generated typed fields (run `cargo xtask codegen`, then look up `pub struct NaviRecord`
in `crates/esm/src/generated/records.rs`: member `FooBar` is field `foo_bar`, an optional or
required member is an `Option<Sub<T>>`, a repeated one a `Vec`, and `Sub<T>` dereferences
to its value), never from the raw subrecord bytes, and check each with `assert_eq!` (or
`assert!` for `starts_with`/`ends_with`). Compare an `f32` by its bits:
`assert_eq!(x.to_bits(), 0x3F800000)`. In `navi_types_full`, after `assert_clean(&t)`, add
`assert!(t.value_checked, "00000FF1 not seen")` and then print exactly `navi value check: ok`.
Write these constants in the test exactly as given, in that spelling: `0x00000FF1`, `0x000B0C1E`, `0xDAF94F6D`, `0x0025558A` (the
acceptance looks for them in the file). Never change an expected value to make the check
pass: if a decoded value differs, your layout is wrong; fix the definition.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: NAVI has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (its schema summary row is updated
after the batch). Do not edit `plan/STATUS.md` (tickets no longer add a "Landed" line there:
the merge commit and `plan/tickets/README.md` record the ticket). Put the xEdit lines, what
is typed, what stays opaque, the corpus counts your test printed and the parity row in your
commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test navi_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "navi-full"
cmd = '''cargo test --release -p kitkraft-esm --test navi_types -- --ignored --exact navi_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^navi NAVI: 8 records, 8 identical' /tmp/o && grep -Eq '^navi NAVI NVER: 8 records' /tmp/o && grep -Eq '^navi NAVI NVMI: 8 records' /tmp/o && grep -Eq '^navi NAVI NVPP: 8 records' /tmp/o && grep -q '^navi value check: ok' /tmp/o'''

[[accept]]
name = "navi-values-pinned"
cmd = '''grep -qiF '0x00000FF1' crates/esm/tests/navi_types.rs && grep -qiF '0x000B0C1E' crates/esm/tests/navi_types.rs && grep -qiF '0xDAF94F6D' crates/esm/tests/navi_types.rs && grep -qiF '0x0025558A' crates/esm/tests/navi_types.rs'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`NAVI` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity NAVI:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "NavmeshInfoMap" && $7 + 0 >= 2 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]NAVI[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
