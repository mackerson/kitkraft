# Written 2026-11-18 in the shape of KK-371 (inventory to typed, from the pinned xEdit file),
# with a value check on a named official record (planning lane plan/tickets-20261118).
id = "KK-424"
title = "Type BMOD (BoneModifier) from the pinned xEdit file, corpus-checked, values pinned"
timeout_min = 60
budget_h = 1.5
priority = 0
owns = [
  "crates/schema/defs/BMOD.toml",
  "crates/schema/tests/defs.rs",
  "crates/schema/tests/golden/seed.rs",
  "crates/esm/src/generated/records.rs",
  "crates/esm/tests/bmod_types.rs",
  "docs/record-parity.md",
  "docs/foothold/gap-matrix.md",
]
brief = """
`BMOD` (BoneModifier, a bone modifier: a look-at chain, morph driver, pose deformer or spring bone on a skeleton; 529 official records, 2 signatures in
the corpus: `EDID`, `DATA`) has an inventory definition:
`crates/schema/defs/BMOD.toml`. Only EDID, lstrings and shared blocks are typed; every other
payload is `opaque` or an opaque group. Its xEdit definition is at `L10284-L10371` of the pinned
file. Parity target: the first `BMOD` row of `docs/record-parity.md` (the per-type table,
columns records, compressed, signatures, typed, opaque, unknown) must show at least
8 typed and 0 opaque and 0 unknown.

What xEdit says, member by member (read the lines yourself; this is a guide, not a source to
cite): EDID; the base form component block; `DATA`, a struct: three length-prefixed strings
(32-bit byte count, NUL included): 'Type' (one of LookAtChain, MorphDriver, PoseDeformer,
SpringBone), 'Driver', 'Target'; a float 'Max Anim Distance'; then a union chosen by the
'Type' string: a chain end string, or vectors, radii and an axis byte, by type. Type them so:

- `EDID` and the base form component group stay as they are.
- `DATA`: named `Data`, `struct`, fields `TypeLength` (`u32`), `Type` (`array`, `element =
  "u8"`, `count_from = "TypeLength"`), `DriverLength`, `Driver`, `TargetLength`, `Target`
  (the same pattern), `MaxAnimDistance` (`f32`), `TypeData` (`opaque`, no size: the rest,
  `note`: a layout the pinned file picks by the `Type` string; the format's field union
  takes an integer decider only, so it stays raw). The pinned file does not require
  `DATA`: `optional`, with the corpus count (529 of 529) in its `evidence`.

What makes this one harder than the template: Two format limits meet here: 32-bit length-prefixed strings (write them as length +
`count_from` bytes, as `crates/schema/defs/PROJ.toml` does) and a union decided by a string,
which cannot be expressed: the type-dependent tail stays opaque. An empty string is a length
of 0 and no bytes (the `SpringBone` records show it). Today's parity row already counts
`DATA` typed (a component layout types `DATA`), so the parity target passes on main; the
value check is the real test.

Which members are required: follow "Members" in `crates/schema/defs/README.md` (owner ruling
2026-11-07): a member is `required` only where the pinned file requires it; a member every
official record carries but the pinned file leaves optional is `optional`, with the corpus
count in its `evidence`; the first member of a group stays `required` (the group is
recognised by it). Where the pinned file requires a member that some official record lacks,
the corpus wins: `optional`, with the count in a `note`. Which members exist, their order and
their sizes also follow the corpus: leave out members no official record has.

Change the record-level `source` to the xEdit citation (`xedit: wbDefinitionsSF1.pas@9fb016884bec138ea6c7b872cec831537d464c3e#L10284-L10371`), as
`crates/schema/defs/WWED.toml` (KK-290) does, and rewrite the header comment and the record
`note`: it is no longer an inventory. Keep each member's corpus facts (which records have
it, its sizes) in its `source` or `evidence`. With the source no longer starting `corpus:
inventory_types_full`, `cargo xtask parity` drops BMOD from the "Inventory definitions" list
of `docs/record-parity.md`. Remove `"BMOD"` from its inventory list in
`crates/schema/tests/defs.rs` (BMOD is in `BX2_INVENTORY`): those lists are for definitions that type
nothing but EDID, lstrings and shared blocks, and
`bx2_inventories_type_only_edid_lstrings_and_shared_blocks` fails while BMOD is listed with a
typed member. Leave `crates/esm/tests/inventory_types.rs` and `xtask/src/parity.rs` alone
(out of scope). The record header flags xEdit lists are out of scope too. Do not edit the
corpus lstring table (`crates/engine/src/edit/lstrings.rs`); it must still match.

Read first: `crates/schema/defs/README.md` (the definition format: structs, flags, enums,
arrays, groups, `ref:` types, "Not supported"), then `crates/schema/defs/WWED.toml` (KK-290: its header comment, citations and evidence lines are the style to follow) and `crates/schema/defs/PROJ.toml` (the length-prefixed strings).

Source: the pinned xEdit file, read-only at `/opt/xedit-ref/wbDefinitionsSF1.pas` (revision
9fb016884bec138ea6c7b872cec831537d464c3e), and the helpers it names in
`/opt/xedit-ref/wbDefinitionsCommon.pas`. Cite line ranges in `source`/`evidence` as
`crates/schema/defs/WWED.toml` does. Clean-room rule (AGENTS.md): read it for facts (member
order, types, sizes, names) and write the TOML in your own words; never copy its code or
comments. Names are ours, UpperCamelCase; use the names this brief gives (the value check
below and later tickets rely on them). The corpus wins over xEdit: where a size or an order
differs, follow the corpus and say so in a `note`. If one member cannot be typed as
described, keep that one `opaque` with a `note` that says why; do not guess a layout. Write
a `corpus:` evidence line only after a test of yours has printed the fact it cites; until
then cite xEdit with `confidence = "reference"`.

Then check it against the corpus: `crates/esm/tests/bmod_types.rs`, modelled on
`crates/esm/tests/wwed_types.rs` (KK-290; same lint allowances and checks: every subrecord
placed in a member, every placed subrecord decodes, re-encoding reproduces each record). One
new test, `bmod_types_full`, `#[ignore = "reads all 14 official ESMs; run in release"]`,
printing exactly (plain integers, no separators, at the start of the line) `bmod BMOD: <n>
records, <m> identical` and, for each signature, `bmod BMOD <SIG>: <k> records` (how many
records have it, not how many times it occurs). It must fail when it reads no record.

Value check (required: the checks above pass for a wrong layout of the right width; this one
does not). The record `Starfield.esm` FormID `0001480D` (as stored in that file), EditorID `BM_BipedA_ReefWalker_HeadLLookAt01` must decode to these values:

- `Data.TypeLength` is 12 and `Data.Type` is the bytes of `LookAtChain` followed by one 0 byte.
- `Data.DriverLength` is 14 and `Data.Driver` starts with `b"Head_LookAt_L"`; `Data.Target` starts with `b"Head_Spring_L"`.
- `Data.MaxAnimDistance` has the bits `0x41A00000`; `Data.TypeData` is 18 bytes.

Do it mechanically: add `value_checked: bool` to `Stats`. In `check_record`, after
`Typed::decode`, add `if name == "Starfield.esm" && form_id == 0x0001480D { let Typed::Bmod(r) = &typed
else { panic!("0001480D: not a BMOD") }; ... t.value_checked = true; }`. Read every value from
`r`'s generated typed fields (run `cargo xtask codegen`, then look up `pub struct BmodRecord`
in `crates/esm/src/generated/records.rs`: member `FooBar` is field `foo_bar`, an optional or
required member is an `Option<Sub<T>>`, a repeated one a `Vec`, and `Sub<T>` dereferences
to its value), never from the raw subrecord bytes, and check each with `assert_eq!` (or
`assert!` for `starts_with`/`ends_with`). Compare an `f32` by its bits:
`assert_eq!(x.to_bits(), 0x3F800000)`. In `bmod_types_full`, after `assert_clean(&t)`, add
`assert!(t.value_checked, "0001480D not seen")` and then print exactly `bmod value check: ok`.
Write these constants in the test exactly as given, in that spelling: `0x0001480D`, `LookAtChain`, `Head_Spring_L`, `0x41A00000` (the
acceptance looks for them in the file). Never change an expected value to make the check
pass: if a decoded value differs, your layout is wrong; fix the definition.

Regenerate code with `cargo xtask codegen` and the golden seed as the schema tests describe
(`KITKRAFT_UPDATE_GOLDEN=1`, `crates/schema/tests/codegen.rs`); never hand-edit generated
files. Regenerate `docs/record-parity.md` and the gap-matrix headline with `cargo xtask
parity` (it reads the Data folder) and check the parity target above.

Docs: BMOD has no row in the hand-written tables of `docs/foothold/gap-matrix.md`; `cargo
xtask parity` rewrites only that file's generated headline, so commit what it writes and
edit nothing else there. Do not edit `docs/gaps.md` (its schema summary row is updated
after the batch). Do not edit `plan/STATUS.md` (tickets no longer add a "Landed" line there:
the merge commit and `plan/tickets/README.md` record the ticket). Put the xEdit lines, what
is typed, what stays opaque, the corpus counts your test printed and the parity row in your
commit message.

Do not change any other definition, any shared block in `crates/schema/defs/common/`, or the
output of any command for another record type. Other schema tickets run the same night on
other types: in the shared lists touch only the line of your type.

While working, run `cargo test -p kitkraft-schema` and the corpus test in release: `cargo
test --release -p kitkraft-esm --test bmod_types -- --ignored --nocapture`. Then `cargo
xtask parity --check` and `cargo xtask ci`. Commit only when every acceptance command below
passes and `cargo xtask ci` is green; never commit a tree that fails them (the harness keeps
uncommitted work if the time runs out).
"""

[[accept]]
name = "bmod-full"
cmd = '''cargo test --release -p kitkraft-esm --test bmod_types -- --ignored --exact bmod_types_full --nocapture 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o && grep -Eq '^bmod BMOD: 529 records, 529 identical' /tmp/o && grep -Eq '^bmod BMOD EDID: 529 records' /tmp/o && grep -Eq '^bmod BMOD DATA: 529 records' /tmp/o && grep -q '^bmod value check: ok' /tmp/o'''

[[accept]]
name = "bmod-values-pinned"
cmd = '''grep -qiF '0x0001480D' crates/esm/tests/bmod_types.rs && grep -qiF 'LookAtChain' crates/esm/tests/bmod_types.rs && grep -qiF 'Head_Spring_L' crates/esm/tests/bmod_types.rs && grep -qiF '0x41A00000' crates/esm/tests/bmod_types.rs'''

[[accept]]
name = "schema-all"
cmd = '''cargo test -p kitkraft-schema'''

[[accept]]
name = "codegen-fresh"
cmd = '''cargo xtask codegen --check'''

[[accept]]
name = "parity-row"
cmd = '''awk -F'|' 'BEGIN { ok = 0 } !seen && $2 ~ /^ *`BMOD` *$/ { seen = 1; for (i = 2; i < NF; i++) { gsub(/[ ,]/, "", $i) } print "parity BMOD:", $3, "typed", $7, "opaque", $8, "unknown", $9; ok = (NF == 10 && $3 == "BoneModifier" && $7 + 0 >= 8 && $8 + 0 == 0 && $9 + 0 == 0) } END { exit ok ? 0 : 1 }' docs/record-parity.md && grep -q '^Inventory definitions' docs/record-parity.md && ! grep -Eq '^Inventory definitions.*[ ,]BMOD[,.]' docs/record-parity.md'''

[[accept]]
name = "parity-fresh"
cmd = '''cargo xtask parity --check'''
