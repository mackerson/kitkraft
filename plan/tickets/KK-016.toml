id = "KK-016"
title = "cargo xtask parity generates the gap matrix headline and checks the family table against it"
timeout_min = 60
after = ["KK-002"]
owns = [
  "xtask/src/parity.rs",
  "docs/foothold/gap-matrix.md",
  "docs/record-parity.md",
]
brief = """
M5.D1's open half. `docs/foothold/gap-matrix.md` is the project's map of what each record
type supports, in six statuses (parsed, typed-readable, typed-writable, CK-diff, game,
save/reload). It is kept by hand. `kit coverage --matrix` (MX) measures the same statuses
from the corpus and `docs/schema/evidence.toml`, so the two drift apart: when a ticket adds
typed-writable evidence (KK-002 added ACTI, KYWD, TMLM, QUST and WRLD), MX changes and the
hand table does not. Make `cargo xtask parity` write the matrix's headline from MX and
check the hand-written family table against it.

Read first:
- `xtask/src/parity.rs`: `cargo xtask parity [--check]` runs `kit coverage` and
  `kit roundtrip --verify` over the 14 corpus files (`kit()` runs `kit-cli` in release and
  parses `--json`), renders `docs/record-parity.md`, and with `--check` fails when the
  committed file differs. Its unit tests (`mod tests`) show how pure render functions are
  tested with `serde_json::json!` fixtures.
- `crates/engine/src/handlers/matrix.rs`: the JSON `kit coverage --matrix --json` prints
  (`data.counts` per status and result, `data.files`, `data.rows` one per type with
  `type`, `records`, `parsed` and `typed_readable` (objects with a `status`), and
  `typed_writable`, `ck_differential_tested`, `game_runtime_tested`,
  `save_reload_verified`, each `{status, evidence, note}`). Read `run` there to confirm the
  shape before you parse it.
- `docs/foothold/gap-matrix.md`: "Headline at ..." (the MX table, by hand today) and
  "Record families" (one row per type or group of types; columns Type, Parsed,
  Typed-readable, Typed-writable, CK-diff, Game, Save/reload, Evidence).

Do:
1. In `parity::run`, after the existing work, run `kit coverage --matrix` once (no plugin
   argument: the official files of the Data folder). Render the headline as Markdown: one
   line naming the source (record types, records, files), then a table with one row per
   status in matrix order and the columns `Status | pass | fail | inconclusive | not-run |
   Which pass`. "Which pass" lists the passing types in backticks, sorted, when there are at
   most 15, else `<n> types`. Deterministic: no commit hash, no time.
2. Put it in `gap-matrix.md` between two marker lines, `<!-- parity:headline:begin -->` and
   `<!-- parity:headline:end -->`, replacing the hand table under the headline heading
   (rename the heading "Headline (generated by `cargo xtask parity`)"). Only the text
   between the markers is generated; everything else in the file is left byte-for-byte.
3. Check agreement: for every row of the "Record families" table whose Type cell is one
   backticked four-character type that MX has a row for, compare Parsed `yes` with MX
   parsed `pass`, Typed-writable `yes` with MX typed-writable `pass`, and Game `pass` with
   MX game-runtime-tested `pass` (each both ways). Every disagreement is one line,
   `gap-matrix: <TYPE> <column>: the table says <x>, MX says <y>`. Rows naming several
   types, or types MX lacks, are skipped.
4. `--check` fails when `record-parity.md` or the generated block is stale, or when any
   disagreement exists, printing each. Without `--check`, write both files and print the
   disagreements as warnings. On success `--check` prints `parity: docs/foothold/gap-matrix.md
   is up to date`.
5. Then run it, and fix each disagreement in the hand table by hand: a cell changes only
   with the test or ledger entry that proves it, cited in that row's evidence cell (the
   KK-002 rows cite `crates/engine/src/handlers/authoring_tests.rs` and the test names).
   Update the paragraph after the headline that counts the hand table's rows.

Unit tests in `xtask/src/parity.rs`'s `mod tests`, exact names, on small JSON and Markdown
fixtures written in the test (no corpus):
- `gap_matrix_headline_renders_from_the_matrix`: three types, the exact Markdown.
- `family_rows_disagreeing_with_the_matrix_are_listed`: a two-row family table where one
  row's Typed-writable says `partial` and MX says `pass`: exactly that one line.
- `only_the_marked_block_is_replaced`: text before and after the markers is unchanged; a
  file without markers is an error naming them.

Never panic (AGENTS.md): a missing marker or malformed JSON is an `anyhow` error. Do not
change `crates/engine` or the evidence file. `cargo xtask parity` reads the Data folder and
takes several minutes; run the unit tests first: `cargo test -p xtask parity`. Then
`cargo xtask parity`, then `cargo xtask parity --check`, then `cargo xtask ci`. Commit when
the unit tests pass.
"""

[[accept]]
name = "headline-unit"
cmd = "cargo test -p xtask -- --exact parity::tests::gap_matrix_headline_renders_from_the_matrix 2>&1 | tee /tmp/o; grep -q '^test result: ok. 1 passed' /tmp/o"

[[accept]]
name = "agreement-unit"
cmd = "cargo test -p xtask -- --exact parity::tests::family_rows_disagreeing_with_the_matrix_are_listed parity::tests::only_the_marked_block_is_replaced 2>&1 | tee /tmp/o; grep -q '^test result: ok. 2 passed' /tmp/o"

[[accept]]
name = "markers"
cmd = "grep -q '^<!-- parity:headline:begin -->$' docs/foothold/gap-matrix.md && grep -q '^<!-- parity:headline:end -->$' docs/foothold/gap-matrix.md"

[[accept]]
name = "parity-check"
cmd = "cargo xtask parity --check 2>&1 | tee /tmp/o; grep -q 'parity: docs/foothold/gap-matrix.md is up to date' /tmp/o"
