[workspace]
resolver = "2"
members = ["crates/*", "apps/*", "xtask"]

[workspace.package]
version = "0.0.0"
edition = "2021"
# Oldest toolchain the code is written for (`<[T]>::as_chunks` is 1.88). Crates opt in with
# `rust-version.workspace = true`; the dev box builds with 1.99 (plan/STATUS.md).
rust-version = "1.88"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
# Internal crates. Layer rules are enforced by `cargo xtask layers`.
kitcraft-schema = { path = "crates/schema" }
kitcraft-esm = { path = "crates/esm" }
kitcraft-ba2 = { path = "crates/ba2" }
kitcraft-pex = { path = "crates/pex" }
kitcraft-strings = { path = "crates/strings" }
kitcraft-nif = { path = "crates/nif" }
kitcraft-doc = { path = "crates/doc" }
kitcraft-io = { path = "crates/io" }
kitcraft-engine = { path = "crates/engine" }
kitcraft-mcp = { path = "crates/mcp" }

# External. Keep this list short; every addition is reviewed.
# anyhow is for apps/ and xtask/ only; library crates use thiserror.
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
# zlib for compressed records (crates/esm). zlib-rs backend (pure Rust, no C toolchain):
# at level 9 it recompresses 99.9% of the official ESMs' compressed records byte-identically,
# against 2.5% for the default miniz_oxide backend (docs/gaps.md).
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
# LZ4 block codec for BA2 v3 texture chunks (crates/ba2; header compression field 3, corpus:
# docs/corpus.md "Archives"). Safe-code features only, no frame format.
lz4_flex = { version = "0.11", default-features = false, features = ["safe-encode", "safe-decode", "std"] }
# Path patterns for `ba2.list` / `ba2.extract` (crates/engine), as in ba2x.py.
regex = "1"
# Reading `Tools\ContentResources.zip` for `papyrus.compile` (crates/engine, M3.G1). MIT.
# Deflate only, through the flate2 zlib-rs backend we already build; no AES, bzip2, zstd,
# lzma or time features.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
indexing_slicing = "deny"
# Clippy has no allow-in-tests setting for this lint (clippy.toml covers the others), so test
# code opts out explicitly: `#[allow(clippy::arithmetic_side_effects)]` on the `mod tests`
# block, or `#![allow(clippy::arithmetic_side_effects)]` at the top of an integration test.
arithmetic_side_effects = "deny"

[profile.release]
debug = 1
