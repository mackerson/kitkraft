fields = { XLCN = "new:lctn" }
brief = "bench-verify"

# The reporter finds the references below by object ID (a script property cannot name a
# [[place]] of the same build): 0x00102F (the reporter) to 0x00103A (the actor), in this
# order, after the 41 clones and 6 new forms above. `make_probes.py` checks every ID
# against the built plugin's EditorIDs; keep the order or update RefIds, ChestId and
# PackInId with it.
#
# Every placed reference is persistent, on the floor (z 4.63) in a row at y -8, west of
# the first POI's crate at (-17, -4).

[[place]]
name = "reporter"
base = "new:acti"
cell = "Starfield.esm:21966F"
position = [-14.0, -8.0, 4.63]
persistent = true
edid = "KKV70Reporter"
brief = "bench-verify"
scripts = [
  { name = "KitKraft:VerifyReport", properties = { Glob = "new:glob", Flst = "new:flst", Mug = "new:mug", Wrench = "new:wrench", Kwd = "new:kywd", Fact = "new:fact", PerkToAdd = "new:perk", Av = "new:avif", Qst = "new:qust", Loc = "new:lctn", LeveledList = "new:lvli", PluginName = "KitKraftVerify.esm", ChestId = 0x001036, PackInId = 0x001038, RefIds = [0x00102F, 0x001030, 0x001031, 0x001032, 0x001033, 0x001034, 0x001035, 0x001036, 0x001037, 0x001038, 0x001039, 0x00103A], Bases = ["new:acti", "new:stat", "new:mstt", "new:furn", "new:flor", "new:door", "new:ligh", "new:cont", "new:term", "new:pkin", "new:mug", "new:npc"], Labels = ["P20 ACTI", "P21 STAT", "P22 MSTT", "P23 FURN", "P24 FLOR", "P25 DOOR", "P26 LIGH", "P27 CONT", "P28 TERM", "P29 PKIN", "P30 MISC", "P31 NPC_"] } },
]

