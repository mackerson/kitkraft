# The bench verification mod (docs/bench/verify-mod.md): one plugin that gives a single
# `kit game session` evidence for as many typed-writable record types as the console and a
# self-reporting script can show. Starfield.esm is the only master. It owns new forms and
# changes the player in game (a faction, a perk, an actor value, items), so it is for the
# disposable session saves only (AGENTS.md, "Owner's live game is off limits").
#
# Compile first, so that out/verify/Scripts/KitKraft/VerifyReport.pex sits next to the
# plugin, then build (docs/bench/verify-mod.md, "Commands"):
#   kit papyrus compile docs/bench/verify-mod/scripts/KitKraft/VerifyReport.psc out/verify/Scripts --sources-zip "<Starfield>/Tools/ContentResources.zip"
#   kit build docs/bench/verify-mod/verify-mod.toml out/verify/KitKraftVerify.esm --overwrite
#
# Naming: every form's EditorID is `KKV<nn><Type>` and, where the type has a name, its
# FULL is `KKV<nn> <words>`; <nn> is unique, so no search term is a part of another (the
# console's `help` finds by part of a name, and the session routes a late `help` line by
# its term, crates/game/src/correlate.rs).
#
# FormIDs: `build` gives [[clone]] entries theirs first, then [[new]], then [[place]], each
# in spec order, from 0x001000.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# ---- Base forms placed in the test cell (checked by `getisid` and by the reporter) ----

