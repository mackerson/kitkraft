# CK bench batch (docs/bench/ck-sitting.md): MESG. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/MESG.toml out/bench/KCB_T_MESG.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:000177 HelpChargenRace: an early MESG of kit query, not a hard-coded help form.
name = "mesg_clone"
form = "Starfield.esm:000177"
edid = "KCB_MESG_Clone"

[[new]]
# A new MESG with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "mesg_new"
type = "MESG"
edid = "KCB_MESG_New"
