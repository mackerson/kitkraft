# CK bench batch (docs/bench/ck-sitting.md): AVIF. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/AVIF.toml out/bench/KCB_T_AVIF.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0002C3 Perception: a plain actor value (kit query's second).
name = "avif_clone"
form = "Starfield.esm:0002C3"
edid = "KCB_AVIF_Clone"

[[new]]
# A new AVIF with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "avif_new"
type = "AVIF"
edid = "KCB_AVIF_New"
