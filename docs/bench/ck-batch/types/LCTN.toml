# CK bench batch (docs/bench/ck-sitting.md): LCTN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/LCTN.toml out/bench/KCB_T_LCTN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:00ADD7: an LCTN with FULL, keywords, DATA, PNAM and no reference lists. The
# first sitting cloned 01295A CityNewAtlantisLocation, whose six reference lists (LCPR, LCUR,
# LCUN, LCSR, LCID, LCEP: the master world's references) the CK drops from a copy in another
# plugin (ck-20261117-15; triage-20261117.md, class C).
name = "lctn_clone"
form = "Starfield.esm:00ADD7"
edid = "KCB_LCTN_Clone"

[[new]]
# A new LCTN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "lctn_new"
type = "LCTN"
edid = "KCB_LCTN_New"
