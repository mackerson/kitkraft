# CK bench batch (docs/bench/ck-sitting.md): LCTN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/LCTN.toml out/bench/KCB_T_LCTN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:01295A CityNewAtlantisLocation: the LCTN whose edit dialog sitting 2 observed (S2-04).
name = "lctn_clone"
form = "Starfield.esm:01295A"
edid = "KCB_LCTN_Clone"

[[new]]
# A new LCTN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "lctn_new"
type = "LCTN"
edid = "KCB_LCTN_New"
