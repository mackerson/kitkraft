# CK bench batch (docs/bench/ck-sitting.md): REGN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/REGN.toml out/bench/KCB_T_REGN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:045A50 Region112: the first REGN kit query lists.
name = "regn_clone"
form = "Starfield.esm:045A50"
edid = "KCB_REGN_Clone"

[[new]]
# A new REGN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "regn_new"
type = "REGN"
edid = "KCB_REGN_New"
