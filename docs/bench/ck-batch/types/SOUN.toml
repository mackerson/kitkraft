# CK bench batch (docs/bench/ck-sitting.md): SOUN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/SOUN.toml out/bench/KCB_T_SOUN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001451 AMBIntSmallScienceMachine: an early SOUN of kit query.
name = "soun_clone"
form = "Starfield.esm:001451"
edid = "KCB_SOUN_Clone"

[[new]]
# A new SOUN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "soun_new"
type = "SOUN"
edid = "KCB_SOUN_New"
