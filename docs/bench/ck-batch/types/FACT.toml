# CK bench batch (docs/bench/ck-sitting.md): FACT. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/FACT.toml out/bench/KCB_T_FACT.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:00299F NASARobotFaction: an early FACT of kit query.
name = "fact_clone"
form = "Starfield.esm:00299F"
edid = "KCB_FACT_Clone"

[[new]]
# A new FACT with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "fact_new"
type = "FACT"
edid = "KCB_FACT_New"
