# CK bench batch (docs/bench/ck-sitting.md): NPC_. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/NPC_.toml out/bench/KCB_T_NPC.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:00BD3B EAW_AudioSlateChar01_Lydia_NoAppearanceData: fixture F07's NPC: small, no template.
name = "npc_clone"
form = "Starfield.esm:00BD3B"
edid = "KCB_NPC_Clone"

[[new]]
# A new NPC_ with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "npc_new"
type = "NPC_"
edid = "KCB_NPC_New"
