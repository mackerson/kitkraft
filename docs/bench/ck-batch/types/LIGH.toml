# CK bench batch (docs/bench/ck-sitting.md): LIGH. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/LIGH.toml out/bench/KCB_T_LIGH.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:000E09 LGT_Interior_Spot_NS_Neutral_001_20k: an early LIGH of kit query.
name = "ligh_clone"
form = "Starfield.esm:000E09"
edid = "KCB_LIGH_Clone"

[[new]]
# A new LIGH with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "ligh_new"
type = "LIGH"
edid = "KCB_LIGH_New"
