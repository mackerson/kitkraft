# CK bench batch (docs/bench/ck-sitting.md): FLOR. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/FLOR.toml out/bench/KCB_T_FLOR.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0242F8 FloraBloodStoneTall: the first FLOR kit query lists.
name = "flor_clone"
form = "Starfield.esm:0242F8"
edid = "KCB_FLOR_Clone"

[[new]]
# A new FLOR with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "flor_new"
type = "FLOR"
edid = "KCB_FLOR_New"
