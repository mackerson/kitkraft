# CK bench batch (docs/bench/ck-sitting.md): BOOK. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/BOOK.toml out/bench/KCB_T_BOOK.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001CF1 CF_KryxHistoryInterview_Slate001: the first BOOK kit query lists.
name = "book_clone"
form = "Starfield.esm:001CF1"
edid = "KCB_BOOK_Clone"

[[new]]
# A new BOOK with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "book_new"
type = "BOOK"
edid = "KCB_BOOK_New"
