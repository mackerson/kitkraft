# CK bench batch (docs/bench/ck-sitting.md): ARMA. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/ARMA.toml out/bench/KCB_T_ARMA.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001846 AA_Clothes_Varuun_Ambassador_LowerBody: the first ARMA kit query lists.
name = "arma_clone"
form = "Starfield.esm:001846"
edid = "KCB_ARMA_Clone"

[[new]]
# A new ARMA with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "arma_new"
type = "ARMA"
edid = "KCB_ARMA_New"
