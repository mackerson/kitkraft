# CK bench batch (docs/bench/ck-sitting.md): STDT. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/STDT.toml out/bench/KCB_T_STDT.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:05E5BF BohrStar: the first STDT after two test stars (skipped).
name = "stdt_clone"
form = "Starfield.esm:05E5BF"
edid = "KCB_STDT_Clone"
# A system ID of its own: the CK reassigned the copy's (its source's 73018) to 119226 and
# the new star's 0 to 119227 (ck-20261117-18; triage-20261117.md, class C).
fields = { DNAM = 119226 }

[[new]]
# A new STDT with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "stdt_new"
type = "STDT"
edid = "KCB_STDT_New"
fields = { DNAM = 119227 }
