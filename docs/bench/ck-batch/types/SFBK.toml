# CK bench batch (docs/bench/ck-sitting.md): SFBK. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/SFBK.toml out/bench/KCB_T_SFBK.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:002FA1 OverlayBlockOverlayPOIBiomeDenVolcanicRough01: the first SFBK kit query lists.
name = "sfbk_clone"
form = "Starfield.esm:002FA1"
edid = "KCB_SFBK_Clone"

[[new]]
# A new SFBK with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "sfbk_new"
type = "SFBK"
edid = "KCB_SFBK_New"
