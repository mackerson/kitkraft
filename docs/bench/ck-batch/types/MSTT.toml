# CK bench batch (docs/bench/ck-sitting.md): MSTT. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/MSTT.toml out/bench/KCB_T_MSTT.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001621 ThermalVentSmoke: the first MSTT kit query lists.
name = "mstt_clone"
form = "Starfield.esm:001621"
edid = "KCB_MSTT_Clone"

[[new]]
# A new MSTT with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "mstt_new"
type = "MSTT"
edid = "KCB_MSTT_New"
