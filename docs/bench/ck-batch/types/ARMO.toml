# CK bench batch (docs/bench/ck-sitting.md): ARMO. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/ARMO.toml out/bench/KCB_T_ARMO.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0028A5 Clothes_Medical_Doctor_01_Medic: the first ARMO after Skin_Naked (a reserved skin, skipped).
name = "armo_clone"
form = "Starfield.esm:0028A5"
edid = "KCB_ARMO_Clone"

[[new]]
# A new ARMO with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "armo_new"
type = "ARMO"
edid = "KCB_ARMO_New"
