# CK bench batch (docs/bench/ck-sitting.md): PERK. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/PERK.toml out/bench/KCB_T_PERK.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001301 perk_Legendary_Armor_CarryWeight_Resources: the first PERK kit query lists.
name = "perk_clone"
form = "Starfield.esm:001301"
edid = "KCB_PERK_Clone"

[[new]]
# A new PERK with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "perk_new"
type = "PERK"
edid = "KCB_PERK_New"
