# CK bench batch (docs/bench/ck-sitting.md): PKIN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/PKIN.toml out/bench/KCB_T_PKIN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0121EC SC_LD_CratesMedium02: the mini-site recipe's pack-in.
name = "pkin_clone"
form = "Starfield.esm:0121EC"
edid = "KCB_PKIN_Clone"

[[new]]
# A new PKIN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "pkin_new"
type = "PKIN"
edid = "KCB_PKIN_New"
