# CK bench batch (docs/bench/ck-sitting.md): AMDL. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/AMDL.toml out/bench/KCB_T_AMDL.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:009CEC BaseSniperRifle_AM: the first AMDL kit query lists.
name = "amdl_clone"
form = "Starfield.esm:009CEC"
edid = "KCB_AMDL_Clone"

[[new]]
# A new AMDL with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "amdl_new"
type = "AMDL"
edid = "KCB_AMDL_New"
