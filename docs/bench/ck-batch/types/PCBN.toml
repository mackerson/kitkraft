# CK bench batch (docs/bench/ck-sitting.md): PCBN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/PCBN.toml out/bench/KCB_T_PCBN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0074C4 PCM_CellLoad_Creatures_Prey: the first PCBN kit query lists.
name = "pcbn_clone"
form = "Starfield.esm:0074C4"
edid = "KCB_PCBN_Clone"

[[new]]
# A new PCBN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "pcbn_new"
type = "PCBN"
edid = "KCB_PCBN_New"
