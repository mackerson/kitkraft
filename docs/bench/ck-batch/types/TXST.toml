# CK bench batch (docs/bench/ck-sitting.md): TXST. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/TXST.toml out/bench/KCB_T_TXST.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0016BA Decal_DirtGravelA: the first TXST after NullTextureSet (a reserved form, skipped).
name = "txst_clone"
form = "Starfield.esm:0016BA"
edid = "KCB_TXST_Clone"

[[new]]
# A new TXST with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "txst_new"
type = "TXST"
edid = "KCB_TXST_New"
