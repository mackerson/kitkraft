# CK bench batch (docs/bench/ck-sitting.md): LVLP. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/LVLP.toml out/bench/KCB_T_LVLP.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:000B22 ENV_LPI_Vent_Geyser_ExtremeHeat_Statics: the first LVLP kit query lists.
name = "lvlp_clone"
form = "Starfield.esm:000B22"
edid = "KCB_LVLP_Clone"

[[new]]
# A new LVLP with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "lvlp_new"
type = "LVLP"
edid = "KCB_LVLP_New"
