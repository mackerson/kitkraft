# CK bench batch (docs/bench/ck-sitting.md): PACK. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/PACK.toml out/bench/KCB_T_PACK.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:001BD4 CF04_CompanionKeyPackage: an early PACK of kit query.
name = "pack_clone"
form = "Starfield.esm:001BD4"
edid = "KCB_PACK_Clone"

[[new]]
# A new PACK with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "pack_new"
type = "PACK"
edid = "KCB_PACK_New"
