# CK bench batch (docs/bench/ck-sitting.md): FLST. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/FLST.toml out/bench/KCB_T_FLST.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:000163 HelpManualPC: the first FLST kit query lists.
name = "flst_clone"
form = "Starfield.esm:000163"
edid = "KCB_FLST_Clone"

[[new]]
# A new FLST with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "flst_new"
type = "FLST"
edid = "KCB_FLST_New"
