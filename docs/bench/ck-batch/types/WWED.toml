# CK bench batch (docs/bench/ck-sitting.md): WWED. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/WWED.toml out/bench/KCB_T_WWED.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:000817 WwiseEvent_QST_UC08_Door_Remote_Unlock: the first WWED kit query lists.
name = "wwed_clone"
form = "Starfield.esm:000817"
edid = "KCB_WWED_Clone"

[[new]]
# A new WWED with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "wwed_new"
type = "WWED"
edid = "KCB_WWED_New"
