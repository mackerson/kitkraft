# CK bench batch (docs/bench/ck-sitting.md): OMOD. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/OMOD.toml out/bench/KCB_T_OMOD.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:002983 mod_Legendary_Armor_03_Incendiary: the first OMOD kit query lists.
name = "omod_clone"
form = "Starfield.esm:002983"
edid = "KCB_OMOD_Clone"

[[new]]
# A new OMOD with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "omod_new"
type = "OMOD"
edid = "KCB_OMOD_New"
