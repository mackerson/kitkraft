# CK bench batch (docs/bench/ck-sitting.md): SFPT. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/SFPT.toml out/bench/KCB_T_SFPT.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0015E2 PatternSettleNewHomesteadWorld: the first SFPT kit query lists.
name = "sfpt_clone"
form = "Starfield.esm:0015E2"
edid = "KCB_SFPT_Clone"

[[new]]
# A new SFPT with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "sfpt_new"
type = "SFPT"
edid = "KCB_SFPT_New"
