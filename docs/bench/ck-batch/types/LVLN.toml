# CK bench batch (docs/bench/ck-sitting.md): LVLN. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/LVLN.toml out/bench/KCB_T_LVLN.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:0042A2 _SQ_Group_Occupation_LChar_Old: the first LVLN kit query lists.
name = "lvln_clone"
form = "Starfield.esm:0042A2"
edid = "KCB_LVLN_Clone"

[[new]]
# A new LVLN with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "lvln_new"
type = "LVLN"
edid = "KCB_LVLN_New"
