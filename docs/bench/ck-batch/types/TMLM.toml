# CK bench batch (docs/bench/ck-sitting.md): TMLM. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/TMLM.toml out/bench/KCB_T_TMLM.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:227DA9 DefaultBlankTerminal_Genesis: the mini-site recipe's empty terminal menu.
name = "tmlm_clone"
form = "Starfield.esm:227DA9"
edid = "KCB_TMLM_Clone"

[[new]]
# A new TMLM with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "tmlm_new"
type = "TMLM"
edid = "KCB_TMLM_New"
