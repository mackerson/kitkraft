# CK bench batch (docs/bench/ck-sitting.md): QUST. One vanilla clone and one new record.
# Starfield.esm is the only master. Standalone: kit build docs/bench/ck-batch/types/QUST.toml out/bench/KCB_T_QUST.esp
# build.ps1 also joins the part below "--- body ---" into its group plugin (groups.toml), so
# every name is prefixed with the type.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# --- body ---

[[clone]]
# Starfield.esm:00637D: a QUST with stages and a script (VMAD) and no aliases. The first
# sitting cloned 00118F MQ_TutorialQuest_Misc06, whose VMAD alias block names an alias of the
# source quest (00118F); the CK drops that block from the copy (ck-20261117-17;
# triage-20261117.md, class C).
name = "qust_clone"
form = "Starfield.esm:00637D"
edid = "KCB_QUST_Clone"

[[new]]
# A new QUST with its EditorID only: what the CK makes of KitKraft's minimal record.
name = "qust_new"
type = "QUST"
edid = "KCB_QUST_New"
