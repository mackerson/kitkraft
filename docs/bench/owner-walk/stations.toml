# The owner walk (docs/bench/owner-walk/README.md): the stations `kit walk` takes the owner
# through, in walking order, for `KitKraftOwnerWalk.esm` (owner-walk.toml). Format:
# `kitkraft_game::walk` (crates/game/src/walk.rs). `{id:<EditorID>}` is the runtime ID of
# that form of the plugin in the profile's load order, which `kit walk` reads from the
# built plugin and the profile; vanilla forms are written as their runtime IDs (Starfield.esm
# loads first, so its runtime ID is its FormID).
#
# Vanilla forms used: iron 000057C7, aluminum 000057D6, copper 000057CF, sealant 0007782D
# (docs/recipes/workshop.md, fabricator.md), AmmoShotgun 000547A1 (fabricator.md), the
# hunting rifle 0021BBCD (the rename plugin), Maelstrom 002984DF, Hard Target 000546CC and
# Drum Beat 0018DE2C (docs/overhaul/build-2.md, O5-03, O5-10, O5-11), the apartment
# 0021966F and the embassy 00017307 (cells), the embassy's vanilla owner 0024F839
# (docs/recipes/ownership.md).
#
# Console facts these rows rest on: `player.getitemcount`, `getglobalvalue <runtime ID>`,
# `player.getincell <cell ID>`, `prid` + `getisid` answered in game (game-20261116-03, -04;
# docs/bench/verify-mod.md, method a'). `player.GetStolenItemValueNoCrime`,
# `player.GetStolenItemValue` and `player.GetCrimeGold` are condition functions of the
# Starfield list (crates/schema/defs/common/Condition.toml, 366, 373, 459); whether the
# console answers them is not observed, so they are recorded, never graded.
format = 1
title = "KitKraft owner walk (M4 rows O4-01, O4-02, O4-05, O4-06, W12, O5-15, OnActivate)"
plugin = "KitKraftOwnerWalk.esm"
also_record = ["OldSovietMarksmanRifle.esm", "KitKraftGunOverhaul.esm"]
ready_command = "GetSFSEVersion"
ready_expect = "SFSE version"
quiet_secs = 8
ready_secs = 180
notes = [
  "Rows judged `owner` rest on the owner's eyes (owner report); the console numbers in their Seen column are recorded, not graded.",
  "The stolen-goods and crime-gold numbers are recorded only: no session has observed the console answer those functions yet.",
]

[[station]]
id = "W-00"
title = "check-in: in the apartment, the walk plugin loaded at the slot kit walk computed (GLOB `KKW02Glob`)"
forms = ["KitKraftOwnerWalk.esm:00100B", "KKW02Glob", "{id:KKW02Glob}"]
say = [
  "In the console: coc CityNewAtlantisApartmentTEMPLATE   (then close the console).",
  "When the apartment has loaded, press Enter here. If this station fails, type q and read the README's troubleshooting.",
]
expected = "The player is in the apartment (GetInCell 1); the walk plugin's global answers under its runtime ID (a wrong slot answers Item ... not found)"
judge = "console"
[[station.check]]
command = "player.getincell 0021966F"
matcher = "regex"
expected = '(?m)>>\s*1(\.0+)?\s*$'
why = "the apartment, CityNewAtlantisApartmentTEMPLATE (game-20261103-07 T-01 shape)"
[[station.check]]
command = "getglobalvalue {id:KKW02Glob}"
matcher = "regex"
expected = '>>\s*\d'
why = "getglobalvalue <runtime ID> answered GetGlobalValue >> 4242.00 for the verification mod (game-20261116-04, V-C-GLOB)"

