  "Go to the bedroom (the room with the double bed). Three mugs stand on the floor near the foot of the bed. The first is a mug named KKW10 Owned Mug.",
  "Look at it with the crosshair, but do not take it yet.",
]
expected = "The prompt reads Steal (in red): the faction KKW01 Walk Owners owns it and the player is not in it"
