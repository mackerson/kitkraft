# The owner walk-test mod (docs/bench/owner-walk/README.md): one plugin for one short sitting
# of the owner at the controls, with `kit walk` recording the console's side. Starfield.esm
# is the only master. It owns new forms (a faction, a global, items, a container, a switch,
# a coffee maker and two recipes) and places references, so it is for the disposable saves
# of the `Kitkraft Dev` profile only (AGENTS.md, "Owner's live game is off limits").
#
# Compile first, so that out/owner-walk/Scripts/KitKraft/WalkSwitch.pex sits next to the
# plugin, then build:
#   kit papyrus compile docs/bench/owner-walk/scripts/KitKraft/WalkSwitch.psc out/owner-walk/Scripts --sources-zip "<Starfield>/Tools/ContentResources.zip"
#   kit build docs/bench/owner-walk/owner-walk.toml out/owner-walk/KitKraftOwnerWalk.esm --overwrite
#
# Reused recipes: the outpost coffee maker and its recipe (docs/recipes/workshop.toml), the
# fabricator shotgun shells (docs/recipes/fabricator.toml), the embassy owned by
# PlayerFaction (docs/recipes/ownership.toml), the faction-as-owner of
# docs/recipes/ownership-faction.toml (here on references), the cloned items and locker of
# the verification mod (docs/bench/verify-mod/verify-mod.toml) and a switch carrying a
# script, as the scripts recipe's (docs/recipes/scripts.toml).
#
# Naming: every form's EditorID is `KKW<nn><Type>` and its FULL `KKW<nn> <words>`, so the
# owner can tell each station's object by its name on screen. `kit walk` finds each form
# by its EditorID in the built plugin (stations.toml `{id:<EditorID>}`), so no object ID is
# written by hand.
#
# Only one KitKraft plugin that places into the apartment should be enabled with this one:
# the verification mod's references stand in the same row (y -8), so keep it disabled.
version = 3

[load_order]
plugins = ["Starfield.esm"]

# ---- Items for the ownership stations (W-01 to W-05) ----

[[clone]]
# CoffeeMug01 ("Coffee Mug"): owned by the walk faction on the floor (W-01, W-02). A
# value no vanilla item has, so a change in the stolen-goods value names it.
name = "owned_mug"
form = "Starfield.esm:03EDC8"
edid = "KKW10Misc"
fields = { FULL = "KKW10 Owned Mug", "DATA.Value" = 4321 }
brief = "owner-walk"

[[clone]]
# The unowned control (W-03).
name = "free_mug"
form = "Starfield.esm:03EDC8"
edid = "KKW11Misc"
fields = { FULL = "KKW11 Free Mug", "DATA.Value" = 1234 }
brief = "owner-walk"

[[clone]]
# Owned by the player (W-04).
name = "your_mug"
form = "Starfield.esm:03EDC8"
edid = "KKW12Misc"
fields = { FULL = "KKW12 Your Mug", "DATA.Value" = 2345 }
brief = "owner-walk"

[[clone]]
# Tool_Wrench01 ("Wrench"): three of them in the owned locker (W-05).
name = "wrench"
form = "Starfield.esm:20B97C"
edid = "KKW13Misc"
fields = { FULL = "KKW13 Locker Wrench", "DATA.Value" = 111 }
brief = "owner-walk"

[[clone]]
# Never placed: `kit walk` adds one after the owner saves (W-09), so a count back to what
# it was before proves the reload of W-10 happened.
name = "marker"
form = "Starfield.esm:03EDC8"
edid = "KKW14Misc"
fields = { FULL = "KKW14 Reload Marker", "DATA.Value" = 1 }
brief = "owner-walk"

[[clone]]
# CaptainsLocker01 ("Captain's Locker"), as the verification mod's: its first inventory
# entry becomes three of the wrench above.
name = "locker"
form = "Starfield.esm:17964B"
edid = "KKW20Cont"
fields = { FULL = "KKW20 Owned Locker", COCT = 1, "CNTO.Item" = "new:wrench", "CNTO.Count" = 3 }
brief = "owner-walk"

[[clone]]
# ActivatorSwitch01 ("Switch"), the scripts recipe's base: no VMAD, has a model.
name = "switch"
form = "Starfield.esm:03CCF4"
edid = "KKW30Acti"
fields = { FULL = "KKW30 Walk Switch" }
brief = "owner-walk"

# ---- The workshop and fabricator recipes, as docs/recipes/workshop.toml and fabricator.toml ----

[[clone]]
# CoffeeBrewingMachine01 ("Coffee Maker"), the STAT co_Outpost_Decor_CoffeeMaker01 creates.
name = "coffee"
form = "Starfield.esm:136FDF"
edid = "KKW40Stat"
fields = { FULL = "KKW40 Coffee Maker" }
brief = "owner-walk"

[[clone]]
# co_Outpost_Decor_CoffeeMaker01: BNAM OutpostCategoryDecorations, no conditions; CNAM the
# clone above (W-12, row O4-05).
name = "coffee_recipe"
form = "Starfield.esm:039657"
edid = "KKW41Cobj"
fields = { CNAM = "new:coffee" }
brief = "owner-walk"

[[clone]]
# co_mfg_Tier01_AdaptiveFrame: BNAM WorkbenchIndustrialKeyword, no condition, FNAM
# RecipeManufactured, one iron and one aluminum; makes 6 AmmoShotgun (W-07, row O4-06).
name = "shells"
form = "Starfield.esm:2457C1"
edid = "KKW42Cobj"
brief = "owner-walk"

[clone.fields]
CNAM = "Starfield.esm:0547A1"
NNAM = 6
DESC = "KKW42: KitKraft walk recipe, shotgun shells from iron and aluminum."
DATA = 0

# ---- New forms ----

[[new]]
# The owner of the owned mug and the owned locker: a faction the player is not in, with
# only a name (docs/recipes/ownership-faction.toml).
name = "owners"
type = "FACT"
edid = "KKW01Fact"
fields = { FULL = "KKW01 Walk Owners" }
brief = "owner-walk"

[[new]]
# How many times the switch was activated (KitKraft:WalkSwitch, W-06).
name = "counter"
type = "GLOB"
edid = "KKW02Glob"
fields = { FLTV = 0.0 }
brief = "owner-walk"

# ---- The embassy owned by PlayerFaction (docs/recipes/ownership.toml; W-11, rows O4-01, O4-02) ----

[[set]]
# CityNewAtlantisFreestarEmbassy: XOWN.Owner Starfield.esm:24F839 -> PlayerFaction.
form = "Starfield.esm:017307"
fields = { "XOWN.Owner" = "Starfield.esm:01C21C" }
brief = "owner-walk"

# ---- The stations: CityNewAtlantisApartmentTEMPLATE, on a deck this plugin lays itself.
# The cell's own floor pieces show where the rooms are (kit cell --with-bounds): the bedroom
# is x -25..-17, y -6..-2, the living floor x -21..-9, y 2..18. Two earlier builds guessed a
# spot and missed: the row at y -8 (where the verification mod's references stood) is behind
# the bedroom's south wall, and the owner saw the mugs fall (2026-11-17); the first POI's
# crate at (-17, -4) is on the bedroom's east wall line, and the owner never found it.
# So the stations stand outside the walls, south of the bedroom, on ten of the apartment's
# own 4 m floor tiles (ComIntAddonRmSmMidBotB01, Starfield.esm:20BDF3): x -32..-12,
# y -15..-7, z 4.63. The row of objects is at y -9; the player stands south of it. W-01's
# setup moves the player there (player.moveto), since no door leads to it. ----

[[place]]
name = "deck_01"
base = "Starfield.esm:20BDF3"
cell = "Starfield.esm:21966F"
position = [-14.0, -9.0, 4.63]
persistent = true
edid = "KKW60DeckRef"
brief = "owner-walk"

