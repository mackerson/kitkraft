# Support-depth evidence (lane D, 2026-10-15): what the `coverage --matrix` command reads
# for the four statuses it cannot measure on the corpus itself. See
# docs/schema/support-matrix.md for what each status means and how to add a row.
#
# One [[entry]] per (record type, status):
#   type     = the record signature ("WEAP")
#   status   = "typed-writable" | "ck-differential-tested" | "game-runtime-tested"
#              | "save-reload-verified"
#   result   = "pass" | "fail" | "inconclusive" (AGENTS.md "Reporting")
#   evidence = pointers to the proof, each one of
#              "test: <file>::<fn name>"     a test in this repository
#              "doc: <file>#<section>"       a Markdown heading, or a line starting with **
#              "ledger: <entry id>"          docs/game-observations.md or ck-observations.md
#   note     = optional, our words
#
# A type and status with no entry is `not-run`. A `pass` whose pointers do not all resolve
# is shown `inconclusive`; `crates/engine/src/handlers/matrix.rs`
# (every_evidence_pointer_resolves) fails the gate when one does not resolve. Never
# record a status the evidence does not show: schema presence, a typed member or a passing
# unit test is not game-runtime support (owner ruling 2026-10-15).

# Typed-writable: a test writes the type through `new`/`set`/`build` (or `place` with
# `fields`, for a reference), re-reads it, and `validate` passes.

