# Variant A of the first POI (docs/poi/first-poi.toml): the same crate as a temporary
# reference (cell temporary children, group type 9, no 0x400 flag, no EditorID), the shape of
# 98.4% of Starfield.esm interior REFRs (1,934,939 of 1,965,705) and of most third-party new
# refs in vanilla cells (docs/poi/first-poi-investigation.md).
# Build: kit build docs/poi/variants/first-poi-temporary.toml out/poi/variants/KitKraftFirstPOITemp.esm
# (Data dir from KITKRAFT_DATA_DIR; Starfield.esm is the only master.)
version = 3

[load_order]
plugins = ["Starfield.esm"]

[[place]]
name = "first_poi_temporary"
# Crate_MilitarySupply_01 (STAT), a military supply crate.
base = "Starfield.esm:1E4FBD"
# CityNewAtlantisApartmentTEMPLATE ("Player House Apartment"): a small New Atlantis
# apartment interior; one version on the owner's Default profile (no mod overrides it).
cell = "Starfield.esm:21966F"
# On the floor (z 4.63, as the cell's REFR 001B21E0 at (-17, -6)), two units from it.
position = [-17.0, -4.0, 4.63]
rotation = [0.0, 0.0, 3.14]
persistent = false
brief = "M4 first POI, variant A: temporary reference"
